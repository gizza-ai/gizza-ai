[workspace]
resolver = "2"
members = ["."]

[package]
name = "gizza-tool-pages"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "gizza-tool-pages"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
maud = "0.26"
pulldown-cmark = "0.12"

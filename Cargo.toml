[package]
name = "gizza-ai"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Browser-local AI chat site with wasm skill blocks"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pipe Rust panics to the browser console instead of cryptic wasm
# `unreachable` traps — critical for debugging the MVP.
console_error_panic_hook = "0.1"

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Request", "Response", "ResponseInit", "Headers", "ReadableStream", "Url", "WorkerGlobalScope", "console"] }
js-sys = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock", "wasmbind"] }
base64 = "0.22"
hex = "0.4"
thiserror = "1"

# Async
async-trait = "0.1"
# "std" (implies "alloc") additionally enables futures::lock — the async
# Mutex lazy_skill.rs uses to single-flight concurrent first-use wasm loads.
futures = { version = "0.3", default-features = false, features = ["std"] }

# HTML templating (for the UI block, Task 6)
maud = { version = "0.26", default-features = false }

# Shared header/footer/icon chrome (chat app + static tool pages share one copy).
gizza-chrome = { path = "chrome" }

# WAFER runtime — `branch = "main"` here, but the committed Cargo.lock pins
# the exact sha (kept in wafer-run-pin.txt; CI enforces they agree), so
# deploys can't float onto a broken wafer-run main. Bump procedure: edit
# wafer-run-pin.txt, then `cargo update` here, in cli/, and in block-utils/.
# For local dev against an unmerged sibling checkout, copy
# .cargo/config.toml.example to .cargo/config.toml (gitignored).
# default-features = false everywhere: the `wasm` default feature pulls in
# tokio/reqwest which do not compile on wasm32.
wafer-run = { git = "https://github.com/wafer-run/wafer-run", branch = "main", default-features = false, features = ["wasmi"] }
wafer-block = { git = "https://github.com/wafer-run/wafer-run", branch = "main" }
wafer-core = { git = "https://github.com/wafer-run/wafer-run", branch = "main" }
wafer-sql-utils = { git = "https://github.com/wafer-run/wafer-run", branch = "main" }

# Solobase — path deps (sibling checkout; can be switched to git later).
solobase-core = { path = "../solobase/crates/solobase-core", default-features = false }
solobase-browser = { path = "../solobase/crates/solobase-browser" }

# Shared helpers across all gizza-ai skill blocks (URL parsing, MIME tables,
# ffmpeg-runtime dispatch, response envelope, quality validation).
gizza-ai-block-utils = { path = "block-utils" }

[build-dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# uuid v4 needs a JS RNG source on wasm32
uuid = { version = "1", features = ["v4", "js"] }
# JS-backed timer for per-frame stream timeouts in agent.rs.
# tokio::time::timeout panics on wasm32-unknown-unknown because std::Instant
# isn't supported there; gloo-timers wraps the JS setTimeout API instead.
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
async-trait = "0.1"

# Size-optimized release profile for the Cloudflare-Pages wasm bundle.
# `solobase build` compiles this crate to wasm with `--release`; without
# these settings the app wasm is ~29 MB and Cloudflare Pages rejects it
# ("Pages only supports files up to 25 MiB in size"). With them it drops
# to a few MB. Mirrors solobase's and site's release profiles (and is what
# solobase's own cloudflare `profile_check` recommends).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# wasm-opt flags for the `--release` build that `solobase build --release`
# runs via `wasm-pack`. Two things matter here:
#   * `--all-features` — rustc emits bulk-memory ops (memory.copy/fill) by
#     default, but wasm-pack's bundled `wasm-opt` rejects them unless the
#     feature is enabled ("Bulk memory operations require bulk memory
#     [--enable-bulk-memory]"), so the default `wasm-opt -O` aborts validation.
#   * `-Oz` — size-optimize, which (with `[profile.release]` above) keeps the
#     bundle under Cloudflare Pages' 25 MiB per-file limit.
# Mirrors solobase-web / solobase-browser, the proven Cloudflare wasm build.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--all-features"]

# Debug builds skip wasm-opt entirely (fast iteration; size doesn't matter).
[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

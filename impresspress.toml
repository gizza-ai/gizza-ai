[app]
name = "gizza-ai"
title = "Gizza AI"
boot_redirect = "/chat"

[impresspress]
manifest_path = "../impresspress"

[assets]
opfs_wipe_on_recovery = true
# Serve the apex chooser (site/index.html) as a static asset the SW never
# intercepts, so it renders even when the runtime can't boot. Exact-match
# (not prefix) because "/" can't be a startsWith prefix. Requires impresspress
# >= c67ba6f (extra_bypass_exact support).
extra_bypass_exact = ["/", "/index.html"]
# `/blocks/` serves the per-skill wasm the chat app lazy-loads on first use
# (see build.rs / src/lazy_skill.rs). Without this the SW routes /blocks/*.wasm
# through the WAFER runtime, which has no such route and returns 404 — so a
# skill's block would fail to fetch. (The app's own SW-internal fetch bypasses
# the handler regardless, but a page-context fetch must resolve to the static
# asset too, and relying on the bypass is fragile.)
extra_bypass_prefix = ["/gizza-app.js", "/gizza.css", "/mascot.js", "/mascot.css", "/render.js", "/pending.js", "/gis.png", "/gis_no_eyes.png", "/gis_a_job_no_eyes.png", "/eye.png", "/gis_video_idle.mp4", "/gis_video_typing_loop.mp4", "/gis_video_typing_finish.mp4", "/favicon.ico", "/favicon-32.png", "/apple-touch-icon.png", "/logo.webp", "/model-picker.js", "/model-picker.css", "/tool.js", "/tool.css", "/tools/", "/tools-modal.js", "/tools-modal.css", "/ffmpeg-engine.js", "/ffmpeg.js", "/header.js", "/header.css", "/tools-index.js", "/sitemap.xml", "/robots.txt", "/llms.txt", "/blocks/"]

[[assets.overlay]]
from = "site/index.html"
to = "index.html"

[[assets.overlay]]
from = "site/chat.html"
to = "chat.html"

[[assets.overlay]]
from = "site/gizza-app.js"
to = "gizza-app.js"

[[assets.overlay]]
from = "site/gizza.css"
to = "gizza.css"

# Shared animated-mascot module + styles — reused by both the chat shell
# (render_chat) and the static apex chooser (site/index.html). SW-bypassed via
# extra_bypass_prefix above so the chooser can load them while staying inert.
[[assets.overlay]]
from = "site/mascot.js"
to = "mascot.js"

[[assets.overlay]]
from = "site/mascot.css"
to = "mascot.css"

[[assets.overlay]]
from = "site/render.js"
to = "render.js"

[[assets.overlay]]
from = "site/pending.js"
to = "pending.js"

[[assets.overlay]]
from = "site/gis.png"
to = "gis.png"

[[assets.overlay]]
from = "site/gis_no_eyes.png"
to = "gis_no_eyes.png"

[[assets.overlay]]
from = "site/gis_a_job_no_eyes.png"
to = "gis_a_job_no_eyes.png"

[[assets.overlay]]
from = "site/eye.png"
to = "eye.png"

[[assets.overlay]]
from = "site/gis_video_idle.mp4"
to = "gis_video_idle.mp4"

[[assets.overlay]]
from = "site/gis_video_typing_loop.mp4"
to = "gis_video_typing_loop.mp4"

[[assets.overlay]]
from = "site/gis_video_typing_finish.mp4"
to = "gis_video_typing_finish.mp4"

[[assets.overlay]]
from = "site/favicon.ico"
to = "favicon.ico"

[[assets.overlay]]
from = "site/favicon-32.png"
to = "favicon-32.png"

[[assets.overlay]]
from = "site/apple-touch-icon.png"
to = "apple-touch-icon.png"

[[assets.overlay]]
from = "site/logo.webp"
to = "logo.webp"

[[assets.overlay]]
from = "site/model-picker.js"
to = "model-picker.js"

[[assets.overlay]]
from = "site/model-picker.css"
to = "model-picker.css"

[[assets.overlay]]
from = "site/tools-modal.js"
to = "tools-modal.js"

[[assets.overlay]]
from = "site/tools-modal.css"
to = "tools-modal.css"

[[assets.overlay]]
from = "static/_headers"
to = "_headers"

[[assets.overlay]]
from = "static/test-fixtures/web-fetch.txt"
to = "test-fixtures/web-fetch.txt"

# Chat ffmpeg page-side bridge: the page engine + the shared ffmpeg.js it
# imports, served at root and SW-bypassed (see js/ffmpeg-engine.js).
[[assets.overlay]]
from = "js/ffmpeg-engine.js"
to = "ffmpeg-engine.js"

[[assets.overlay]]
from = "js/ffmpeg.js"
to = "ffmpeg.js"

# Shared chrome assets: header behavior + styling + tools-index search core.
# Served at root and SW-bypassed so the chat app and any in-browser navigation
# can reach them without the service worker intercepting (mirrors tools-modal.*).
[[assets.overlay]]
from = "tools/generator/assets/runtime/header.js"
to = "header.js"

[[assets.overlay]]
from = "tools/generator/assets/runtime/header.css"
to = "header.css"

[[assets.overlay]]
from = "tools/generator/assets/runtime/tools-index.js"
to = "tools-index.js"

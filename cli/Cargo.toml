[package]
name = "gizza-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Headless CLI to run gizza skill tools"
license = "MIT"

[lib]
name = "gizza_cli"
path = "src/lib.rs"

[[bin]]
name = "gizza"
path = "src/bin/gizza.rs"

[dependencies]
# Native runtime: the `wasm` feature bundles wasmi + reqwest + tokio (rt-multi-thread).
wafer-run = { git = "https://github.com/wafer-run/wafer-run", rev = "f0ca9c79abbefb4647cc73d15b92bbcd4043e03b", default-features = false, features = ["wasm"] }
wafer-block = { git = "https://github.com/wafer-run/wafer-run", rev = "f0ca9c79abbefb4647cc73d15b92bbcd4043e03b" }
wafer-core = { git = "https://github.com/wafer-run/wafer-run", rev = "f0ca9c79abbefb4647cc73d15b92bbcd4043e03b" }
wafer-block-network = { git = "https://github.com/wafer-run/wafer-run", rev = "f0ca9c79abbefb4647cc73d15b92bbcd4043e03b" }
gizza-ai-block-utils = { path = "../block-utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
# io-std + io-util: async stdin line-reader for the `gizza mcp` stdio server.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
anyhow = "1"
tempfile = "3"
async-trait = "0.1"

# The test suites boot the whole embedded catalogue (1440 modules) once per
# test. Unoptimised, wasmparser's validation and wasmi's loading dominate that:
# one boot takes about 117 s at opt-level 0 and about 15 s with these settings.
# The release profile already optimises everything; this only affects dev/test.
[profile.dev.package.wasmparser]
opt-level = 3
# wasmi stays at opt-level 1 on purpose. At 2, 3, "s" or "z" its build.rs picks
# tail-call dispatch, which relies on LLVM sibling-call optimisation; in this
# mixed debug profile that optimisation did not happen and the interpreter
# overflowed the test thread's stack. At 1 it keeps the portable loop dispatch.
[profile.dev.package.wasmi]
opt-level = 1
[profile.dev.package.wasmi_ir]
opt-level = 1
[profile.dev.package.wasmi_core]
opt-level = 1

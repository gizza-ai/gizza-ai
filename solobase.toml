[app]
name = "gizza-ai"
title = "Gizza AI"
boot_redirect = "/"

[solobase]
manifest_path = "../solobase"

[assets]
extra_bypass_prefix = ["/gizza-app.js", "/gizza.css", "/render.js"]

[[assets.overlay]]
from = "site/index.html"
to = "index.html"

[[assets.overlay]]
from = "site/gizza-app.js"
to = "gizza-app.js"

[[assets.overlay]]
from = "site/gizza.css"
to = "gizza.css"

[[assets.overlay]]
from = "site/render.js"
to = "render.js"

[[assets.overlay]]
from = "static/CNAME"
to = "CNAME"

[[assets.overlay]]
from = "static/_headers"
to = "_headers"

[[assets.overlay]]
from = "static/test-fixtures/web-fetch.txt"
to = "test-fixtures/web-fetch.txt"

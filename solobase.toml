[app]
name = "gizza-ai"
title = "Gizza AI"
boot_redirect = "/"

[solobase]
manifest_path = "../solobase"

[assets]
extra_bypass_prefix = ["/gizza-app.js", "/gizza.css", "/render.js", "/pending.js", "/gis.png", "/gis_no_eyes.png", "/gis_a_job_no_eyes.png", "/eye.png", "/gis_video_idle.mp4", "/gis_video_typing_loop.mp4", "/gis_video_typing_finish.mp4", "/favicon.ico", "/favicon-32.png", "/apple-touch-icon.png", "/logo.webp", "/model-picker.js", "/model-picker.css", "/tool.js", "/tool.css", "/tools/", "/tools-modal.js", "/tools-modal.css"]

[[assets.overlay]]
from = "site/index.html"
to = "index.html"

[[assets.overlay]]
from = "site/gizza-app.js"
to = "gizza-app.js"

[[assets.overlay]]
from = "site/gizza.css"
to = "gizza.css"

[[assets.overlay]]
from = "site/render.js"
to = "render.js"

[[assets.overlay]]
from = "site/pending.js"
to = "pending.js"

[[assets.overlay]]
from = "site/gis.png"
to = "gis.png"

[[assets.overlay]]
from = "site/gis_no_eyes.png"
to = "gis_no_eyes.png"

[[assets.overlay]]
from = "site/gis_a_job_no_eyes.png"
to = "gis_a_job_no_eyes.png"

[[assets.overlay]]
from = "site/eye.png"
to = "eye.png"

[[assets.overlay]]
from = "site/gis_video_idle.mp4"
to = "gis_video_idle.mp4"

[[assets.overlay]]
from = "site/gis_video_typing_loop.mp4"
to = "gis_video_typing_loop.mp4"

[[assets.overlay]]
from = "site/gis_video_typing_finish.mp4"
to = "gis_video_typing_finish.mp4"

[[assets.overlay]]
from = "site/favicon.ico"
to = "favicon.ico"

[[assets.overlay]]
from = "site/favicon-32.png"
to = "favicon-32.png"

[[assets.overlay]]
from = "site/apple-touch-icon.png"

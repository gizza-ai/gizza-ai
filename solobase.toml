[app]
name = "gizza-ai"
title = "Gizza AI"
boot_redirect = "/"

[solobase]
manifest_path = "../solobase"

[assets]
extra_bypass_prefix = ["/gizza-app.js", "/gizza.css", "/render.js", "/pending.js", "/gis.png", "/favicon.ico", "/favicon-32.png", "/apple-touch-icon.png"]

[[assets.overlay]]
from = "site/index.html"
to = "index.html"

[[assets.overlay]]
from = "site/gizza-app.js"
to = "gizza-app.js"

[[assets.overlay]]
from = "site/gizza.css"
to = "gizza.css"

[[assets.overlay]]
from = "site/render.js"
to = "render.js"

[[assets.overlay]]
from = "site/pending.js"
to = "pending.js"

[[assets.overlay]]
from = "site/gis.png"
to = "gis.png"

[[assets.overlay]]
from = "site/favicon.ico"
to = "favicon.ico"

[[assets.overlay]]
from = "site/favicon-32.png"
to = "favicon-32.png"

[[assets.overlay]]
from = "site/apple-touch-icon.png"
to = "apple-touch-icon.png"

[[assets.overlay]]
from = "static/CNAME"
to = "CNAME"

[[assets.overlay]]
from = "static/_headers"
to = "_headers"

[[assets.overlay]]
from = "static/test-fixtures/web-fetch.txt"
to = "test-fixtures/web-fetch.txt"

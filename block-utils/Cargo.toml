[workspace]
resolver = "2"
members = ["."]

[package]
name = "gizza-ai-block-utils"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Shared helpers for gizza-ai skill blocks (URL parsing, mime tables, ffmpeg-runtime dispatch, response envelope)."
license = "MIT"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
wafer-sdk = { git = "https://github.com/wafer-run/wafer-run.git", branch = "main" }
wafer-block = { git = "https://github.com/wafer-run/wafer-run.git", branch = "main" }

[dev-dependencies]

slug          = "video-set-keyframe-interval"
title         = "Set Video Keyframe Interval (GOP) Online"
description   = "Re-encode a video with a fixed keyframe interval — one keyframe every 2 seconds, or any GOP size in frames — for clean seeking and even HLS/DASH segments."
tags          = ["keyframe", "gop", "keyframe-interval", "keyint", "video", "streaming", "hls", "dash", "seeking", "h264", "ffmpeg", "segment"]
h1            = "Set Video Keyframe Interval"
hero_subtitle = "Re-encode a clip with a fixed keyframe (GOP) cadence — every 2 seconds, or an exact frame count — so players seek cleanly and streaming segments land on keyframe boundaries. Runs in your browser, nothing is uploaded."
wasm          = "gizza_ai_video_set_keyframe_interval_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Fixed-GOP MP4 video"
format        = "video"

[[input]]
name   = "file"
source = "file"
accept = "video/*"
label  = "Video file"

[[input]]
name        = "interval"
source      = "field"
label       = "Keyframe interval"
placeholder = "2"

[[input]]
name        = "unit"
source      = "field"
label       = "Interval unit"
placeholder = "seconds"

[input.labels]
"seconds" = "Seconds — placed by time, safe at any frame rate (default)"
"frames"  = "Frames — exact GOP size (constant frame rate)"

[[input]]
name  = "scene_cut"
source = "field"
label  = "Allow extra keyframes at scene changes"

[[input]]
name   = "closed_gop"
source = "field"
label  = "Closed GOP (recommended for seeking)"

[[input]]
name        = "quality"
source      = "field"
label       = "Quality — CRF 1–51 (lower = better)"
placeholder = "23"
kind        = "slider"
step        = "1"

[[input]]
name        = "preset"
source      = "field"
label       = "Encoder preset"
placeholder = "medium"

[input.labels]
"ultrafast" = "ultrafast — fastest, largest file"
"superfast" = "superfast"
"veryfast"  = "veryfast"
"faster"    = "faster"
"fast"      = "fast"
"medium"    = "medium — balanced (default)"
"slow"      = "slow"
"slower"    = "slower"
"veryslow"  = "veryslow — smallest file, slowest"

[[example]]
label  = "Streaming standard (2 s)"
params = { interval = "2", unit = "seconds", quality = "23", preset = "medium" }

[[example]]
label  = "Low-latency live (1 s)"
params = { interval = "1", unit = "seconds", quality = "23", preset = "veryfast" }

[[example]]
label  = "Editing / scrubbing (30 frames)"
params = { interval = "30", unit = "frames", quality = "20", preset = "medium" }

[[example]]
label  = "Long GOP archive (10 s)"
params = { interval = "10", unit = "seconds", quality = "26", preset = "slow" }

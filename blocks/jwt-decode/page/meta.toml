slug          = "jwt-decode"
title         = "JWT Decode — Decodes a JSON Web Token offline"
description   = "Decode any compact JSON Web Token (JWT) offline to inspect its header, payload claims, signature, and time-based validations. No data leaves your device."
tags          = ["jwt decode", "jwt decoder", "json web token", "jws", "decode jwt", "offline jwt decoder", "base64url decode jwt"]
h1            = "JWT decode"
hero_subtitle = "Decode and inspect JSON Web Tokens offline in your browser. Your sensitive tokens and keys never leave your device."
wasm          = "gizza_ai_jwt_decode_web"
export        = "run"
live          = false
output_label  = "Decoded Token"
format        = "text"
wide          = true

[[input]]
name        = "token"
label       = "JWT (compact token)"
placeholder = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyLCJleHAiOjI1MTYyMzkwMjJ9.signature"
source      = "field"
multiline   = true

[[input]]
name        = "leeway"
label       = "Clock-skew leeway (seconds)"
placeholder = "0"
source      = "field"
default     = "0"

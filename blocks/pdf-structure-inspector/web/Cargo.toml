[package]
name = "gizza-ai-pdf-structure-inspector-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
gizza-ai-pdf-structure-inspector-core = { path = "../core" }
# lopdf pulls getrandom 0.3 through its crypto stack even for read-only parsing.
# The browser build needs the wasm_js backend enabled for wasm32-unknown-unknown.
getrandom = { version = "0.3", features = ["wasm_js"] }

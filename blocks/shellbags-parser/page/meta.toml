slug          = "shellbags-parser"
title         = "Shellbags Parser — Reconstruct Browsed Folders from UsrClass.dat"
description   = "Parse Windows shellbags from a registry hive pasted as hex or Base64: walk BagMRU, decode shell items and rebuild the folder paths a user browsed, deleted ones included."
tags          = ["shellbags parser", "BagMRU", "UsrClass.dat", "NTUSER.DAT", "shell item", "SHITEMID", "Windows forensics", "DFIR", "folder access history", "deleted folders", "MRUListEx", "NodeSlot", "bodyfile", "0xBEEF0004"]
h1            = "Shellbags Parser"
hero_subtitle = "Paste a Windows registry hive as hex or Base64 and rebuild the folders the user browsed in Explorer — including folders that were later deleted and paths on removable or network media. Runs locally in your browser; the hive is never uploaded."
wasm          = "gizza_ai_shellbags_parser_web"
export        = "run"
live          = false
output_label  = "Shellbag entries"
format        = "text"
wide          = true

[[input]]
name        = "data"
label       = "Hive bytes"
placeholder = "Paste hex bytes starting with 72 65 67 66 (ASCII \"regf\"), or switch the encoding below to Base64"
source      = "field"
multiline   = true

[[input]]
name    = "input_encoding"
label   = "Input encoding"
source  = "field"
default = "hex"

[input.labels]
hex    = "Hex bytes (72 65 67 66...)"
base64 = "Base64"

[[input]]
name    = "mode"
label   = "Output format"
source  = "field"
default = "tree"

[input.labels]
tree     = "Tree: indented folder hierarchy"
list     = "List: one absolute path per line"
csv      = "CSV: spreadsheet-ready table"
bodyfile = "Bodyfile: Sleuth Kit / mactime"
raw      = "Raw: shell item diagnostics"

[[input]]
name    = "bag_root"
label   = "Shellbag root"
source  = "field"
default = "auto"

[input.labels]
auto        = "Auto-detect every known location"
usrclass    = "UsrClass.dat (Vista and later)"
ntuser      = "NTUSER.DAT Shell"
shellnoroam = "NTUSER.DAT ShellNoRoam (Windows XP)"

[[input]]
name        = "custom_path"
label       = "Custom BagMRU path (optional)"
placeholder = "Local Settings\\Software\\Microsoft\\Windows\\Shell\\BagMRU"
source      = "field"

[[input]]
name        = "max_entries"
label       = "Maximum entries"
placeholder = "200"
source      = "field"
default     = "200"

[[input]]
name        = "max_depth"
label       = "Maximum folder depth"
placeholder = "32"
source      = "field"
default     = "32"

[[input]]
name   = "resolve_guids"
label  = "Resolve known GUIDs to friendly names"
source = "field"

[[example]]
label = "Sample hive: folder tree"
[example.params]
data = ""
input_encoding = "base64"
mode = "tree"
bag_root = "auto"
max_entries = "200"
max_depth = "32"

[[example]]
label = "Same hive as CSV"
[example.params]
mode = "csv"

[[example]]
label = "Shell item diagnostics"
[example.params]
mode = "raw"

[[example]]
label = "Print raw GUIDs instead of names"
[example.params]
mode = "tree"
resolve_guids = "false"

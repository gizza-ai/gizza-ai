[package]
name = "gizza-ai-flask-session-decode-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# base64url decode of the itsdangerous payload + timestamp.
base64 = "0.22"
# zlib inflate for the optional '.'-prefixed compressed payload (pure-Rust miniz_oxide, wasm-safe).
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

slug          = "mkv-to-mp4"
title         = "Convert MKV to MP4 Online"
description   = "Free MKV to MP4 converter that runs in your browser. Lossless stream-copy remux for H.264/HEVC clips, or re-encode VP9/AV1. Nothing is uploaded."
tags          = ["mkv", "mp4", "convert", "video", "remux", "stream-copy", "matroska", "h264", "hevc", "vp9", "av1", "reencode"]
h1            = "Convert MKV to MP4"
hero_subtitle = "Pick a Matroska .mkv and get an .mp4 — a lossless container remux when possible, re-encode when needed. Runs in your browser, nothing is uploaded."
wasm          = "gizza_ai_mkv_to_mp4_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "MP4 video"
format        = "video"

[[input]]
name   = "video"
source = "file"
accept = "video/x-matroska,video/*"
label  = "MKV video"

[[input]]
name        = "mode"
source      = "field"
label       = "Conversion mode"
placeholder = "copy"

[input.labels]
"copy"      = "Remux (lossless, fast) — keeps H.264/HEVC + AAC"
"transcode" = "Re-encode to H.264/AAC — for VP9/AV1 etc."

[[input]]
name        = "quality"
source      = "field"
label       = "Transcode quality (1–100)"
placeholder = "75"
kind        = "slider"
step        = "1"

[[example]]
label  = "Lossless remux"
params = { mode = "copy" }

[[example]]
label  = "Re-encode (VP9/AV1) — high quality"
params = { mode = "transcode", quality = "90" }

[[example]]
label  = "Re-encode — smaller file"
params = { mode = "transcode", quality = "55" }

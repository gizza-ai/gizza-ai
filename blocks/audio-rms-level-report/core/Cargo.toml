[package]
name = "gizza-ai-audio-rms-level-report-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# symphonia: pure-Rust container demuxers + audio decoders (same wasm-proven
# crate + feature set as blocks/video-audio-rms-timeline / loudness-spec-compliance).
# Samples are streamed frame-by-frame into fixed-size accumulators, so the whole
# decoded signal is never held at once.
symphonia = { version = "0.5", default-features = false, features = [
    "isomp4",
    "mkv",
    "ogg",
    "wav",
    "aiff",
    "caf",
    "flac",
    "mp3",
    "aac",
    "adpcm",
    "pcm",
    "vorbis",
    "alac",
] }

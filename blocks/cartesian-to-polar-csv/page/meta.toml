slug          = "cartesian-to-polar-csv"
title         = "Cartesian to polar CSV converter — x,y to r,θ in bulk"
description   = "Convert a whole CSV of (x, y) points to polar (r, θ) coordinates in your browser, in degrees or radians, keeping your other columns intact."
tags          = ["cartesian to polar", "polar coordinates", "csv", "atan2", "degrees", "radians", "coordinate converter", "batch"]
h1            = "Cartesian to polar CSV converter"
hero_subtitle = "Paste a CSV of `x,y` points and get `r,θ` back for every row — degrees or radians, signed or 0–360, with your `id` and `label` columns carried through."
wasm          = "gizza_ai_cartesian_to_polar_csv_web"
export        = "run"
live          = false
output_label  = "Converted coordinates"
format        = "text"

[[input]]
name        = "csv"
label       = "CSV of points"
placeholder = "x,y\n3,4\n-1,1\n0,-2.5"
source      = "field"
multiline   = true

[[input]]
name        = "direction"
label       = "Direction"
source      = "field"

[input.labels]
cartesian_to_polar = "Cartesian (x, y) → polar (r, θ)"
polar_to_cartesian = "Polar (r, θ) → Cartesian (x, y)"

[[input]]
name        = "x_column"
label       = "X / R column"
placeholder = "auto — e.g. x, easting or 2"
source      = "field"

[[input]]
name        = "y_column"
label       = "Y / θ column"
placeholder = "auto — e.g. y, northing or 3"
source      = "field"

[[input]]
name        = "angle_unit"
label       = "Angle unit"
source      = "field"

[input.labels]
degrees  = "Degrees (360°)"
radians  = "Radians (2π)"
gradians = "Gradians (400)"
turns    = "Turns (1)"

[[input]]
name        = "angle_range"
label       = "Angle range"
source      = "field"

[input.labels]
signed   = "Signed, −180° to 180°"
positive = "Positive, 0° to 360°"

[[input]]
name        = "decimals"
label       = "Decimal places"
placeholder = "6"
source      = "field"
kind        = "slider"
min         = "0"
max         = "15"
step        = "1"

[[input]]
name        = "delimiter"
label       = "Delimiter"
source      = "field"

[input.labels]
auto      = "Auto-detect"
comma     = "Comma ,"
semicolon = "Semicolon ;"
tab       = "Tab"
pipe      = "Pipe |"

[[input]]
name        = "has_header"
label       = "First row is a header"
source      = "field"

[[input]]
name        = "keep_columns"
label       = "Keep other columns"
source      = "field"

[[input]]
name        = "output"
label       = "Output format"
source      = "field"

[input.labels]
csv   = "CSV"
tsv   = "TSV"
json  = "JSON"
table = "Aligned table"

[[example]]
label = "3,4 → r=5, θ=53.13°"
[example.params]
csv = "x,y\n3,4\n-1,1\n0,-2.5"
direction = "cartesian_to_polar"
x_column = ""
y_column = ""
angle_unit = "degrees"
angle_range = "signed"
decimals = "6"
delimiter = "auto"
has_header = "true"
keep_columns = "true"
output = "csv"

[[example]]
label = "Keep labels, 0–360°"
[example.params]
csv = "id,x,y\np1,3,4\np2,-3,-4\np3,-1,0"
direction = "cartesian_to_polar"
x_column = ""
y_column = ""
angle_unit = "degrees"
angle_range = "positive"
decimals = "2"
delimiter = "auto"
has_header = "true"
keep_columns = "true"
output = "csv"

[[example]]
label = "Radians, aligned table"
[example.params]
csv = "x,y\n1,1\n0,2\n-1,0"
direction = "cartesian_to_polar"
x_column = ""
y_column = ""
angle_unit = "radians"
angle_range = "signed"
decimals = "4"
delimiter = "auto"
has_header = "true"
keep_columns = "true"
output = "table"

[[example]]
label = "Polar → Cartesian, JSON"
[example.params]
csv = "r,theta\n5,53.13\n2,180"
direction = "polar_to_cartesian"
x_column = ""
y_column = ""
angle_unit = "degrees"
angle_range = "signed"
decimals = "3"
delimiter = "auto"
has_header = "true"
keep_columns = "true"
output = "json"

[[example]]
label = "Headerless pairs"
[example.params]
csv = "3,4\n0,-2\n-6,8"
direction = "cartesian_to_polar"
x_column = ""
y_column = ""
angle_unit = "degrees"
angle_range = "signed"
decimals = "2"
delimiter = "auto"
has_header = "false"
keep_columns = "false"
output = "csv"

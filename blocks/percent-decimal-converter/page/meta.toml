slug          = "percent-decimal-converter"
title         = "Percent Decimal Converter — convert percentages and fractions"
description   = "Convert percentage strings like 12.5% to decimal fractions like 0.125, or decimals back to percentages, across a pasted column or delimited table."
tags          = ["percent to decimal", "decimal to percent", "percentage converter", "basis points", "permille", "csv percentage"]
h1            = "Percent Decimal Converter"
hero_subtitle = "Convert a pasted column or CSV between percentages, decimals, per-mille values and basis points. Pick a direction or let the tool auto-detect each cell."
wasm          = "gizza_ai_percent_decimal_converter_web"
export        = "run"
live          = false
output_label  = "Converted data"
format        = "text"

[[input]]
name        = "data"
label       = "Input data"
placeholder = "rate\n12.5%\n7%\n0.5%"
source      = "field"
multiline   = true

[[input]]
name   = "direction"
label  = "Direction"
source = "field"

[input.labels]
auto               = "Auto-detect per cell"
percent_to_decimal = "Percent side → decimal fraction"
decimal_to_percent = "Decimal fraction → percent side"

[[input]]
name   = "unit"
label  = "Percent-side unit"
source = "field"

[input.labels]
percent      = "Percent (%)"
permille     = "Per mille (‰)"
basis_points = "Basis points (bps)"

[[input]]
name        = "columns"
label       = "Columns to convert"
placeholder = "rate,4"
source      = "field"

[[input]]
name   = "header"
label  = "First row is a header"
source = "field"

[[input]]
name        = "delimiter"
label       = "Delimiter"
placeholder = "comma"
source      = "field"

[[input]]
name        = "decimals"
label       = "Decimal places (-1 = exact)"
placeholder = "-1"
source      = "field"

[[input]]
name   = "trim_zeros"
label  = "Trim trailing zeros after rounding"
source = "field"

[[input]]
name   = "suffix"
label  = "Append %, ‰ or bps when converting up"
source = "field"

[[example]]
label = "Percent column to decimals"
[example.params]
data = "rate\n12.5%\n7%\n0.5%"
direction = "percent_to_decimal"
unit = "percent"
columns = ""
header = "true"
delimiter = "comma"
decimals = "-1"
trim_zeros = "false"
suffix = "true"

[[example]]
label = "Decimals to percentages"
[example.params]
data = "rate\n0.125\n0.07\n0.005"
direction = "decimal_to_percent"
unit = "percent"
columns = ""
header = "true"
delimiter = "comma"
decimals = "2"
trim_zeros = "true"
suffix = "true"

[[example]]
label = "Auto-detect mixed values"
[example.params]
data = "name,rate,share\nApple,12.5%,0.25\nPear,7%,0.5"
direction = "auto"
unit = "percent"
columns = "rate,share"
header = "true"
delimiter = "comma"
decimals = "-1"
trim_zeros = "false"
suffix = "true"

[[example]]
label = "Basis points"
[example.params]
data = "rate\n0.0025\n25 bps"
direction = "auto"
unit = "basis_points"
columns = ""
header = "true"
delimiter = "comma"
decimals = "-1"
trim_zeros = "false"
suffix = "true"

[[example]]
label = "Semicolon table"
[example.params]
data = "name;rate\nA;12.5%\nB;7%"
direction = "percent_to_decimal"
unit = "percent"
columns = "rate"
header = "true"
delimiter = "semicolon"
decimals = "4"
trim_zeros = "true"
suffix = "true"

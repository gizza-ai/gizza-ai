slug          = "stepwise-feature-selection"
title         = "Stepwise Feature Selection — Pick Regression Predictors by AIC or BIC"
description   = "Run forward, backward, or bidirectional stepwise OLS regression on a numeric table to choose predictors by AIC, BIC, AICc, or p-value thresholds."
tags          = ["stepwise regression", "feature selection", "aic", "bic", "ols", "regression", "predictor selection", "statistics", "model selection"]
h1            = "Stepwise feature selection for regression"
hero_subtitle = "Paste a numeric table, choose the target column, and run forward, backward, or bidirectional stepwise OLS selection. The report shows each add/drop move, coefficients, fit statistics, and dropped predictors."
wasm          = "gizza_ai_stepwise_feature_selection_web"
export        = "run"
live          = false
output_label  = "Selection report"
format        = "text"

[[input]]
name        = "data"
label       = "Data table"
placeholder = "1,5,5.19\n2,3,7.61\n3,8,11.29\n4,1,13.85"
source      = "field"
multiline   = true

[[input]]
name        = "target"
label       = "Target column"
placeholder = "last, first, sales, or 4"
source      = "field"

[[input]]
name   = "direction"
label  = "Search direction"
source = "field"
[input.labels]
forward = "Forward: add predictors"
backward = "Backward: remove predictors"
both = "Both: add and remove"

[[input]]
name   = "criterion"
label  = "Selection criterion"
source = "field"
[input.labels]
aic = "AIC"
bic = "BIC"
aicc = "AICc"
pvalue = "p-value thresholds"

[[input]]
name        = "alpha_enter"
label       = "Alpha to enter"
placeholder = "0.05"
source      = "field"
kind        = "slider"
step        = "0.01"

[[input]]
name        = "alpha_remove"
label       = "Alpha to remove"
placeholder = "0.10"
source      = "field"
kind        = "slider"
step        = "0.01"

[[input]]
name        = "force"
label       = "Always keep predictors"
placeholder = "ads, 2"
source      = "field"

[[input]]
name        = "labels"
label       = "Column labels"
placeholder = "ads,price,temp,sales"
source      = "field"

[[input]]
name   = "header"
label  = "First row is a header"
source = "field"

[[input]]
name        = "decimals"
label       = "Decimal places"
placeholder = "4"
source      = "field"
kind        = "slider"
step        = "1"

[[example]]
label = "Marketing mix: AIC"
[example.params]
data = "ads,price,temp,sales\n2,19,21,30.4\n5,15,14,49.0\n3,18,30,37.0\n8,12,18,67.1\n6,14,25,56.4\n9,11,11,75.1\n4,17,27,40.4\n7,13,16,62.7\n10,10,23,79.7\n5,16,29,48.4\n8,12,13,67.8\n3,20,19,31.9"
target = "sales"
direction = "both"
criterion = "aic"
alpha_enter = "0.05"
alpha_remove = "0.10"
force = ""
labels = ""
header = "true"
decimals = "3"

[[example]]
label = "Forward BIC with labels"
[example.params]
data = "1,5,5.19\n2,3,7.61\n3,8,11.29\n4,1,13.85\n5,9,16.95\n6,2,20.4\n7,7,22.51\n8,4,26.33\n9,6,28.73\n10,10,32.14"
target = "y"
direction = "forward"
criterion = "bic"
alpha_enter = "0.05"
alpha_remove = "0.10"
force = ""
labels = "x1,x2,y"
header = "false"
decimals = "4"

[[example]]
label = "P-value thresholds"
[example.params]
data = "1,5,5.19\n2,3,7.61\n3,8,11.29\n4,1,13.85\n5,9,16.95\n6,2,20.4\n7,7,22.51\n8,4,26.33\n9,6,28.73\n10,10,32.14"
target = "last"
direction = "forward"
criterion = "pvalue"
alpha_enter = "0.05"
alpha_remove = "0.10"
force = ""
labels = "x1,x2,y"
header = "false"
decimals = "4"

[[example]]
label = "Force a known control"
[example.params]
data = "1,5,5.19\n2,3,7.61\n3,8,11.29\n4,1,13.85\n5,9,16.95\n6,2,20.4\n7,7,22.51\n8,4,26.33\n9,6,28.73\n10,10,32.14"
target = "y"
direction = "both"
criterion = "aic"
alpha_enter = "0.05"
alpha_remove = "0.10"
force = "x2"
labels = "x1,x2,y"
header = "false"
decimals = "4"

slug          = "video-trim-black-frames"
title         = "Trim Black Frames from Video — Remove Black Intro & Outro"
description   = "Automatically detect and trim the leading and trailing fully-black frames from a video. Two-pass ffmpeg blackdetect runs in your browser — nothing is uploaded."
tags          = ["video", "black frames", "trim", "blackdetect", "intro", "outro", "leader", "mp4", "ffmpeg"]
h1            = "Trim Black Frames from a Video"
hero_subtitle = "Detects a black intro or outro automatically and trims the clip to the real picture — right in your browser, no upload."
wasm          = "gizza_ai_video_trim_black_frames_web"
export        = "detect_argv"
runtime       = "ffmpeg"
output_label  = "Trimmed video"
format        = "video"

[[input]]
name   = "file"
source = "file"
accept = "video/*"
label  = "Video"

[[input]]
name        = "pixel_threshold"
source      = "field"
label       = "Pixel black threshold (0–1)"
placeholder = "0.10"
kind        = "slider"
min         = "0"
max         = "1"
step        = "0.01"

[[input]]
name        = "black_ratio"
source      = "field"
label       = "Black-pixel ratio (0–1)"
placeholder = "0.98"
kind        = "slider"
min         = "0"
max         = "1"
step        = "0.01"

[[input]]
name        = "min_duration"
source      = "field"
label       = "Min black duration (seconds)"
placeholder = "0.10"

[[input]]
name   = "ends"
source = "field"
label  = "Trim which ends"

[input.labels]
both  = "Both ends (default)"
start = "Start only (leading black)"
end   = "End only (trailing black)"

[[example]]
label = "Black intro & outro"
[example.params]
pixel_threshold = "0.10"
black_ratio     = "0.98"
min_duration    = "0.10"
ends            = "both"

[[example]]
label = "Catch a single black frame"
[example.params]
pixel_threshold = "0.10"
black_ratio     = "0.98"
min_duration    = "0.04"
ends            = "both"

[[example]]
label = "Dark-grey fade to black"
[example.params]
pixel_threshold = "0.15"
black_ratio     = "0.90"
min_duration    = "0.20"
ends            = "both"

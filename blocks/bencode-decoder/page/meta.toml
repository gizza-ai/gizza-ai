slug          = "bencode-decoder"
title         = "Bencode Decoder — bencode ⇄ JSON converter"
description   = "Decode bencode (the BitTorrent / .torrent serialization format) into readable JSON, and re-encode JSON back into canonical bencode — in your browser. Nothing is uploaded."
tags          = ["bencode", "bencode decoder", "bencode to json", "torrent", "torrent decoder", "bencode encoder", "bittorrent"]
h1            = "Bencode decoder"
hero_subtitle = "Decode bencode — the BitTorrent serialization format behind .torrent files — into readable JSON, or re-encode JSON back into bencode. Runs in your browser; your data never leaves your device."
wasm          = "gizza_ai_bencode_decoder_web"
export        = "run"
live          = false
output_label  = "Result"
format        = "text"

[[input]]
name        = "input"
label       = "Bencode or JSON"
placeholder = "d3:cow3:moo4:spam4:eggse"
source      = "field"
multiline   = true

[[input]]
name        = "mode"
label       = "Mode"
placeholder = "decode"
source      = "field"

[[input]]
name        = "pretty"
label       = "Pretty-print JSON (decode)"
placeholder = ""
source      = "field"

[package]
name = "gizza-ai-meeting-time-finder-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
serde_json = "1"
# chrono for date/time arithmetic + formatting; alloc-only, no clock needed.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# chrono-tz provides the IANA tz database (DST rules baked in), pure-Rust, no I/O.
chrono-tz = { version = "0.10", default-features = false }

slug          = "outlier-detector"
title         = "Outlier Detector — flag outliers with z-score and IQR"
description   = "Find outliers in a list of numbers using the z-score, modified z-score (MAD) and IQR (Tukey's fences) methods, in your browser. Free, private, no upload."
tags          = ["outlier detector", "z-score", "modified z-score", "iqr method", "tukey fences", "anomaly detection", "data cleaning"]
h1            = "Outlier detector"
hero_subtitle = "Flag outliers in a list of numbers with the z-score, modified z-score (MAD) and IQR (Tukey's fences) methods. Runs in your browser, no upload."
wasm          = "gizza_ai_outlier_detector_web"
export        = "run"
live          = false
output_label  = "Outliers"
format        = "text"

[[input]]
name        = "numbers"
label       = "Numbers"
placeholder = "10, 11, 12, 10, 9, 11, 100"
source      = "field"
multiline   = true

[[input]]
name        = "z_threshold"
label       = "Z-score threshold"
placeholder = "3"
source      = "field"

[[input]]
name        = "iqr_k"
label       = "IQR multiplier (k)"
placeholder = "1.5"
source      = "field"

[package]
name = "gizza-ai-podcast-feed-parser-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[package]
name = "gizza-ai-one-time-pad-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
base64 = "0.22"
hex = "0.4"
# CSPRNG pad material: WASI `random_get` in the wafer runtime, WebCrypto (the
# `js` backend, enabled by the web crate) on the page build.
getrandom = "0.2"
serde_json = "1"

slug          = "isolation-forest-anomaly"
title         = "Isolation forest anomaly detector"
description   = "Score numeric CSV rows with a deterministic isolation forest, rank likely outliers, and export text, JSON, or CSV results."
tags          = ["anomaly-detection", "isolation-forest", "csv", "machine-learning", "statistics", "outliers"]
h1            = "Isolation forest anomaly detector"
hero_subtitle = "Paste a numeric table, fit an isolation forest locally, and rank rows by how easy they are to isolate."
wasm          = "gizza_ai_isolation_forest_anomaly_web"
export        = "run"
live          = false
output_label  = "Anomaly report"
format        = "text"
wide          = true

[[input]]
name        = "input"
label       = "Data table"
placeholder = "temp,pressure\n20,101\n21,102\n20,100\n22,101\n21,101\n20,102\n21,100\n90,300"
source      = "field"
multiline   = true
rows        = 10

[[input]]
name        = "features"
label       = "Feature columns"
placeholder = "blank = all numeric columns, or temp,pressure / 1,2"
source      = "field"

[[input]]
name        = "method"
label       = "Method"
source      = "field"

[input.labels]
standard = "Standard cuts"
extended = "Extended hyperplanes"

[[input]]
name        = "trees"
label       = "Trees"
placeholder = "100"
source      = "field"
kind        = "slider"
min         = 1
max         = 1000
step        = "10"

[[input]]
name        = "sample_size"
label       = "Sample size"
placeholder = "auto"
source      = "field"

[[input]]
name        = "max_features"
label       = "Max features per tree"
placeholder = "1"
source      = "field"
kind        = "slider"
min         = 0.01
max         = 10
step        = "0.01"

[[input]]
name        = "bootstrap"
label       = "Bootstrap samples"
source      = "field"
default     = "false"

[[input]]
name        = "contamination"
label       = "Contamination"
placeholder = "auto or 0.05 / 5%"
source      = "field"

[[input]]
name        = "threshold"
label       = "Score threshold (0 = contamination)"
placeholder = "0"
source      = "field"
kind        = "slider"
min         = 0
max         = 0.999
step        = "0.001"

[[input]]
name        = "missing"
label       = "Missing cells"
source      = "field"

[input.labels]
drop = "Drop row"
median = "Fill median"
mean = "Fill mean"
zero = "Fill zero"
error = "Error"

[[input]]
name        = "sort"
label       = "Sort rows"
source      = "field"

[input.labels]
input = "Input order"
score = "Most anomalous first"

[[input]]
name        = "top"
label       = "Top N (0 = all)"
placeholder = "0"
source      = "field"
kind        = "slider"
min         = 0
max         = 100
step        = "1"

[[input]]
name        = "only_anomalies"
label       = "Only anomalies"
source      = "field"
default     = "false"

[[input]]
name        = "header"
label       = "Header row"
source      = "field"

[input.labels]
auto = "Auto-detect"
yes = "Yes"
no = "No"

[[input]]
name        = "delimiter"
label       = "Delimiter"
source      = "field"

[input.labels]
auto = "Auto-detect"
comma = "Comma"
tab = "Tab"
semicolon = "Semicolon"
pipe = "Pipe"
space = "Whitespace"

[[input]]
name        = "decimals"
label       = "Decimals"
placeholder = "4"
source      = "field"
kind        = "slider"
min         = 0
max         = 12
step        = "1"

[[input]]
name        = "seed"
label       = "Seed"
placeholder = "42"
source      = "field"

[[input]]
name        = "format"
label       = "Output format"
source      = "field"

[input.labels]
text = "Text report"
json = "JSON"
csv = "CSV"

[[example]]
label = "Sensor spike"
input = "temp,pressure\n20,101\n21,102\n20,100\n22,101\n21,101\n20,102\n21,100\n90,300"
features = ""
method = "standard"
trees = "100"
sample_size = "auto"
max_features = "1"
bootstrap = "false"
contamination = "auto"
threshold = "0"
missing = "drop"
sort = "score"
top = "5"
only_anomalies = "false"
header = "auto"
delimiter = "auto"
decimals = "4"
seed = "42"
format = "text"

[[example]]
label = "Extended hyperplanes"
input = "x,y\n1,1\n2,1\n1,2\n2,2\n50,50\n3,2\n2,3\n1,3"
features = "x,y"
method = "extended"
trees = "150"
sample_size = "auto"
max_features = "1"
bootstrap = "false"
contamination = "10%"
threshold = "0"
missing = "drop"
sort = "score"
top = "3"
only_anomalies = "true"
header = "auto"
delimiter = "auto"
decimals = "4"
seed = "7"
format = "json"

[[example]]
label = "CSV export with imputation"
input = "segment,value,cost\na,10,5\nb,11,6\nc,,5\nd,80,40\ne,9,5"
features = "value,cost"
method = "standard"
trees = "100"
sample_size = "auto"
max_features = "1"
bootstrap = "false"
contamination = "20%"
threshold = "0"
missing = "median"
sort = "score"
top = "0"
only_anomalies = "false"
header = "auto"
delimiter = "auto"
decimals = "3"
seed = "42"
format = "csv"

slug          = "video-audio-gain"
title         = "Change a Video's Audio Volume Online"
description   = "Make a video louder or quieter right in your browser — by decibels or a factor, with a clipping-safe limiter. The picture is untouched. Nothing is uploaded, free."
tags          = ["video volume", "louder video", "quieter video", "audio gain", "boost video sound", "db", "ffmpeg"]
h1            = "Change a Video's Audio Volume"
hero_subtitle = "Pick a video and a gain — its audio is boosted or cut in your browser while the picture stays untouched. Nothing is uploaded."
wasm          = "gizza_ai_video_audio_gain_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Adjusted video"
format        = "video"

[[input]]
name   = "file"
source = "file"
accept = "video/*"
label  = "Video"

[[input]]
name        = "amount"
source      = "field"
kind        = "slider"
label       = "Amount"
placeholder = "6"
step        = "1"

[[input]]
name   = "unit"
source = "field"
label  = "Unit"

[input.labels]
db     = "Decibels (dB)"
factor = "Factor (×)"

[[input]]
name   = "limiter"
source = "field"
label  = "Prevent clipping (limiter)"

[[example]]
label  = "+6 dB boost"
params = { amount = "6", unit = "db" }

[[example]]
label  = "2× louder"
params = { amount = "2", unit = "factor" }

[[example]]
label  = "Half volume"
params = { amount = "0.5", unit = "factor" }

[[example]]
label  = "−10 dB cut"
params = { amount = "-10", unit = "db" }

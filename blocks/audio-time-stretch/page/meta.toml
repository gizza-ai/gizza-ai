slug          = "audio-time-stretch"
title         = "Change Audio Speed Online (Keep Pitch)"
description   = "Free online audio speed & tempo changer — speed up or slow down any track without changing the pitch. Set a factor, BPM ratio, or percentage in your browser."
tags          = ["audio", "speed", "tempo", "time stretch", "bpm", "slow down", "speed up", "podcast", "transcription", "pitch preserved", "factor", "playback"]
h1            = "Change Audio Speed (Keep Pitch)"
hero_subtitle = "Pick an audio file and a speed factor — the tempo changes, the pitch stays put, and nothing leaves your browser."
wasm          = "gizza_ai_audio_time_stretch_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Time-stretched audio"
format        = "audio"

[[input]]
name   = "audio"
source = "file"
accept = "audio/*"
label  = "Audio"

[[input]]
name        = "factor"
source      = "field"
label       = "Speed factor (0.25 to 4)"
placeholder = "1.5"
kind        = "slider"
step        = "0.05"

[[input]]
name   = "format"
source = "field"
label  = "Format"

[[example]]
label  = "1.25× (podcast)"
params = { factor = "1.25" }

[[example]]
label  = "1.5× faster"
params = { factor = "1.5" }

[[example]]
label  = "2× (double speed)"
params = { factor = "2" }

[[example]]
label  = "0.75× (slow down)"
params = { factor = "0.75" }

[[example]]
label  = "0.5× (half speed)"
params = { factor = "0.5" }

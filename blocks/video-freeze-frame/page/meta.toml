slug          = "video-freeze-frame"
title         = "Freeze Frame Video Effect Online — Free, In-Browser — gizza.ai"
description   = "Add a freeze-frame effect to a video: play up to a moment, hold that frame still for a set number of seconds, then continue. Free, in your browser."
tags          = ["freeze frame", "freeze frame video", "still frame", "hold frame", "video effect", "pause frame", "stop motion", "reels", "shorts", "ffmpeg"]
h1            = "Freeze Frame Video Effect"
hero_subtitle = "Pick a moment, hold that frame as a still for as long as you like, then let the video roll on — all in your browser. Nothing is uploaded."
wasm          = "gizza_ai_video_freeze_frame_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Freeze-frame video"
format        = "video"

[[input]]
name   = "file"
source = "file"
accept = "video/*"
label  = "Video"

# Field order MUST equal web/src/lib.rs build_argv param order: time, duration.
[[input]]
name        = "time"
source      = "field"
label       = "Freeze at (seconds)"
placeholder = "1"

[[input]]
name        = "duration"
source      = "field"
label       = "Hold for (seconds)"
placeholder = "2"
kind        = "slider"
step        = "0.5"

[[example]]
label  = "Freeze at 1s for 2s"
params = { time = "1", duration = "2" }

[[example]]
label  = "Dramatic 4s hold"
params = { time = "2", duration = "4" }

[[example]]
label  = "Quick 0.5s beat"
params = { time = "1.5", duration = "0.5" }

[[example]]
label  = "Hold the opening frame"
params = { time = "0", duration = "3" }

[package]
name = "gizza-ai-yaml-query-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
gizza-ai-yaml-query-core = { path = "../core" }
# jaq's tree pulls getrandom 0.3 transitively; the page (wasm32-unknown-unknown)
# target needs its wasm_js backend (also enabled via the cfg in .cargo/config.toml).
getrandom = { version = "0.3", features = ["wasm_js"] }

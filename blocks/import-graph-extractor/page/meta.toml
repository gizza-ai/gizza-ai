slug          = "import-graph-extractor"
title         = "Import Graph Extractor"
description   = "Paste JS, Python, Rust, or Go source and get an import graph with file edges, external deps, dependents, orphans, leaves, and cycles."
tags          = ["import graph", "dependency graph", "circular dependency", "madge alternative", "module graph", "javascript imports", "python imports", "graphviz dot", "mermaid", "code analysis"]
h1            = "Import & Dependency Graph Extractor"
hero_subtitle = "Paste one or more source files and map every import — file-to-file edges, external packages, dependents, orphans, leaves, and circular dependencies. JS/TS, Python, Rust, and Go; text, JSON, Graphviz DOT, or Mermaid. Runs entirely in your browser."
wasm          = "gizza_ai_import_graph_extractor_web"
export        = "run"
live          = false
output_label  = "Dependency graph"
format        = "text"

[[input]]
name        = "input"
label       = "Source code"
placeholder = "=== src/app.js ===\nimport { greet } from './util/greet';\nimport React from 'react';\n\n=== src/util/greet.js ===\nexport const greet = () => 'hi';"
source      = "field"
multiline   = true

# language / format render as <select> and the two booleans as checkboxes —
# control type + options come from the descriptor schema (manifest.json).
[[input]]
name        = "language"
label       = "Language"
source      = "field"

[[input]]
name        = "format"
label       = "Output format"
source      = "field"

[[input]]
name        = "include_external"
label       = "Include external dependencies (npm / stdlib / crates)"
source      = "field"

[[input]]
name        = "detect_cycles"
label       = "Detect circular dependencies"
source      = "field"

[[example]]
label = "JS multi-file"
[example.params]
input = "=== src/app.js ===\nimport { greet } from './util/greet';\nimport React from 'react';\nconst fs = require('fs');\n\n=== src/util/greet.js ===\nexport const greet = () => 'hi';"
language = "auto"
format = "text"

[[example]]
label = "Python cycle → Mermaid"
[example.params]
input = "=== pkg/a.py ===\nfrom .b import thing\nimport os\n\n=== pkg/b.py ===\nfrom pkg.a import other"
language = "python"
format = "mermaid"

[[example]]
label = "Go imports → JSON"
[example.params]
input = "=== main.go ===\npackage main\nimport (\n    \"fmt\"\n    \"github.com/gin-gonic/gin\"\n)"
language = "go"
format = "json"

slug          = "file-tree-generator"
title         = "File Tree Generator — ASCII Directory Tree | gizza.ai"
description   = "Turn a list of file paths or an indented outline into an ASCII tree for READMEs and docs. Unicode or ASCII connectors, optional sorting. Free, in-browser."
tags          = ["file tree generator", "ascii tree", "directory tree", "folder structure diagram", "tree command", "readme tree", "ascii folder structure", "project structure generator"]
h1            = "File Tree Generator"
hero_subtitle = "Paste a list of file paths or an indented outline and get a clean ASCII directory tree for your README or docs. Unicode or plain-ASCII connectors. Runs entirely in your browser, no server, no sign-up."
wasm          = "gizza_ai_file_tree_generator_web"
export        = "run"
live          = false
output_label  = "Tree"
format        = "text"

[[input]]
name        = "input"
label       = "File paths or outline"
placeholder = "src/main.rs\nsrc/lib.rs\nREADME.md\ndocs/guide.md"
source      = "field"
multiline   = true

# mode renders as a <select>; root as a text field; ascii / trailing_slash /
# sort as checkboxes — control types are derived from the descriptor schema.
[[input]]
name        = "mode"
label       = "Input mode"
source      = "field"

[[input]]
name        = "root"
label       = "Root label"
placeholder = "."
source      = "field"

[[input]]
name        = "ascii"
label       = "Plain-ASCII connectors"
source      = "field"

[[input]]
name        = "trailing_slash"
label       = "Trailing slash on directories"
source      = "field"

[[input]]
name        = "sort"
label       = "Sort (directories first, A–Z)"
source      = "field"

slug          = "chacha20-cipher"
title         = "ChaCha20 Cipher — Encrypt/decrypt with ChaCha20 & ChaCha20-Poly1305 — gizza.ai"
description   = "Encrypt or decrypt text with ChaCha20 or ChaCha20-Poly1305 AEAD (RFC 8439) in your browser — 32-byte key, 12-byte nonce, hex/base64 I/O. Nothing is uploaded."
tags          = ["chacha20", "chacha20-poly1305", "chacha20 encrypt", "chacha20 decrypt", "aead", "rfc 8439", "stream cipher", "poly1305"]
h1            = "ChaCha20 cipher"
hero_subtitle = "Encrypt or decrypt text with ChaCha20 or ChaCha20-Poly1305 (RFC 8439) — 32-byte key, 12-byte nonce, optional AAD, hex or base64. Runs in your browser; nothing is uploaded."
wasm          = "gizza_ai_chacha20_cipher_web"
export        = "run"
live          = false
output_label  = "Result"
format        = "text"

[[input]]
name        = "data"
label       = "Data (plaintext to encrypt, or ciphertext to decrypt)"
placeholder = "Text to encrypt…"
source      = "field"
multiline   = true

[[input]]
name        = "operation"
label       = "Operation (encrypt | decrypt)"
placeholder = "encrypt"
source      = "field"

[[input]]
name        = "key"
label       = "Key (32 bytes / 256-bit)"
placeholder = "32-char passphrase, or 64-char hex"
source      = "field"

[[input]]
name        = "nonce"
label       = "Nonce (12 bytes)"
placeholder = "12-char string, or 24-char hex"
source      = "field"

[[input]]
name        = "aad"
label       = "Associated data (AEAD only, optional)"
placeholder = "Authenticated but not encrypted"
source      = "field"
multiline   = true

[[input]]
name        = "mode"
label       = "Mode (stream | aead)"
placeholder = "stream"
source      = "field"

[[input]]
name        = "key_format"
label       = "Key/nonce format (text | encoded)"
placeholder = "text"
source      = "field"

[[input]]
name        = "counter"
label       = "Initial block counter (stream mode)"
placeholder = "0"
source      = "field"

[[input]]
name        = "format"
label       = "Encoding (hex | base64)"
placeholder = "hex"
source      = "field"

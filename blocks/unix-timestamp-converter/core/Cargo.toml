[package]
name = "gizza-ai-unix-timestamp-converter-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# chrono for epoch <-> calendar math + ISO/RFC formatting; alloc-only, no clock.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# Reuse parse-datetime's flexible multi-format date reader for the date->epoch direction.
gizza-ai-parse-datetime-core = { path = "../../parse-datetime/core" }

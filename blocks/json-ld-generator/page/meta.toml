slug          = "json-ld-generator"
title         = "JSON-LD Schema Markup Generator — gizza.ai"
description   = "Generate schema.org JSON-LD structured data for Article, Product, FAQ, Organization, LocalBusiness, Event, Recipe and more — from simple field inputs. Nested objects, ratings, and a ready-to-paste script tag. Free, private, runs in your browser, no sign-up."
tags          = ["json-ld", "schema.org", "structured data", "rich results", "seo", "faq schema", "product schema", "article schema", "google rich snippets"]
h1            = "JSON-LD Schema Markup Generator"
hero_subtitle = "Build valid schema.org JSON-LD for Articles, Products, FAQs, Organizations and more from plain field inputs. Runs entirely in your browser — no server, no sign-up."
wasm          = "gizza_ai_json_ld_generator_web"
export        = "run"
live          = false
output_label  = "JSON-LD"
format        = "text"

# schema_type renders as a <select> (options come from the descriptor schema);
# fields/faq are multiline so pasted newlines survive; wrap_script is a checkbox.
[[input]]
name        = "schema_type"
label       = "Schema type"
source      = "field"

[[input]]
name        = "fields"
label       = "Fields (one 'name = value' per line)"
placeholder = "headline = How to ship structured data\nauthor.name = Jane Doe\ndatePublished = 2026-06-23\nkeywords = seo, json-ld, schema"
source      = "field"
multiline   = true

[[input]]
name        = "faq"
label       = "FAQ pairs (FAQPage only — 'Question? | Answer' per line)"
placeholder = "Is it free? | Yes, completely.\nIs it private? | It runs in your browser."
source      = "field"
multiline   = true

[[input]]
name        = "wrap_script"
label       = "Wrap in <script type=\"application/ld+json\"> tag"
source      = "field"

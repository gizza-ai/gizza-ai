[package]
name = "gizza-ai-flask-session-sign-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
base64 = "0.22"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"

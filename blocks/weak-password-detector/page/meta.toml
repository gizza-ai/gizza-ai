slug          = "weak-password-detector"
title         = "Weak Password Detector — Check Passwords Against Common & Breached Lists — gizza.ai"
description   = "Check whether a password is one of the most common or breached passwords. Detects case and leetspeak variants, offline in your browser — nothing is uploaded."
tags          = ["weak password detector", "common password check", "breached password", "password blocklist", "is my password weak", "leetspeak password", "password checker", "worst passwords"]
h1            = "Weak Password Detector"
hero_subtitle = "Check a password against a bundled, ranked list of the most common and breached passwords. Catches case-only and leetspeak variants like P@ssw0rd. Runs entirely in your browser — nothing is uploaded."
wasm          = "gizza_ai_weak_password_detector_web"
export        = "run"
live          = false
output_label  = "Result"
format        = "text"

[[input]]
name        = "input"
label       = "Password to check"
placeholder = "P@ssw0rd"
source      = "field"

[[input]]
name   = "case_sensitive"
label  = "Case-sensitive match (require exact case)"
source = "field"

[[input]]
name   = "normalize_leet"
label  = "Detect leetspeak variants (P@ssw0rd → password)"
source = "field"

[[example]]
label = "Top common password"
[example.params]
input = "123456"

[[example]]
label = "Leetspeak variant"
[example.params]
input = "P@ssw0rd"

[[example]]
label = "Not on the list"
[example.params]
input = "cor6rect$horse!Battery9Staple"

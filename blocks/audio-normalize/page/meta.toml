slug          = "audio-normalize"
title         = "Normalize Audio Loudness Online — gizza.ai"
description   = "Level any audio file to a standard loudness (LUFS) right in your browser — -14 for Spotify/YouTube, -16 for podcasts. Runs locally, nothing is uploaded, free."
tags          = ["audio", "normalize", "loudness", "lufs", "volume", "level", "podcast", "spotify"]
h1            = "Normalize Audio Loudness"
hero_subtitle = "Pick an audio file and a target LUFS — it's leveled in your browser, nothing is uploaded."
wasm          = "gizza_ai_audio_normalize_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Normalized audio"
format        = "audio"

[[input]]
name   = "audio"
source = "file"
accept = "audio/*"
label  = "Audio"

[[input]]
name        = "lufs"
source      = "field"
label       = "Target loudness (LUFS)"
placeholder = "-14"

[[input]]
name   = "format"
source = "field"
label  = "Format"

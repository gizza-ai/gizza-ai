[package]
name = "gizza-ai-image-round-avatar-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# image: pure-Rust decode/encode + crop/resize; PNG keeps the alpha mask.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

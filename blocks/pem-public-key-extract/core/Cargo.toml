[package]
name = "gizza-ai-pem-public-key-extract-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# rsa: PKCS#8/PKCS#1 private-key decode + SPKI public-key PEM ("pem" feature).
rsa = { version = "0.9", features = ["pem"] }
# EC: P-256 / P-384 PKCS#8 + SEC1 decode + SPKI public-key PEM encode.
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "pkcs8", "pem"] }
p384 = { version = "0.13", default-features = false, features = ["arithmetic", "pkcs8", "pem"] }
# Ed25519: PKCS#8 decode + SPKI public-key PEM encode.
ed25519-dalek = { version = "2", default-features = false, features = ["pkcs8", "pem"] }
base64 = "0.22"

[dev-dependencies]
# Test-only: generate fixture private keys.
rand = "0.8"
ed25519-dalek = { version = "2", default-features = false, features = ["pkcs8", "pem", "rand_core"] }

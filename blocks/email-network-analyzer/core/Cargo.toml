[package]
name = "gizza-ai-email-network-analyzer-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# mail-parser: fast, pure-Rust RFC 5322/2045 MIME parser (no_std-friendly,
# wasm-safe). default-features=false drops the optional serde/ludicrous bits.
mail-parser = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

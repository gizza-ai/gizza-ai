slug          = "split-text"
title         = "Split Text by Delimiter — One Item Per Line"
description   = "Split text on any delimiter into one item per line — comma, tab, custom, whitespace, or characters, with trim and drop-blanks options. Free, in-browser."
tags          = ["split text", "text splitter", "delimiter", "comma to lines", "one per line", "split by whitespace", "split into characters", "csv to list"]
h1            = "Split Text by Delimiter"
hero_subtitle = "Split text on a comma, tab, or any delimiter into one item per line. Split by whitespace or into characters, trim each item, and drop blanks. Runs entirely in your browser, no server, no sign-up."
wasm          = "gizza_ai_split_text_web"
export        = "run"
live          = false
output_label  = "Result (one item per line)"
format        = "text"

[[input]]
name        = "text"
label       = "Text to split"
placeholder = "apple, banana, cherry"
source      = "field"
multiline   = true

[[input]]
name        = "delimiter"
label       = "Delimiter (escapes: \\n \\t \\r \\\\)"
placeholder = ","
source      = "field"

# mode renders as a <select> and trim/remove_empty as checkboxes — the control
# type + options are derived from the descriptor's schema (manifest.json).
[[input]]
name        = "mode"
label       = "Mode"
source      = "field"

[[input]]
name        = "trim"
label       = "Trim each item"
source      = "field"

[[input]]
name        = "remove_empty"
label       = "Remove empty items"
source      = "field"

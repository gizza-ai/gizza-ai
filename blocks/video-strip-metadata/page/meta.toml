slug          = "video-strip-metadata"
title         = "Strip Video Metadata Online"
description   = "Remove GPS, device, timestamp, title, comment, stream, and chapter metadata from a video locally with ffmpeg stream copy — no upload and no re-encode."
tags          = ["video", "metadata", "privacy", "strip", "gps", "ffmpeg", "remux"]
h1            = "Strip Video Metadata"
hero_subtitle = "Upload a video and remux it locally to remove embedded tags while preserving the original audio/video quality."
wasm          = "gizza_ai_video_strip_metadata_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Metadata-stripped video"
format        = "video"

[[input]]
name   = "file"
source = "file"
accept = "video/*"
label  = "Video"

[[input]]
name        = "container"
source      = "field"
label       = "Output container"
placeholder = "keep"

[[input]]
name        = "chapters"
source      = "field"
label       = "Chapters"
placeholder = "remove"

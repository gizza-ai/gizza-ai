slug          = "video-to-gif"
title         = "Video to GIF Converter — gizza.ai"
description   = "Turn any video into an animated GIF right in your browser. Pick a section, set fps and width — high-quality palette, runs locally, nothing is uploaded, free."
tags          = ["video", "gif", "animated-gif", "convert", "video-to-gif", "clip", "loop", "share"]
h1            = "Video to GIF"
hero_subtitle = "Pick a video, choose a section and size — it's turned into a looping GIF in your browser, nothing is uploaded."
wasm          = "gizza_ai_video_to_gif_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Animated GIF"
format        = "image"

[[input]]
name   = "file"
source = "file"
accept = "video/*"
label  = "Video"

[[input]]
name        = "start"
source      = "field"
label       = "Start (seconds)"
placeholder = "0"

[[input]]
name        = "duration"
source      = "field"
label       = "Duration (seconds, 0 = to the end)"
placeholder = "5"

[[input]]
name        = "fps"
source      = "field"
label       = "Frames per second (0 = default 12)"
placeholder = "12"

[[input]]
name        = "width"
source      = "field"
label       = "Width in px (0 = keep source size)"
placeholder = "480"

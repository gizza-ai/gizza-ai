[package]
name = "gizza-ai-gif-extract-frames-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# image: decode the animated GIF (its frame iterator coalesces partial frames
# onto the canvas) and re-encode each frame as PNG. Pure Rust, wasm-safe.
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
# zip with deflate only — bundle the frames + manifest into one download.
zip = { version = "8", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

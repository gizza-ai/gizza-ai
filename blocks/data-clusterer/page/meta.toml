slug          = "data-clusterer"
title         = "Data Clusterer — KMeans, DBSCAN & Hierarchical Clustering to SVG"
description   = "Paste CSV data and cluster it with KMeans, DBSCAN, or hierarchical methods, then export an SVG scatter plot, labeled CSV, or JSON report."
tags          = ["data clustering tool", "kmeans calculator", "dbscan online", "hierarchical clustering", "cluster analysis", "csv clustering", "scatter plot clusters", "silhouette score"]
h1            = "Cluster Tabular Data"
hero_subtitle = "Paste a CSV, pick KMeans, DBSCAN, or hierarchical clustering, and get a colored scatter plot, a labeled CSV, or a JSON report with centroids and a silhouette score. Pure-Rust clustering runs in your browser — nothing is uploaded."
wasm          = "gizza_ai_data_clusterer_web"
export        = "run_tool"
live          = false
output_label  = "Clustering result"
format        = "text"

[[input]]
name        = "data"
label       = "CSV data"
placeholder = "height,weight\n150,52\n160,61\n165,64\n170,70\n182,84\n188,92\n191,99"
source      = "field"
multiline   = true

[[input]]
name   = "method"
label  = "Method"
source = "field"

[input.labels]
kmeans       = "KMeans"
dbscan       = "DBSCAN (density)"
hierarchical = "Hierarchical"

[[input]]
name        = "clusters"
label       = "Clusters (k) — KMeans / hierarchical"
placeholder = "3"
source      = "field"

[[input]]
name        = "eps"
label       = "eps — DBSCAN radius"
placeholder = "1.0"
source      = "field"

[[input]]
name        = "min_samples"
label       = "min_samples — DBSCAN"
placeholder = "4"
source      = "field"

[[input]]
name   = "linkage"
label  = "Linkage — hierarchical"
source = "field"

[input.labels]
average  = "Average (UPGMA)"
complete = "Complete (max)"
single   = "Single (min)"
ward     = "Ward (min variance)"

[[input]]
name        = "columns"
label       = "Feature columns (names or 1-based indices; blank = all numeric)"
placeholder = "height,weight"
source      = "field"

[[input]]
name   = "normalize"
label  = "Standardize features (z-score)"
source = "field"

[[input]]
name   = "output"
label  = "Output"
source = "field"

[input.labels]
chart = "Scatter plot (SVG)"
csv   = "Labeled CSV"
json  = "JSON report"

[[input]]
name        = "title"
label       = "Chart title (optional)"
placeholder = "Customer segments"
source      = "field"

[[input]]
name        = "width"
label       = "Chart width (px)"
placeholder = "700"
source      = "field"

[[input]]
name        = "height"
label       = "Chart height (px)"
placeholder = "500"
source      = "field"

[[example]]
label = "KMeans — 3 segments (height/weight)"
[example.params]
data = "height,weight\n150,52\n158,55\n162,58\n170,70\n174,73\n178,76\n185,92\n189,96\n193,101"
method = "kmeans"
clusters = "3"
eps = "1.0"
min_samples = "4"
linkage = "average"
columns = ""
normalize = "true"
output = "chart"
title = "Body-size segments"
width = "700"
height = "500"

[[example]]
label = "DBSCAN — two blobs + an outlier"
[example.params]
data = "x,y\n0,0\n0.2,0.1\n0.1,0.2\n0,0.3\n5,5\n5.1,5\n5,5.1\n4.9,5.1\n20,20"
method = "dbscan"
clusters = "3"
eps = "0.8"
min_samples = "3"
linkage = "average"
columns = ""
normalize = "false"
output = "chart"
title = "Density clusters + noise"
width = "700"
height = "500"

[[example]]
label = "Hierarchical (Ward) — JSON report"
[example.params]
data = "a,b\n1,1\n1.2,0.9\n0.8,1.1\n8,8\n8.1,7.9\n7.9,8.2\n8,15\n8.2,15.1"
method = "hierarchical"
clusters = "3"
eps = "1.0"
min_samples = "4"
linkage = "ward"
columns = ""
normalize = "true"
output = "json"
title = ""
width = "700"
height = "500"

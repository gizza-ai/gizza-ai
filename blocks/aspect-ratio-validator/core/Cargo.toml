[package]
name = "gizza-ai-aspect-ratio-validator-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# Pure arithmetic — no I/O, no decoding — so the identical code runs in the chat
# block, the CLI and the browser page. serde only shapes the report.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

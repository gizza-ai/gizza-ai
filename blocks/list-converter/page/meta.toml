slug          = "list-converter"
title         = "List Converter — Reformat, Clean, and Sort Lists"
description   = "Convert, clean and sort lists online — comma-separated to lines, SQL IN, JSON, XML or custom delimiters, with prefix, dedupe and case options. Free, in-browser."
tags          = ["list converter", "comma to lines", "sql list formatter", "json list maker", "dedupe list", "sort list", "add prefix to list"]
h1            = "List Converter"
hero_subtitle = "Format, transform, and clean any text list. Convert between commas, newlines, tabs, SQL, or custom delimiters. Prepend prefixes, change case, sort, and remove duplicates locally and securely."
wasm          = "gizza_ai_list_converter_web"
export        = "run"
live          = false
output_label  = "Formatted List"
format        = "text"
wide          = true

[[input]]
name        = "input"
label       = "Input List"
placeholder = "apple, banana, cherry"
source      = "field"
multiline   = true

[[input]]
name        = "input_separator"
label       = "Split Separator"
placeholder = "auto"
source      = "field"

[[input]]
name        = "custom_input_separator"
label       = "Custom Split Separator"
placeholder = " | "
source      = "field"

[[input]]
name        = "output_format"
label       = "Output Layout"
placeholder = "newline"
source      = "field"

[[input]]
name        = "custom_output_separator"
label       = "Custom Join Separator"
placeholder = "; "
source      = "field"

[[input]]
name        = "sort_mode"
label       = "Sort Order"
placeholder = "none"
source      = "field"

[[input]]
name        = "dedupe"
label       = "Deduplicate Items"
source      = "field"

[[input]]
name        = "case_transform"
label       = "Text Case"
placeholder = "none"
source      = "field"

[[input]]
name        = "prefix"
label       = "Add Prefix"
placeholder = "img_"
source      = "field"

[[input]]
name        = "suffix"
label       = "Add Suffix"
placeholder = ".png"
source      = "field"

[[input]]
name        = "seed"
label       = "Random Seed"
source      = "clock"

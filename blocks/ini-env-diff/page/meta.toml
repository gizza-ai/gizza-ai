slug          = "ini-env-diff"
title         = "INI / .env Diff — compare two config files key-by-key"
description   = "Compare two .env or .ini config files key-by-key: added, removed and changed settings, with case-folding and secret masking."
tags          = ["env diff", "compare env files", ".env compare", "ini diff", "config diff", "dotenv compare", "diff env online", "compare config"]
h1            = "INI / .env Diff"
hero_subtitle = "Paste two .env or .ini config files and see exactly what changed — keys added, removed and changed, grouped with a count summary. Optional case-insensitive keys and secret masking. Runs entirely in your browser; nothing is uploaded."
wasm          = "gizza_ai_ini_env_diff_web"
export        = "run"
live          = false
output_label  = "Config diff"
format        = "text"

[[input]]
name        = "left"
label       = "First file (left / old)"
placeholder = "# base\nexport DB_HOST=localhost\nDB_PORT=5432\nDEBUG=true\nAPI_TOKEN=dev-token-123456"
source      = "field"
multiline   = true

[[input]]
name        = "right"
label       = "Second file (right / new)"
placeholder = "DB_HOST=prod.internal\nDB_PORT=5432\nNEW_FLAG=on\nAPI_TOKEN=prod-token-987654"
source      = "field"
multiline   = true

[[input]]
name   = "format"
label  = "Parse format"
source = "field"

[input.labels]
auto = "Auto — INI if a [section] header is present, else .env"
env  = ".env — flat KEY=VALUE (dotenv)"
ini  = "INI / .conf — [section]-aware, dotted section.key"

[[input]]
name   = "ignore_case"
label  = "Ignore key case (DB_HOST = db_host)"
source = "field"

[[input]]
name   = "mask_secrets"
label  = "Mask secret values (SECRET/TOKEN/PASSWORD/KEY/…)"
source = "field"

[[input]]
name   = "output"
label  = "Output"
source = "field"

[input.labels]
report = "Report — grouped summary with counts"
json   = "JSON — structured added/removed/changed/unchanged"

[[example]]
label = "Compare two .env files"
[example.params]
left   = "# base\nexport DB_HOST=localhost\nDB_PORT=5432\nDEBUG=true"
right  = "DB_HOST=prod.internal\nDB_PORT=5432\nNEW_FLAG=on"
format = "auto"
output = "report"

[[example]]
label = "Diff INI sections"
[example.params]
left   = "[db]\nhost = localhost\nport = 5432\n\n[cache]\nttl = 60"
right  = "[db]\nhost = 10.0.0.1\nport = 5432\n\n[cache]\nttl = 120"
format = "ini"
output = "report"

[[example]]
label = "Mask secrets + JSON"
[example.params]
left         = "API_TOKEN=dev-token-123456\nDB_HOST=localhost"
right        = "API_TOKEN=prod-token-987654\nDB_HOST=prod.internal"
mask_secrets = "true"
output       = "json"

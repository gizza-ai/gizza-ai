[package]
name = "gizza-ai-html-extract-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# scraper: html5ever-based HTML parsing + CSS selectors, wasm32-safe (same
# engine html-table-extractor uses). serde_json builds the count+matches output.
scraper = { version = "0.20", default-features = false }
serde_json = "1"

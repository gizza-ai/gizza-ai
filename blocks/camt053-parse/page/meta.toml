slug          = "camt053-parse"
title         = "CAMT.053 Parser — Convert ISO 20022 Bank Statement XML to JSON or CSV"
description   = "Parse a camt.053 (or camt.052/054) ISO 20022 bank statement XML into JSON or CSV in your browser: balances, dates, counterparties, references. No upload."
tags          = ["camt.053 parser", "camt.053 to csv", "camt.053 to json", "iso 20022 bank statement", "camt.052 converter", "bank statement xml"]
h1            = "CAMT.053 Statement Parser"
hero_subtitle = "Turn an ISO 20022 camt.053 bank statement XML into clean JSON or a CSV transaction table — balances, booking & value dates, CRDT/DBIT amounts, counterparties, references and remittance info. camt.052 and camt.054 work too. Runs entirely in your browser, nothing is uploaded."
wasm          = "gizza_ai_camt053_parse_web"
export        = "run"
live          = false
output_label  = "Parsed statement"
format        = "text"

[[input]]
name        = "data"
label       = "camt.053 statement XML"
placeholder = "<Document xmlns=\"urn:iso:std:iso:20022:tech:xsd:camt.053.001.02\">\n  <BkToCstmrStmt>\n    <Stmt>\n      <Id>STMT-2024-001</Id>\n      <Acct><Id><IBAN>NL91ABNA0417164300</IBAN></Id><Ccy>EUR</Ccy></Acct>\n      <Ntry><Amt Ccy=\"EUR\">150.50</Amt><CdtDbtInd>DBIT</CdtDbtInd><Sts>BOOK</Sts><BookgDt><Dt>2024-01-02</Dt></BookgDt><ValDt><Dt>2024-01-02</Dt></ValDt></Ntry>\n    </Stmt>\n  </BkToCstmrStmt>\n</Document>"
source      = "field"
multiline   = true

[[input]]
name        = "output"
label       = "Output format"
source      = "field"

[input.labels]
json = "JSON (full statements)"
csv  = "CSV (transaction table)"

[[input]]
name        = "date_format"
label       = "Date format"
source      = "field"

[input.labels]
iso = "ISO — YYYY-MM-DD"
us  = "US — MM/DD/YYYY"
eu  = "EU — DD/MM/YYYY"
raw = "Raw — source string"

[[input]]
name        = "delimiter"
label       = "CSV delimiter (CSV output only)"
source      = "field"

[input.labels]
comma     = "Comma ( , )"
semicolon = "Semicolon ( ; )"
tab       = "Tab"
pipe      = "Pipe ( | )"

[[input]]
name        = "signed_amounts"
label       = "Sign amounts (DBIT negative, CRDT positive)"
source      = "field"

[[input]]
name        = "expand_details"
label       = "Expand batch entries (one row per payment)"
source      = "field"

[[example]]
label = "Statement → JSON"
[example.params]
data   = "<Document xmlns=\"urn:iso:std:iso:20022:tech:xsd:camt.053.001.02\">\n <BkToCstmrStmt>\n  <Stmt>\n   <Id>STMT-2024-001</Id>\n   <Acct><Id><IBAN>NL91ABNA0417164300</IBAN></Id><Ccy>EUR</Ccy></Acct>\n   <Bal><Tp><CdOrPrtry><Cd>OPBD</Cd></CdOrPrtry></Tp><Amt Ccy=\"EUR\">1000.00</Amt><CdtDbtInd>CRDT</CdtDbtInd><Dt><Dt>2024-01-01</Dt></Dt></Bal>\n   <Bal><Tp><CdOrPrtry><Cd>CLBD</Cd></CdOrPrtry></Tp><Amt Ccy=\"EUR\">2849.50</Amt><CdtDbtInd>CRDT</CdtDbtInd><Dt><Dt>2024-01-31</Dt></Dt></Bal>\n   <Ntry><Amt Ccy=\"EUR\">150.50</Amt><CdtDbtInd>DBIT</CdtDbtInd><Sts>BOOK</Sts><BookgDt><Dt>2024-01-02</Dt></BookgDt><ValDt><Dt>2024-01-02</Dt></ValDt><AcctSvcrRef>BANKREF1</AcctSvcrRef><NtryDtls><TxDtls><Refs><EndToEndId>E2E-42</EndToEndId></Refs><RltdPties><Cdtr><Nm>Acme Corp</Nm></Cdtr></RltdPties><RmtInf><Ustrd>Payment invoice 42</Ustrd></RmtInf></TxDtls></NtryDtls></Ntry>\n   <Ntry><Amt Ccy=\"EUR\">2000.00</Amt><CdtDbtInd>CRDT</CdtDbtInd><Sts>BOOK</Sts><BookgDt><Dt>2024-01-03</Dt></BookgDt><ValDt><Dt>2024-01-03</Dt></ValDt><AcctSvcrRef>BANKREF2</AcctSvcrRef><NtryDtls><TxDtls><Refs><EndToEndId>PAYROLL-MAR</EndToEndId></Refs><RltdPties><Dbtr><Nm>Payroll Ltd</Nm></Dbtr></RltdPties><RmtInf><Ustrd>Salary March</Ustrd></RmtInf></TxDtls></NtryDtls></Ntry>\n  </Stmt>\n </BkToCstmrStmt>\n</Document>"
output = "json"

[[example]]
label = "Statement → CSV"
[example.params]
data   = "<Document xmlns=\"urn:iso:std:iso:20022:tech:xsd:camt.053.001.02\">\n <BkToCstmrStmt>\n  <Stmt>\n   <Id>STMT-2024-001</Id>\n   <Acct><Id><IBAN>NL91ABNA0417164300</IBAN></Id><Ccy>EUR</Ccy></Acct>\n   <Ntry><Amt Ccy=\"EUR\">150.50</Amt><CdtDbtInd>DBIT</CdtDbtInd><Sts>BOOK</Sts><BookgDt><Dt>2024-01-02</Dt></BookgDt><ValDt><Dt>2024-01-02</Dt></ValDt><AcctSvcrRef>BANKREF1</AcctSvcrRef><NtryDtls><TxDtls><Refs><EndToEndId>E2E-42</EndToEndId></Refs><RltdPties><Cdtr><Nm>Acme Corp</Nm></Cdtr></RltdPties><RmtInf><Ustrd>Payment invoice 42</Ustrd></RmtInf></TxDtls></NtryDtls></Ntry>\n   <Ntry><Amt Ccy=\"EUR\">2000.00</Amt><CdtDbtInd>CRDT</CdtDbtInd><Sts>BOOK</Sts><BookgDt><Dt>2024-01-03</Dt></BookgDt><ValDt><Dt>2024-01-03</Dt></ValDt><AcctSvcrRef>BANKREF2</AcctSvcrRef><NtryDtls><TxDtls><Refs><EndToEndId>PAYROLL-MAR</EndToEndId></Refs><RltdPties><Dbtr><Nm>Payroll Ltd</Nm></Dbtr></RltdPties><RmtInf><Ustrd>Salary March</Ustrd></RmtInf></TxDtls></NtryDtls></Ntry>\n  </Stmt>\n </BkToCstmrStmt>\n</Document>"
output = "csv"

[[example]]
label = "Batch entry → one row per payment"
[example.params]
data   = "<Document>\n <BkToCstmrStmt>\n  <Stmt>\n   <Id>B1</Id>\n   <Acct><Id><IBAN>NL91ABNA0417164300</IBAN></Id><Ccy>EUR</Ccy></Acct>\n   <Ntry><Amt Ccy=\"EUR\">300.00</Amt><CdtDbtInd>DBIT</CdtDbtInd><Sts>BOOK</Sts><BookgDt><Dt>2024-03-01</Dt></BookgDt><ValDt><Dt>2024-03-01</Dt></ValDt><NtryDtls><TxDtls><Refs><EndToEndId>E2E-A</EndToEndId></Refs><Amt Ccy=\"EUR\">100.00</Amt><CdtDbtInd>DBIT</CdtDbtInd><RltdPties><Cdtr><Nm>Alpha GmbH</Nm></Cdtr></RltdPties><RmtInf><Ustrd>Rent</Ustrd></RmtInf></TxDtls><TxDtls><Refs><EndToEndId>E2E-B</EndToEndId></Refs><Amt Ccy=\"EUR\">200.00</Amt><CdtDbtInd>DBIT</CdtDbtInd><RltdPties><Cdtr><Nm>Beta SARL</Nm></Cdtr></RltdPties><RmtInf><Ustrd>Utilities</Ustrd></RmtInf></TxDtls></NtryDtls></Ntry>\n  </Stmt>\n </BkToCstmrStmt>\n</Document>"
output = "csv"

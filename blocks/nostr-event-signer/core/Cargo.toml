[package]
name = "gizza-ai-nostr-event-signer-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# BIP-340 Schnorr over secp256k1 — pure-Rust RustCrypto k256, the same crate
# already proven wasm-safe by bitcoin-address / secp256k1-pubkey-derive /
# ecdsa-secp256k1. The `schnorr` feature is what Nostr signatures need; signing
# goes through the prehash path with zero auxiliary randomness, so the output is
# deterministic and no RNG import is pulled into the block.
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "schnorr"] }
# SHA-256: the event id, and the proof-of-work (NIP-13) mining loop.
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
# Struct-ordered serialization keeps the emitted event's keys in the canonical
# id/pubkey/created_at/kind/tags/content/sig order relays and clients expect.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "gizza-ai-nostr-event-signer-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
# The page's "sign it now" default needs a clock, and wasm32-unknown-unknown
# has no std one — read it from the browser instead.
js-sys = "0.3"
gizza-ai-nostr-event-signer-core = { path = "../core" }

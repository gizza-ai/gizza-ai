slug          = "yaml-to-csv"
title         = "YAML to CSV — Flatten YAML records into a CSV table"
description   = "Flatten a YAML list or mapping of records into CSV with a unioned column header. Nested keys become dot-paths. Runs in your browser, no upload."
tags          = ["yaml to csv", "yaml csv converter", "flatten yaml", "yaml to spreadsheet", "convert yaml"]
h1            = "YAML to CSV"
hero_subtitle = "Flatten a YAML list (or mapping) of records into a CSV table. Nested mappings become dot-path columns; the header is the union of every record's keys. Runs entirely in your browser, no upload."
wasm          = "gizza_ai_yaml_to_csv_web"
export        = "run"
live          = false
output_label  = "CSV"
format        = "text"

[[input]]
name        = "data"
label       = "YAML"
placeholder = "alice:\n  age: 30\n  city: Paris\nbob:\n  age: 40\n  city: Berlin"
source      = "field"
multiline   = true

[[input]]
name        = "delimiter"
label       = "Delimiter"
source      = "field"

[[input]]
name        = "header"
label       = "Include header row"
source      = "field"

[[input]]
name        = "array_mode"
label       = "Array handling"
source      = "field"

[[input]]
name        = "quote_all"
label       = "Quote every field"
source      = "field"

[[input]]
name        = "key_column"
label       = "Mapping key column name"
placeholder = "key"
source      = "field"

[[example]]
label = "Mapping of records"
[example.params]
data = "alice:\n  age: 30\n  city: Paris\nbob:\n  age: 40\n  city: Berlin"
key_column = "id"

[[example]]
label = "List of records"
[example.params]
data = "- name: Ada\n  age: 36\n  address:\n    city: London\n- name: Bo\n  age: 40"

[[example]]
label = "Array as columns"
[example.params]
data = "- name: Ada\n  tags: [admin, ops]\n- name: Bo\n  tags: [dev]"
array_mode = "columns"

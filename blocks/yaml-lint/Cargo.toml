[workspace]
resolver = "2"
members = [".", "core", "web"]

[package]
name = "gizza-ai-yaml-lint-block"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wafer-sdk = { git = "https://github.com/wafer-run/wafer-run", rev = "f6132178467f2d93ce02a625e3220e30cfa278ee" }
wafer-block = { git = "https://github.com/wafer-run/wafer-run", rev = "f6132178467f2d93ce02a625e3220e30cfa278ee" }
gizza-ai-yaml-lint-core = { path = "core" }
gizza-ai-block-utils = { path = "../../block-utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

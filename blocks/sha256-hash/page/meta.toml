slug          = "sha256-hash"
title         = "SHA-256 Hash Generator — gizza.ai"
description   = "Generate a SHA-256 (SHA-2) hash of any text instantly in your browser. Hex or base64 output, uppercase option, and hex/base64 input decoding. Free, private, no sign-up — nothing is uploaded."
tags          = ["sha256", "sha-256", "sha2", "hash", "checksum", "digest", "hex", "base64", "cryptography"]
h1            = "SHA-256 Hash Generator"
hero_subtitle = "Compute the SHA-256 digest of any text — hex or base64 output, uppercase option, and hex/base64 input decoding. Runs entirely in your browser, no server, no sign-up."
wasm          = "gizza_ai_sha256_hash_web"
export        = "run"
live          = false
output_label  = "SHA-256 digest"
format        = "text"

[[input]]
name        = "text"
label       = "Text to hash"
placeholder = "Hello, world!"
source      = "field"
multiline   = true

# input_encoding/output_format render as <select> and uppercase as a checkbox —
# control type + options are derived from the descriptor's schema (manifest.json),
# so labels here stay short and the option lists are NOT duplicated.
[[input]]
name        = "input_encoding"
label       = "Interpret input as"
source      = "field"

[[input]]
name        = "output_format"
label       = "Output format"
source      = "field"

[[input]]
name        = "uppercase"
label       = "Uppercase hex"
source      = "field"

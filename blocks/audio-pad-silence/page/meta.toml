slug          = "audio-pad-silence"
title         = "Add Silence to Audio Online — Pad the Start and End"
description   = "Add a chosen number of seconds of silence before and after any audio clip. Pad both ends in one pass, keep the audio untouched, all in your browser."
tags          = ["audio", "silence", "padding", "pad", "lead-in", "gap", "ivr", "podcast", "ffmpeg"]
h1            = "Add Silence to Audio"
hero_subtitle = "Pick a clip and choose how many seconds of silence go before and after it — both ends in one pass, in your browser, nothing is uploaded."
wasm          = "gizza_ai_audio_pad_silence_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Padded audio"
format        = "audio"

[[input]]
name   = "audio"
source = "file"
accept = "audio/*"
label  = "Audio"

# Field order MUST match web/src/lib.rs build_argv: start, end, format.
[[input]]
name        = "start"
source      = "field"
label       = "Silence before (seconds)"
placeholder = "2"

[[input]]
name        = "end"
source      = "field"
label       = "Silence after (seconds)"
placeholder = "0"

[[input]]
name   = "format"
source = "field"
label  = "Format"
labels = { mp3 = "MP3", wav = "WAV", ogg = "OGG", flac = "FLAC", m4a = "M4A" }

[[example]]
label  = "0.5s lead-in"
params = { start = "0.5", end = "0", format = "mp3" }

[[example]]
label  = "1s both ends"
params = { start = "1", end = "1", format = "mp3" }

[[example]]
label  = "2s intro gap"
params = { start = "2", end = "0", format = "mp3" }

[[example]]
label  = "5s tail only"
params = { start = "0", end = "5", format = "mp3" }

[[example]]
label  = "IVR prompt to WAV"
params = { start = "0.25", end = "0.75", format = "wav" }

[package]
name = "gizza-ai-hd-key-derive-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "alloc"] }
bs58 = { version = "0.5", features = ["check"] }
sha2 = "0.10"
ripemd = "0.1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }

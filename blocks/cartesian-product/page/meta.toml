slug          = "cartesian-product"
title         = "Cartesian Product Generator — Every Combination of 2–4 Lists — gizza.ai"
description   = "Generate every combination across 2-4 lists (sizes x colors x materials), join with any separator, add prefix/suffix, output lines, CSV or JSON. Free, in-browser."
tags          = ["cartesian product", "combination generator", "combine lists", "all combinations", "product variants generator", "seo keyword combiner", "cross join lists", "tuple generator"]
h1            = "Cartesian Product Generator"
hero_subtitle = "Combine two to four lists into every possible combination — one item from each list. Join with spaces, dashes, or a custom separator, add a prefix or suffix, and output plain lines, CSV rows, or JSON. Runs entirely in your browser."
wasm          = "gizza_ai_cartesian_product_web"
export        = "run"
live          = false
output_label  = "Combinations"
format        = "text"
wide          = true

[[input]]
name        = "list1"
label       = "List 1"
placeholder = "red, blue, green"
source      = "field"
multiline   = true

[[input]]
name        = "list2"
label       = "List 2"
placeholder = "S, M, L"
source      = "field"
multiline   = true

[[input]]
name        = "list3"
label       = "List 3 (optional)"
placeholder = "cotton, linen"
source      = "field"
multiline   = true

[[input]]
name        = "list4"
label       = "List 4 (optional)"
placeholder = "slim, regular"
source      = "field"
multiline   = true

# item_separator / output_format / join_separator render as <select> — the
# option lists come from the descriptor's schema via manifest.json.
[[input]]
name        = "item_separator"
label       = "Item separator"
source      = "field"

[[input]]
name        = "dedupe"
label       = "Deduplicate items in each list"
source      = "field"

[[input]]
name        = "output_format"
label       = "Output format"
source      = "field"

[[input]]
name        = "join_separator"
label       = "Join items with"
source      = "field"

[[input]]
name        = "custom_join_separator"
label       = "Custom join string"
placeholder = " :: "
source      = "field"

[[input]]
name        = "prefix"
label       = "Prefix"
placeholder = "sku-"
source      = "field"

[[input]]
name        = "suffix"
label       = "Suffix"
placeholder = "-2026"
source      = "field"

[[input]]
name        = "max_combinations"
label       = "Max combinations"
placeholder = "10000"
default     = "10000"
source      = "field"

[[example]]
label  = "Colors × sizes"
params = { list1 = "red, blue", list2 = "S, M, L" }

[[example]]
label  = "SEO keywords: modifier × service × city"
params = { list1 = "best, affordable", list2 = "plumber, electrician", list3 = "Austin, Dallas" }

[[example]]
label  = "SKU codes with dash + prefix"
params = { list1 = "tee, hoodie", list2 = "black, white", join_separator = "dash", prefix = "sku-" }

[[example]]
label  = "Variant matrix as CSV"
params = { list1 = "red, blue", list2 = "S, M", list3 = "cotton, linen", output_format = "csv" }

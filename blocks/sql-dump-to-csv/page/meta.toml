slug          = "sql-dump-to-csv"
title         = "SQL Dump to CSV — Extract INSERT Rows | gizza.ai"
description   = "Paste a SQL dump and pull the rows out of its INSERT statements into CSV — one CSV per table, with delimiter, header, NULL and quoting options. Free, private, no upload."
tags          = ["sql to csv", "sql dump to csv", "insert to csv", "mysql dump to csv", "sql export csv", "convert sql to csv", "sql insert extract", "database dump csv"]
h1            = "SQL Dump → CSV"
hero_subtitle = "Paste a SQL dump and extract the rows from its INSERT statements as CSV — one section per table. Runs entirely in your browser, no server, no sign-up."
wasm          = "gizza_ai_sql_dump_to_csv_web"
export        = "run"
live          = false
output_label  = "CSV"
format        = "text"

[[input]]
name        = "sql"
label       = "SQL dump"
placeholder = "INSERT INTO users (id, name) VALUES (1, 'Alice'), (2, 'Bob');"
source      = "field"
multiline   = true

# table/delimiter/quote render from the descriptor schema (manifest.json):
# delimiter + quote as <select>, header + bom as checkboxes.
[[input]]
name        = "table"
label       = "Only this table (blank = all)"
placeholder = "users"
source      = "field"

[[input]]
name        = "delimiter"
label       = "Delimiter"
source      = "field"

[[input]]
name        = "header"
label       = "Header row of column names"
source      = "field"

[[input]]
name        = "null_value"
label       = "Text for SQL NULL (blank = empty field)"
placeholder = "\\N"
source      = "field"

[[input]]
name        = "quote"
label       = "Quoting"
source      = "field"

[[input]]
name        = "bom"
label       = "UTF-8 BOM (for Excel)"
source      = "field"

[[example]]
label = "MySQL users dump"
[example.params]
sql = "INSERT INTO `users` (`id`, `name`, `email`) VALUES (1, 'Alice', 'alice@example.com'), (2, 'Bob', NULL);"

[[example]]
label = "Multi-table (all)"
[example.params]
sql = "INSERT INTO authors (id, name) VALUES (1, 'Ada');\nINSERT INTO books (id, title, author_id) VALUES (10, 'On Computation', 1);"

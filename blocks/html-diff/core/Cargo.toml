[package]
name = "gizza-ai-html-diff-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# nanohtml2text: tiny pure-Rust HTML -> visible plain text (strips every tag and
# attribute, keeps paragraph/list structure). wasm-safe (no html5ever / C deps);
# the same crate the html-to-text block uses.
nanohtml2text = "0.2"

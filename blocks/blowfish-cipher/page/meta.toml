slug          = "blowfish-cipher"
title         = "Blowfish Cipher — Encrypt/decrypt with Blowfish (ECB/CBC)"
description   = "Encrypt or decrypt data with the Blowfish cipher in ECB or CBC mode, with hex/base64 I/O — in your browser. Variable 4–56 byte key. Nothing is uploaded."
tags          = ["blowfish", "blowfish encrypt", "blowfish decrypt", "block cipher", "ecb", "cbc"]
h1            = "Blowfish cipher"
hero_subtitle = "Encrypt or decrypt data with Blowfish (ECB/CBC), hex or base64, with a variable 4–56 byte key. Runs in your browser; nothing is uploaded."
wasm          = "gizza_ai_blowfish_cipher_web"
export        = "run"
live          = false
output_label  = "Result"
format        = "text"

[[input]]
name        = "data"
label       = "Data (plaintext to encrypt, or ciphertext to decrypt)"
placeholder = "Text to encrypt…"
source      = "field"
multiline   = true

[[input]]
name        = "operation"
label       = "Operation (encrypt | decrypt)"
placeholder = "encrypt"
source      = "field"

[[input]]
name        = "cipher"
label       = "Mode (cbc | ecb)"
placeholder = "cbc"
source      = "field"

[[input]]
name        = "key"
label       = "Key (4–56 bytes, encoded)"
placeholder = "base64 or hex key"
source      = "field"

[[input]]
name        = "iv"
label       = "IV (8 bytes, for cbc)"
placeholder = "base64 or hex iv"
source      = "field"

[[input]]
name        = "format"
label       = "Encoding (base64 | hex)"
placeholder = "base64"
source      = "field"

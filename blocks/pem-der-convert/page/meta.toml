slug          = "pem-der-convert"
title         = "PEM to DER & DER to PEM Converter — gizza.ai"
description   = "Convert keys, certificates and CSRs between PEM (base64 text) and DER (binary, shown as hex or base64) in either direction. Runs in your browser, nothing uploaded, free."
tags          = ["pem to der", "der to pem", "convert certificate", "pem decode", "der encode", "x509 converter", "csr converter"]
h1            = "PEM ⇄ DER Converter"
hero_subtitle = "Convert keys, certificates and CSRs between PEM and DER, both directions. DER is shown/accepted as hex or base64. Runs entirely in your browser — nothing is uploaded."
wasm          = "gizza_ai_pem_der_convert_web"
export        = "run_convert"
live          = false
output_label  = "Result"
format        = "text"

[[input]]
name        = "input"
label       = "Input (PEM block, or DER as hex/base64)"
placeholder = "-----BEGIN CERTIFICATE-----..."
source      = "field"
multiline   = true

[[input]]
name        = "direction"
label       = "Direction (auto | pem-to-der | der-to-pem)"
placeholder = "auto"
source      = "field"

[[input]]
name        = "der_format"
label       = "DER text format (hex | base64)"
placeholder = "hex"
source      = "field"

[[input]]
name        = "label"
label       = "PEM label for der-to-pem (e.g. CERTIFICATE)"
placeholder = "CERTIFICATE"
source      = "field"

source      = "field"

[[input]]
name        = "key"
label       = "Key (32 bytes / 256-bit, encoded)"
placeholder = "base64 or hex key"
source      = "field"

[[input]]
name        = "iv"
label       = "IV / nonce (16 bytes for cbc/ctr)"
placeholder = "base64 or hex iv"
source      = "field"

[[input]]
name        = "format"
label       = "Encoding (base64 | hex)"
placeholder = "base64"

slug          = "video-aspect-pad"
title         = "Pad a Video to an Aspect Ratio Online — Letterbox to 9:16, 1:1, 16:9 — gizza.ai"
description   = "Letterbox or pillarbox a video to 9:16, 1:1, 16:9 or another aspect ratio with a chosen bar color — converted in your browser, nothing is uploaded, free."
tags          = ["video aspect ratio", "letterbox", "pillarbox", "pad video", "9:16", "reels", "shorts", "ffmpeg"]
h1            = "Pad a Video to an Aspect Ratio"
hero_subtitle = "Pick a video, a target ratio and a bar color — the whole frame is kept and letterboxed in your browser, nothing is uploaded."
wasm          = "gizza_ai_video_aspect_pad_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Padded video"
format        = "video"

[[input]]
name   = "file"
source = "file"
accept = "video/*"
label  = "Video"

[[input]]
name   = "aspect"
source = "field"
label  = "Target aspect ratio"

[[input]]
name        = "width"
source      = "field"
label       = "Output width (px, optional)"
placeholder = "(auto: platform standard, e.g. 1080)"

[[input]]
name        = "color"
source      = "field"
label       = "Bar color"
placeholder = "black, white or #1A2B3C"

slug          = "telegram-export-reader"
title         = "Telegram Export Reader — result.json Transcript & Stats"
description   = "Paste a Telegram Desktop result.json export and get a clean transcript, per-sender message and word stats, top words and emoji. Runs locally."
tags          = ["telegram", "export", "result.json", "chat transcript", "chat stats", "message stats", "word count"]
h1            = "Read a Telegram result.json Export"
hero_subtitle = "Turn a Telegram Desktop machine-readable JSON export into a clean transcript plus per-sender message counts, word counts, top words and emoji — all in your browser."
wasm          = "gizza_ai_telegram_export_reader_web"
export        = "run"
live          = false
output_label  = "Transcript / stats"
format        = "text"

[[input]]
name        = "export"
label       = "Telegram result.json"
placeholder = "{\"name\":\"Weekend Trip\",\"type\":\"private_group\",\"messages\":[{\"type\":\"message\",\"date\":\"2021-03-27T14:45:00\",\"from\":\"Alice\",\"text\":\"Hey everyone ready for the trip\"}]}"
source      = "field"
multiline   = true

[[input]]
name   = "output"
label  = "Output"
source = "field"

[input.labels]
transcript = "Transcript only"
stats      = "Stats only"
both       = "Stats + transcript"

[[input]]
name   = "include_service_messages"
label  = "Include service messages (joins, title changes, calls)"
source = "field"

[[input]]
name        = "sender_filter"
label       = "Sender filter"
placeholder = "Alice"
source      = "field"

[[input]]
name        = "max_messages"
label       = "Max messages (0 = all)"
placeholder = "0"
source      = "field"
kind        = "slider"
min         = "0"
max         = "5000"
step        = "1"

[[example]]
label = "Sample export → stats + transcript"
[example.params]
export = "{\"name\":\"Weekend Trip\",\"type\":\"private_group\",\"messages\":[{\"id\":1,\"type\":\"service\",\"date\":\"2021-03-27T14:44:24\",\"actor\":\"Alice\",\"action\":\"create_group\",\"title\":\"Weekend Trip\"},{\"id\":2,\"type\":\"message\",\"date\":\"2021-03-27T14:45:00\",\"from\":\"Alice\",\"text\":\"Hey everyone ready for the trip\"},{\"id\":3,\"type\":\"message\",\"date\":\"2021-03-28T09:46:10\",\"from\":\"Bob\",\"text\":[\"Yes \",{\"type\":\"bold\",\"text\":\"so\"},\" excited 🎉\"]},{\"id\":4,\"type\":\"message\",\"date\":\"2021-03-28T09:47:00\",\"from\":\"Bob\",\"text\":\"\",\"photo\":\"photos/photo_1.jpg\"}]}"
output = "both"

[[example]]
label = "Bob only, transcript"
[example.params]
export = "{\"name\":\"Weekend Trip\",\"type\":\"private_group\",\"messages\":[{\"id\":2,\"type\":\"message\",\"date\":\"2021-03-27T14:45:00\",\"from\":\"Alice\",\"text\":\"Hey everyone ready for the trip\"},{\"id\":3,\"type\":\"message\",\"date\":\"2021-03-28T09:46:10\",\"from\":\"Bob\",\"text\":\"Yes so excited 🎉\"},{\"id\":4,\"type\":\"message\",\"date\":\"2021-03-28T09:47:00\",\"from\":\"Bob\",\"text\":\"\",\"photo\":\"photos/photo_1.jpg\"}]}"
output = "transcript"
sender_filter = "Bob"

[[example]]
label = "Include service messages"
[example.params]
export = "{\"name\":\"Team\",\"messages\":[{\"type\":\"service\",\"date\":\"2021-01-01T10:00:00\",\"actor\":\"Alice\",\"action\":\"create_group\",\"title\":\"Team\"},{\"type\":\"message\",\"date\":\"2021-01-01T10:01:00\",\"from\":\"Alice\",\"text\":\"hello team\"}]}"
output = "transcript"
include_service_messages = "true"

[package]
name = "gizza-ai-ed25519-key-pair-generator-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# ed25519-dalek: pure-Rust Ed25519. pkcs8+pem give PKCS#8/SPKI PEM encoding;
# rand_core enables SigningKey::generate. wasm32-safe (getrandom via OsRng).
ed25519-dalek = { version = "2", default-features = false, features = ["pkcs8", "pem", "rand_core"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }

[package]
name = "gizza-ai-color-transfer-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# image: pure-Rust decode/encode + resize. default-features off to drop rayon etc.;
# enable the common raster formats we accept plus PNG/JPEG output.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

slug          = "video-audio-rms-timeline"
title         = "Video Audio RMS Timeline — Windowed Level CSV Extractor"
description   = "Extract windowed RMS and peak audio levels from a video's audio track into a CSV or JSON time series. Set the window, hop, and dBFS/linear unit."
tags          = ["audio levels", "rms", "peak", "dbfs", "loudness timeline", "audio analysis", "csv time series", "video audio"]
h1            = "Video audio RMS timeline"
hero_subtitle = "Turn a video's audio track into a level time series. Paste the file bytes as base64 or hex and get per-window RMS and peak levels — in dBFS or linear amplitude — as CSV or JSON."
wasm          = "gizza_ai_video_audio_rms_timeline_web"
export        = "run"
live          = false
output_label  = "Level time series"
format        = "text"

[[input]]
name        = "input"
label       = "Video/audio bytes (base64 or hex)"
placeholder = "UklGR... (paste the whole file's base64 or hex here)"
source      = "field"
multiline   = true

[[input]]
name        = "input_format"
label       = "Input encoding"
source      = "field"
[input.labels]
base64 = "Base64"
hex    = "Hex"

[[input]]
name        = "window_ms"
label       = "Window length (ms)"
placeholder = "100"
source      = "field"

[[input]]
name        = "hop_ms"
label       = "Hop between windows (ms, 0 = non-overlapping)"
placeholder = "0"
source      = "field"

[[input]]
name        = "unit"
label       = "Level unit"
source      = "field"
[input.labels]
dbfs   = "dBFS (0 = full scale)"
linear = "Linear (0–1 amplitude)"

[[input]]
name        = "output"
label       = "Output format"
source      = "field"
[input.labels]
csv  = "CSV"
json = "JSON"

[[example]]
label = "Tone → CSV, 100 ms windows (dBFS)"
[example.values]
input        = ""
input_format = "base64"
window_ms    = "100"
hop_ms       = "0"
unit         = "dbfs"
output       = "csv"

[[example]]
label = "Overlapping 50 ms hop → CSV (dBFS)"
[example.values]
input        = ""
input_format = "base64"
window_ms    = "100"
hop_ms       = "50"
unit         = "dbfs"
output       = "csv"

[[example]]
label = "Same tone → JSON (linear amplitude)"
[example.values]
input        = ""
input_format = "base64"
window_ms    = "100"
hop_ms       = "0"
unit         = "linear"
output       = "json"

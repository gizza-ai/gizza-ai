[package]
name = "gizza-ai-video-audio-rms-timeline-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# symphonia: pure-Rust container demuxers + audio decoders (same wasm-proven
# crate + feature set as blocks/video-audio-sync-offset-finder / media-info).
# A video's audio track is decoded; video tracks are CODEC_TYPE_NULL and
# skipped. No std clock / no I/O at runtime.
symphonia = { version = "0.5", default-features = false, features = [
    "isomp4",
    "mkv",
    "ogg",
    "wav",
    "aiff",
    "caf",
    "flac",
    "mp3",
    "aac",
    "adpcm",
    "pcm",
    "vorbis",
    "alac",
] }

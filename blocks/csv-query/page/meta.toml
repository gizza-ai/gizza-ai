slug          = "csv-query"
title         = "CSV Query — SQL-style SELECT/WHERE over CSV"
description   = "Query a CSV with SQL-style SELECT, WHERE, ORDER BY, and LIMIT — right in your browser. Free, private, no upload."
tags          = ["csv query", "sql csv", "query csv", "select where csv", "filter sort csv"]
h1            = "CSV Query"
hero_subtitle = "Run a SQL-ish SELECT / WHERE / ORDER BY / LIMIT over a CSV. Runs entirely in your browser, no upload."
wasm          = "gizza_ai_csv_query_web"
export        = "run"
live          = false
output_label  = "Result (CSV)"
format        = "text"

[[input]]
name        = "data"
label       = "CSV (with header)"
placeholder = "name,age,city\nAlice,30,NYC\nBob,25,LA"
source      = "field"
multiline   = true

[[input]]
name        = "q"
label       = "Query"
placeholder = "SELECT name, age WHERE age >= 30 ORDER BY age DESC LIMIT 5"
source      = "field"
multiline   = true

[[input]]
name        = "delimiter"
label       = "Delimiter (, tab ; |)"
placeholder = ","
source      = "field"

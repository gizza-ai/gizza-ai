slug          = "css-gradient-generator"
title         = "CSS Gradient Generator — gizza.ai"
description   = "Generate CSS linear, radial and conic gradients — pick type, angle and color stops, then copy a ready-to-paste background-image. Free, in-browser."
tags          = ["css gradient", "gradient generator", "linear gradient", "radial gradient", "conic gradient", "background-image", "color stops", "css generator", "web design"]
h1            = "CSS Gradient Generator"
hero_subtitle = "Build linear, radial, or conic CSS gradients from your colors — choose the type, angle, and stops and copy the background-image code. Runs entirely in your browser, no server, no sign-up."
wasm          = "gizza_ai_css_gradient_generator_web"
export        = "run"
live          = false
output_label  = "CSS"
format        = "text"

[[input]]
name        = "colors"
label       = "Color stops (one per line or comma-separated)"
placeholder = "#ff0000\n#0000ff"
source      = "field"
multiline   = true

# gradient_type/shape render as <select> and repeating as a checkbox — control
# type + options are derived from the descriptor's schema (manifest.json).
[[input]]
name        = "gradient_type"
label       = "Gradient type"
source      = "field"

[[input]]
name        = "angle"
label       = "Angle (degrees — linear/conic)"
placeholder = "180"
source      = "field"

[[input]]
name        = "shape"
label       = "Shape (radial)"
source      = "field"

[[input]]
name        = "repeating"
label       = "Repeating gradient"
source      = "field"

[[input]]
name        = "interpolation"
label       = "Color space (e.g. oklch, hsl longer — optional)"
placeholder = "oklch"
source      = "field"

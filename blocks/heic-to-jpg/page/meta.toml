slug          = "heic-to-jpg"
title         = "Convert HEIC to JPG Online — gizza.ai"
description   = "Convert Apple HEIC/HEIF photos to JPEG or PNG right in your browser. No upload to a server, runs locally, free."
tags          = ["heic", "heif", "jpg", "jpeg", "png", "image", "convert", "iphone"]
h1            = "Convert HEIC to JPG"
hero_subtitle = "Pick an iPhone .heic photo — it's converted to JPEG (or PNG) in your browser, nothing is uploaded."
wasm          = "gizza_ai_heic_to_jpg_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Converted image"
format        = "image"

[[input]]
name   = "file"
source = "file"
accept = "image/heic,image/heif"
label  = "HEIC / HEIF photo"

[[input]]
name        = "format"
source      = "field"
label       = "Output format (jpg|png)"
placeholder = "jpg"

slug          = "numeric-row-deduplicator"
title         = "Numeric Row Deduplicator — Remove Duplicate Number Rows Online"
description   = "Remove duplicate numeric rows from CSV/TSV in your browser. Compare cells by value, key on selected columns, apply rounding tolerance, and keep first or last."
tags          = ["deduplicate numeric rows", "remove duplicate rows", "numeric dedupe", "csv duplicate remover", "round tolerance dedupe"]
h1            = "Numeric Row Deduplicator"
hero_subtitle = "Remove duplicate rows from a numeric table, comparing each cell by its numeric value — so 1, 1.0, 1.00, +1 and 1e0 all collapse to one row, unlike a plain text deduper. Key on chosen columns, round away float noise, and keep the first or last occurrence. Runs entirely in your browser; nothing is uploaded."
wasm          = "gizza_ai_numeric_row_deduplicator_web"
export        = "run"
live          = false
output_label  = "De-duplicated rows"
format        = "text"

[[input]]
name        = "data"
label       = "Rows (CSV / TSV, one row per line)"
placeholder = "1,2\n1.0,2.0\n1.00,2\n3,4"
source      = "field"
multiline   = true

[[input]]
name        = "columns"
label       = "Key columns (names or 1-based numbers; blank = whole row)"
placeholder = "1, 3"
source      = "field"

[[input]]
name        = "header"
label       = "First row is a header (kept as-is; enables column names)"
source      = "field"

[[input]]
name        = "delimiter"
label       = "Delimiter ( , tab ; | )"
placeholder = ","
source      = "field"

[[input]]
name        = "precision"
label       = "Rounding tolerance (decimals before comparing; -1 = exact)"
placeholder = "-1"
source      = "field"

[[input]]
name        = "keep"
label       = "Keep which occurrence"
source      = "field"

[input.labels]
first = "First — preserve first-occurrence order"
last  = "Last — keep the last occurrence"

[[example]]
label = "Collapse 1, 1.0 and 1.00"
[example.params]
data = "1,2\n1.0,2.0\n1.00,2\n3,4"

[[example]]
label = "Dedupe on the first column only"
[example.params]
data    = "id,score\n1,90.0\n1,91\n2,80"
columns = "id"
header  = "true"

[[example]]
label = "Round away float noise (2 decimals)"
[example.params]
data      = "0.30000000000000004\n0.3\n0.31"
precision = "2"

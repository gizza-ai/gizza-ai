slug          = "audio-loop"
title         = "Loop Audio Online — Repeat a Sound to Any Length"
description   = "Loop any audio file right in your browser — repeat a short sound to a target duration or a number of plays, saved as MP3, WAV and more. Free."
tags          = ["audio", "loop", "repeat", "seamless", "extend", "background", "ambience"]
h1            = "Loop an Audio File"
hero_subtitle = "Pick a short sound and a target length or play count — it's looped in your browser, nothing is uploaded."
wasm          = "gizza_ai_audio_loop_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Looped audio"
format        = "audio"

[[input]]
name   = "audio"
source = "file"
accept = "audio/*"
label  = "Audio"

[[input]]
name        = "duration"
source      = "field"
label       = "Target length (seconds)"
placeholder = "30"

[[input]]
name        = "count"
source      = "field"
label       = "Or total plays (needs length 0)"
placeholder = "0"

[[input]]
name   = "format"
source = "field"
label  = "Output format"

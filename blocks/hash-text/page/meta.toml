slug          = "hash-text"
title         = "Text Hash Generator — MD5, SHA-256, SHA-3, BLAKE3 | gizza.ai"
description   = "Generate a cryptographic hash of any text instantly in your browser. Pick MD5, SHA-1, SHA-224/256/384/512, SHA3-256/512, BLAKE2 or BLAKE3, with hex or base64 output. Free, private, no sign-up — nothing is uploaded."
tags          = ["hash", "md5", "sha1", "sha256", "sha512", "sha3", "blake2", "blake3", "checksum", "digest", "hex", "base64", "cryptography"]
h1            = "Text Hash Generator"
hero_subtitle = "Compute the hash of any text with a selectable algorithm — MD5, SHA-1, the SHA-2 family, SHA-3, BLAKE2 and BLAKE3 — in hex or base64. Runs entirely in your browser, no server, no sign-up."
wasm          = "gizza_ai_hash_text_web"
export        = "run"
live          = false
output_label  = "Hash digest"
format        = "text"

[[input]]
name        = "text"
label       = "Text to hash"
placeholder = "Hello, world!"
source      = "field"
multiline   = true

# algorithm/input_encoding/output_format render as <select> and uppercase as a
# checkbox — control type + options are derived from the descriptor's schema
# (manifest.json), so labels here stay short and option lists are NOT duplicated.
[[input]]
name        = "algorithm"
label       = "Algorithm"
source      = "field"

[[input]]
name        = "input_encoding"
label       = "Interpret input as"
source      = "field"

[[input]]
name        = "output_format"
label       = "Output format"
source      = "field"

[[input]]
name        = "uppercase"
label       = "Uppercase hex"
source      = "field"

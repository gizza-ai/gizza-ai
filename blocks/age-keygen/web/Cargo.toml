[package]
name = "gizza-ai-age-keygen-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
gizza-ai-age-keygen-core = { path = "../core" }
# age's X25519 keygen pulls getrandom 0.2; on wasm32-unknown-unknown it needs the
# `js` feature to bind to crypto.getRandomValues (same fix as blocks/age-encrypt).
getrandom = { version = "0.2", features = ["js"] }

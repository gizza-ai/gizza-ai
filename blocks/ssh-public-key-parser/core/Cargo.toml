[package]
name = "gizza-ai-ssh-public-key-parser-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# base64: the SSH key blob is base64; padding may be absent on hand-edited keys.
base64 = "0.22"
# sha2/sha1/md-5: the three fingerprint digests OpenSSH's ssh-keygen -l -E can print.
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

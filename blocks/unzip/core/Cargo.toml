[package]
name = "gizza-ai-unzip-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# zip with deflate only — drop default time/aes/bzip2/zstd features so it stays
# pure-Rust and wasm32-safe (matches create-zip).
zip = { version = "8", default-features = false, features = ["deflate"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }

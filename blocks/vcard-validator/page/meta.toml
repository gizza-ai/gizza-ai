slug          = "vcard-validator"
title         = "vCard Validator — Check .vcf Files for Bad Phones, Emails & Missing Fields"
description   = "Paste a vCard to validate it against the 2.1, 3.0 and 4.0 specs: missing FN/N/VERSION, malformed phone numbers and emails, bad dates and structure. Runs in your browser."
tags          = ["vcard validator", "vcf validator", "vcard checker", "rfc 6350", "rfc 2426", "vcard 4.0", "contact file lint", "vcf syntax check"]
h1            = "vCard Validator"
hero_subtitle = "Paste a vCard (.vcf) to check it against the 2.1, 3.0 and 4.0 specifications. Reports missing required properties, malformed phone numbers and email addresses, bad dates, broken structure and parameter mistakes — each with a card number, a line number, a severity and a rule name. Get a readable report or JSON for CI. Runs entirely in your browser; nothing is uploaded."
wasm          = "gizza_ai_vcard_validator_web"
export        = "run"
live          = false
output_label  = "Validation result"
format        = "text"
wide          = true

[[input]]
name        = "data"
label       = "vCard / .vcf text"
placeholder = "BEGIN:VCARD\nVERSION:3.0\nFN:Ada Lovelace\nN:Lovelace;Ada\nEMAIL:ada@@example.com\nTEL;WORK:+44 1632 960 961\nBDAY:1815-13-40\nURL:example.com\nEND:VCARD"
source      = "field"
multiline   = true

[[input]]
name   = "version"
label  = "Check against"
source = "field"

[input.labels]
auto  = "Auto — each card's own VERSION"
"2.1" = "vCard 2.1"
"3.0" = "vCard 3.0 (RFC 2426)"
"4.0" = "vCard 4.0 (RFC 6350)"

[[input]]
name        = "default_country"
label       = "Default country for phone numbers (ISO-3166 alpha-2)"
placeholder = "US"
source      = "field"

[[input]]
name   = "check_email"
label  = "Check EMAIL address syntax"
source = "field"

[[input]]
name   = "check_phone"
label  = "Check TEL phone-number validity"
source = "field"

[[input]]
name        = "required_properties"
label       = "Also require these properties (comma-separated)"
placeholder = "UID,ORG"
source      = "field"

[[input]]
name   = "output"
label  = "Output"
source = "field"

[input.labels]
report = "Report — readable list with line numbers"
json   = "JSON — structured result for CI"

[[example]]
label = "Validate a messy card"
[example.params]
data    = "BEGIN:VCARD\nVERSION:3.0\nFN:Ada Lovelace\nN:Lovelace;Ada\nEMAIL:ada@@example.com\nTEL;WORK:+44 1632 960 961\nBDAY:1815-13-40\nURL:example.com\nEND:VCARD"
version = "auto"
output  = "report"

[[example]]
label = "A clean vCard 4.0 card"
[example.params]
data    = "BEGIN:VCARD\r\nVERSION:4.0\r\nFN:Grace Hopper\r\nEMAIL:grace@example.com\r\nTEL:tel:+16502530000\r\nBDAY:--1209\r\nEND:VCARD\r\n"
version = "4.0"
output  = "report"

[[example]]
label = "National numbers with a country hint"
[example.params]
data            = "BEGIN:VCARD\nVERSION:3.0\nFN:Sam Carter\nN:Carter;Sam;;;\nTEL:(650) 253-0000\nTEL:(555) 000-0000\nEND:VCARD"
default_country = "US"
output          = "report"

[[example]]
label = "CardDAV profile as JSON"
[example.params]
data                = "BEGIN:VCARD\nVERSION:4.0\nFN:Grace Hopper\nEND:VCARD"
required_properties = "UID"
output              = "json"

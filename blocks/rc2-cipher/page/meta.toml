slug          = "rc2-cipher"
title         = "RC2 Cipher — Encrypt/decrypt with RC2 (ECB/CBC, RFC 2268) — gizza.ai"
description   = "Encrypt or decrypt with the RC2 block cipher (RFC 2268) in ECB or CBC mode, configurable effective key bits, hex or Base64 output — in your browser."
tags          = ["rc2", "rc2 encrypt", "rc2 decrypt", "rfc 2268", "effective key length", "ecb", "cbc", "legacy cipher"]
h1            = "RC2 cipher"
hero_subtitle = "Encrypt or decrypt data with RC2 (RFC 2268), ECB or CBC, at a configurable effective key length, hex or base64. For legacy interop. Runs in your browser; nothing is uploaded."
wasm          = "gizza_ai_rc2_cipher_web"
export        = "run"
live          = false
output_label  = "Result"
format        = "text"

[[input]]
name        = "data"
label       = "Data (plaintext to encrypt, or ciphertext to decrypt)"
placeholder = "Text to encrypt…"
source      = "field"
multiline   = true

[[input]]
name        = "operation"
label       = "Operation (encrypt | decrypt)"
placeholder = "encrypt"
source      = "field"

[[input]]
name        = "cipher"
label       = "Mode (cbc | ecb)"
placeholder = "cbc"
source      = "field"

[[input]]
name        = "key"
label       = "Key (1-128 bytes, encoded)"
placeholder = "base64 or hex key"
source      = "field"

[[input]]
name        = "iv"
label       = "IV (8 bytes, for cbc)"
placeholder = "base64 or hex iv"
source      = "field"

[[input]]
name        = "effective_key_bits"
label       = "Effective key bits (T1, 1-1024; 0 = full key length)"
placeholder = "0"
source      = "field"

[[input]]
name        = "format"
label       = "Encoding (base64 | hex)"
placeholder = "base64"
source      = "field"

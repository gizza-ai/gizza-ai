slug          = "decision-tree-classifier"
title         = "Decision tree classifier — if/then rules from a pasted table"
description   = "Train a CART, ID3, or C4.5-style decision tree from a pasted CSV table and read the if/then rules, feature importance, accuracy, and predictions."
tags          = ["decision tree", "classifier", "cart", "id3", "c4.5", "machine learning", "csv", "if then rules"]
h1            = "Decision tree classifier"
hero_subtitle = "Paste a labelled table, pick the class column, and get a readable decision tree: numbered if/then rules, feature importance, accuracy, and predictions for new rows."
wasm          = "gizza_ai_decision_tree_classifier_web"
export        = "run"
live          = false
output_label  = "Tree, rules & metrics"
format        = "text"

[[input]]
name        = "data"
label       = "Training table"
placeholder = "color,size,ripe\nred,small,yes\nred,large,yes\ngreen,small,no\ngreen,large,no"
source      = "field"
multiline   = true

[[input]]
name        = "target"
label       = "Class column"
placeholder = "last"
source      = "field"

[[input]]
name        = "features"
label       = "Feature columns"
placeholder = "color,size"
source      = "field"

[[input]]
name   = "criterion"
label  = "Split criterion"
source = "field"

[input.labels]
gini       = "Gini impurity (CART)"
entropy    = "Information gain (ID3)"
gain_ratio = "Gain ratio (C4.5)"

[[input]]
name   = "splits"
label  = "Categorical splits"
source = "field"

[input.labels]
binary   = "Binary (one value vs the rest)"
multiway = "Multiway (one branch per value)"

[[input]]
name        = "max_depth"
label       = "Max depth"
placeholder = "5"
source      = "field"
kind        = "slider"
min         = "1"
max         = "20"
step        = "1"

[[input]]
name        = "min_samples_split"
label       = "Min rows to split a node"
placeholder = "2"
source      = "field"
kind        = "slider"
min         = "2"
max         = "100"
step        = "1"

[[input]]
name        = "min_samples_leaf"
label       = "Min rows per leaf"
placeholder = "1"
source      = "field"
kind        = "slider"
min         = "1"
max         = "100"
step        = "1"

[[input]]
name        = "min_gain"
label       = "Min split gain (pre-pruning)"
placeholder = "0"
source      = "field"
kind        = "slider"
min         = "0"
max         = "1"
step        = "0.01"

[[input]]
name   = "class_weight"
label  = "Class weight"
source = "field"

[input.labels]
none     = "Equal weight"
balanced = "Balanced (inverse frequency)"

[[input]]
name        = "test_split"
label       = "Hold-out test split"
placeholder = "0"
source      = "field"
kind        = "slider"
min         = "0"
max         = "0.5"
step        = "0.05"

[[input]]
name        = "seed"
label       = "Seed"
placeholder = "42"
source      = "field"

[[input]]
name        = "predict"
label       = "Rows to classify"
placeholder = "color,size\ngreen,small"
source      = "field"
multiline   = true

[[input]]
name   = "header"
label  = "Header row"
source = "field"

[input.labels]
auto = "Auto-detect"
yes  = "First row is header"
no   = "No header"

[[input]]
name        = "decimals"
label       = "Decimal places"
placeholder = "4"
source      = "field"
kind        = "slider"
min         = "0"
max         = "12"
step        = "1"

[[input]]
name   = "format"
label  = "Output format"
source = "field"

[input.labels]
text = "Readable report"
json = "JSON"
csv  = "CSV"
dot  = "Graphviz DOT"

[[example]]
label = "Categorical rules"
[example.params]
data = "color,size,ripe\nred,small,yes\nred,large,yes\ngreen,small,no\ngreen,large,no"
target = "ripe"
criterion = "gini"
format = "text"

[[example]]
label = "Numeric threshold"
[example.params]
data = "hours,score,pass\n1,10,no\n2,20,no\n3,30,no\n4,40,no\n6,60,yes\n7,70,yes\n8,80,yes\n9,90,yes"
target = "pass"
criterion = "entropy"
max_depth = "3"
format = "text"

[[example]]
label = "Multiway C4.5"
[example.params]
data = "outlook,play\nsunny,no\nsunny,no\novercast,yes\novercast,yes\nrain,yes\nrain,no"
target = "play"
criterion = "gain_ratio"
splits = "multiway"
format = "text"

[[example]]
label = "Predict new rows"
[example.params]
data = "color,size,ripe\nred,small,yes\nred,large,yes\ngreen,small,no\ngreen,large,no"
target = "ripe"
predict = "color,size\ngreen,large\nred,small"
format = "text"

[[example]]
label = "Graphviz DOT"
[example.params]
data = "color,size,ripe\nred,small,yes\nred,large,yes\ngreen,small,no\ngreen,large,no"
target = "ripe"
format = "dot"

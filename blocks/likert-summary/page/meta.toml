slug          = "likert-summary"
title         = "Likert Scale Summary — item means, top-2-box & stacked bars"
description   = "Summarize Likert survey answers: item means, SD, median, mode, distributions, top/bottom-box percentages, and text stacked bars. Runs in your browser."
tags          = ["likert scale analysis", "likert summary", "top 2 box", "survey item means", "stacked bar chart", "cronbach alpha"]
h1            = "Likert Scale Summary"
hero_subtitle = "Paste your survey answers and get per-item means, SDs, full response distributions, top-2-box and bottom-2-box percentages, and stacked bars. Runs in your browser; nothing is uploaded."
wasm          = "gizza_ai_likert_summary_web"
export        = "run"
live          = false
output_label  = "Likert summary"
format        = "text"
wide          = true

[[input]]
name        = "data"
label       = "Survey answers (first row = item headers, one row per respondent)"
placeholder = "Ease of use,Support,Value for money\n5,2,4\n4,3,4\n5,1,3"
source      = "field"
multiline   = true

# input renders as a <select> (options derive from the descriptor enum).
[[input]]
name  = "input"
label = "Data shape"
source = "field"

[input.labels]
responses = "Responses — one row per respondent"
counts    = "Counts — one row per item, tallies per category"

[[input]]
name        = "items"
label       = "Item columns (names or 1-based indices; blank = all)"
placeholder = "Ease of use,Support"
source      = "field"

[[input]]
name        = "points"
label       = "Scale points"
placeholder = "5"
source      = "field"
kind        = "slider"
step        = "1"

# scale renders as a <select>.
[[input]]
name  = "scale"
label = "Category labels"
source = "field"

[input.labels]
agreement    = "Agreement (Strongly disagree … Strongly agree)"
satisfaction = "Satisfaction (Very dissatisfied … Very satisfied)"
frequency    = "Frequency (Never … Always)"
quality      = "Quality (Poor … Excellent)"
numeric      = "Numeric (1 … N)"
custom       = "Custom — set the labels below"

[[input]]
name        = "labels"
label       = "Custom labels (lowest first, one per point)"
placeholder = "Never,Rarely,Sometimes,Often,Always"
source      = "field"

[[input]]
name        = "reverse"
label       = "Reverse-scored items (names or indices)"
placeholder = "Support"
source      = "field"

[[input]]
name        = "box_size"
label       = "Box size (categories at each end)"
placeholder = "2"
source      = "field"

# missing renders as a <select>.
[[input]]
name  = "missing"
label = "Missing answers"
source = "field"

[input.labels]
exclude  = "Exclude per item (keep every answer given)"
listwise = "Listwise — drop respondents who skipped an item"

# sort renders as a <select>.
[[input]]
name  = "sort"
label = "Item order"
source = "field"

[input.labels]
input       = "As entered"
"mean-desc" = "Highest mean first"
"mean-asc"  = "Lowest mean first"
"top-desc"  = "Highest top-box first"

[[input]]
name        = "decimals"
label       = "Decimal places (means, SD, alpha)"
placeholder = "2"
source      = "field"
kind        = "slider"
step        = "1"

[[input]]
name  = "chart"
label = "Draw stacked bars"
source = "field"

[[input]]
name  = "diverging"
label = "Centre the bars on the neutral midpoint (diverging)"
source = "field"

[[input]]
name  = "alpha"
label = "Add Cronbach's alpha (scale reliability)"
source = "field"

[[input]]
name        = "delimiter"
label       = "Delimiter (comma, tab, semicolon, pipe)"
placeholder = ","
source      = "field"

[[example]]
label = "5-point agreement"
[example.params]
data = "Ease of use,Support,Value for money\n5,2,4\n4,3,4\n5,1,3\n4,2,5\n3,4,4\n5,3,4\n4,2,5"
points = "5"
scale = "agreement"
sort = "mean-desc"

[[example]]
label = "Reverse-score an item + alpha"
[example.params]
data = "Ease of use,Support,Value for money\n5,2,4\n4,3,4\n5,1,3\n4,2,5\n3,4,4\n5,3,4\n4,2,5"
points = "5"
scale = "agreement"
reverse = "Support"
alpha = "true"

[[example]]
label = "Counts + diverging bars"
[example.params]
data = "Item,Never,Rarely,Sometimes,Often,Always\nWeekly standup,1,2,5,8,4\nSprint review,0,1,3,9,7"
input = "counts"
points = "5"
scale = "frequency"
diverging = "true"

[[example]]
label = "7-point satisfaction"
[example.params]
data = "Onboarding,Docs\n7,5\n6,4\n5,6\n7,7\n4,3\n6,5"
input = "responses"
points = "7"
scale = "satisfaction"
box_size = "2"
sort = "top-desc"

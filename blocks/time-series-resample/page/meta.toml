slug          = "time-series-resample"
title         = "Time-Series Resample — Aggregate CSV to Hourly, Daily, Weekly or Monthly"
description   = "Resample timestamped CSVs to hourly, daily, weekly, monthly or yearly buckets with mean, sum, count, median, std or OHLC. Runs in your browser."
tags          = ["time series resample", "csv resample", "aggregate by hour", "daily to weekly csv", "time bucket", "ohlc resample", "downsample time series csv"]
h1            = "Time-Series Resample"
hero_subtitle = "Bucket a timestamped CSV into 15-minute, hourly, daily, weekly, monthly, quarterly or yearly intervals and aggregate every value column — mean, sum, min/max, count, median, std/var or OHLC candles. Gap filling, bucket labelling and grid offsets included. Runs entirely in your browser, no upload."
wasm          = "gizza_ai_time_series_resample_web"
export        = "run"
live          = false
output_label  = "Resampled series"
format        = "text"
wide          = true

[[input]]
name        = "data"
label       = "Series (CSV / TSV, timestamp + value columns)"
placeholder = "time,temp\n2024-05-01T10:00:00Z,10\n2024-05-01T10:30:00Z,20\n2024-05-01T11:15:00Z,30"
source      = "field"
multiline   = true

[[input]]
name        = "interval"
label       = "Interval (15m, 1h, 1d, 1w, 1mo, 1q, 1y)"
placeholder = "1h"
source      = "field"

[[input]]
name   = "aggregate"
label  = "Aggregate per bucket"
source = "field"

[input.labels]
mean   = "Mean — average of the bucket (default)"
sum    = "Sum — total of the bucket"
min    = "Min — lowest value"
max    = "Max — highest value"
count  = "Count — rows with a number"
median = "Median — middle value"
first  = "First — earliest value"
last   = "Last — latest value"
std    = "Std dev — sample (n-1)"
var    = "Variance — sample (n-1)"
ohlc   = "OHLC — open / high / low / close columns"

[[input]]
name        = "time_column"
label       = "Timestamp column (name or 1-based number)"
placeholder = "blank = first column"
source      = "field"

[[input]]
name        = "value_columns"
label       = "Value columns (comma-separated names or numbers)"
placeholder = "blank = every numeric column"
source      = "field"

[[input]]
name   = "label"
label  = "Label buckets with"
source = "field"

[input.labels]
start = "Bucket start (default)"
end   = "Bucket end"

[[input]]
name   = "closed"
label  = "Inclusive side"
source = "field"

[input.labels]
left  = "Left — [start, end) (default)"
right = "Right — (start, end]"

[[input]]
name   = "fill"
label  = "Empty buckets"
source = "field"

[input.labels]
skip     = "Skip — omit them (default)"
empty    = "Empty — blank values"
zero     = "Zero — fill with 0"
previous = "Previous — carry the last value forward"
linear   = "Linear — interpolate between neighbours"

[[input]]
name   = "origin"
label  = "Anchor the bucket grid to"
source = "field"

[input.labels]
epoch     = "Epoch — round clock times (default)"
start     = "First row's timestamp"
start_day = "Midnight UTC of the first row's day"

[[input]]
name        = "offset"
label       = "Shift every edge by (30m, -5h, -3d)"
placeholder = "blank = no shift"
source      = "field"

[[input]]
name   = "time_format"
label  = "Timestamp output format"
source = "field"

[input.labels]
iso           = "ISO-8601 — 2024-05-01T10:00:00Z (default)"
date          = "Date only — 2024-05-01"
datetime      = "Date + time — 2024-05-01 10:00:00"
epoch_seconds = "Epoch seconds"
epoch_millis  = "Epoch milliseconds"

[[input]]
name   = "output"
label  = "Output format"
source = "field"

[input.labels]
csv  = "CSV — same delimiter as the input (default)"
json = "JSON — one object per bucket"

[[example]]
label  = "Half-hourly readings → hourly mean"
params = { data = "time,temp\n2024-05-01T10:00:00Z,10\n2024-05-01T10:30:00Z,20\n2024-05-01T11:15:00Z,30", interval = "1h" }

[[example]]
label  = "Daily sales → weekly sums"
params = { data = "day,sales\n2024-01-01,5\n2024-01-02,7\n2024-01-05,3\n2024-01-08,10\n2024-01-11,4", interval = "1w", aggregate = "sum", time_format = "date" }

[[example]]
label  = "Ticks → hourly OHLC candles"
params = { data = "t,px\n2024-03-04T09:00:00Z,10\n2024-03-04T09:20:00Z,14\n2024-03-04T09:40:00Z,9\n2024-03-04T09:50:00Z,12\n2024-03-04T10:05:00Z,13\n2024-03-04T10:40:00Z,11", interval = "1h", aggregate = "ohlc" }

[[example]]
label  = "Fill gaps by interpolating hourly"
params = { data = "t,v\n2024-01-01T00:00:00Z,4\n2024-01-01T03:00:00Z,8", interval = "1h", fill = "linear" }

[[example]]
label  = "Daily totals on a UTC-5 day boundary"
params = { data = "t,orders\n2024-01-01T06:00:00Z,2\n2024-01-01T20:00:00Z,3\n2024-01-02T02:00:00Z,4", interval = "1d", aggregate = "sum", offset = "-5h", time_format = "datetime" }

[[example]]
label  = "Monthly totals as JSON"
params = { data = "ts,v\n2024-01-04,3\n2024-01-19,5\n2024-02-08,7", interval = "1mo", aggregate = "sum", time_format = "date", output = "json" }

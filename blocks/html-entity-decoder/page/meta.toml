slug          = "html-entity-decoder"
title         = "HTML Entity Decoder"
description   = "Decode HTML character entities to plain text — named (&amp;, &copy;, &mdash;), decimal (&#169;), and hex (&#xA9;) references in your browser."
tags          = ["html entity decoder", "html decode", "html unescape", "named entities", "numeric entities", "html character reference", "mdash", "nbsp", "unescape html"]
h1            = "HTML Entity Decoder"
hero_subtitle = "Turn HTML character entities back into the characters they stand for — named, decimal, and hex references. Runs entirely in your browser, no server, no sign-up."
wasm          = "gizza_ai_html_entity_decoder_web"
export        = "run"
live          = false
output_label  = "Decoded text"
format        = "text"

[[input]]
name        = "text"
label       = "HTML-encoded text"
placeholder = "Fish &amp; Chips &mdash; &#169; 2026 &#x2122;"
source      = "field"
multiline   = true

# `unknown` renders as a <select> — control type + options are derived from the
# descriptor's schema (manifest.json), so the option list is NOT duplicated here.
[[input]]
name        = "unknown"
label       = "Unknown references"
source      = "field"

[[example]]
label = "Named + numeric mix"
[example.params]
text    = "Fish &amp; Chips &mdash; &#169; 2026 &#x2122;"
unknown = "keep"

[[example]]
label = "Typographic entities"
[example.params]
text    = "&ldquo;Caf&eacute; &amp; co.&rdquo; &hellip; &euro;5 &rarr; &pound;4"
unknown = "keep"

[[example]]
label = "Legacy Windows codes"
[example.params]
text    = "&#147;Smart quotes&#148; cost &#128;5 &#151; a deal"
unknown = "keep"

[[example]]
label = "Strict — flag bad entities"
[example.params]
text    = "good &amp; &notreal; bad"
unknown = "error"

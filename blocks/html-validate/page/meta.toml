slug          = "html-validate"
title         = "HTML Validator — Find Unclosed Tags & Nesting Errors"
description   = "Validate an HTML document or snippet and get every syntax error, unclosed tag, and nesting issue with line and column — runs locally in your browser."
tags          = ["html validator", "validate html", "html syntax checker", "unclosed tag finder", "html nesting checker", "check html online", "html error checker", "html lint"]
h1            = "HTML Validator"
hero_subtitle = "Paste an HTML document or snippet and see every syntax error, unclosed tag, and nesting issue — each with its line and column. Runs entirely in your browser; nothing is uploaded."
wasm          = "gizza_ai_html_validate_web"
export        = "run"
live          = false
output_label  = "Validation report"
format        = "text"

[[input]]
name        = "html"
label       = "HTML to validate"
placeholder = "<div><p>Hello<span>world</div></p>"
source      = "field"
multiline   = true

[[input]]
name        = "format"
label       = "Output format"
source      = "field"

[[example]]
label = "Misnested tags"
[example.params]
html = "<b><i>bold italic</b></i>"

[[example]]
label = "Unclosed tags"
[example.params]
html = "<div><p>Hello<span>world</div>"

[[example]]
label = "Valid HTML"
[example.params]
html = "<section><h2>Title</h2><p>Body <a href=\"/x\">link</a>.</p></section>"

[[example]]
label = "JSON output"
[example.params]
html = "<ul><li>one<li>two</ul></p>"
format = "json"

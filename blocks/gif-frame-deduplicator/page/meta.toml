slug          = "gif-frame-deduplicator"
title         = "GIF Frame Deduplicator"
description   = "Remove repeated frames from an animated GIF to shrink it. Set how similar frames must be to count as duplicates; timing is kept, nothing is uploaded."
tags          = ["gif", "animated-gif", "duplicate-frames", "optimize", "compress", "mpdecimate", "screen-recording", "file-size"]
h1            = "GIF Frame Deduplicator"
hero_subtitle = "Drop the near-identical frames a GIF repeats over and over — the animation keeps its timing and gets smaller, all in your browser."
wasm          = "gizza_ai_gif_frame_deduplicator_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Deduplicated GIF"
format        = "image"

[[input]]
name   = "file"
source = "file"
accept = "image/gif"
label  = "Animated GIF"

[[input]]
name        = "threshold"
source      = "field"
label       = "Similarity threshold % (100 = only identical frames, default 98)"
placeholder = "98"

[package]
name = "gizza-ai-odt-to-markdown-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# zip with deflate only (flate2-based) — an .odt is a ZIP container.
zip = { version = "8", default-features = false, features = ["deflate"] }
# quick-xml: parse content.xml / styles.xml / meta.xml (ODF XML).
quick-xml = { version = "0.40", default-features = false }
serde = { version = "1", features = ["derive"] }

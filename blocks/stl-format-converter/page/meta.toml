slug          = "stl-format-converter"
title         = "STL Format Converter — Binary to ASCII STL and Back"
description   = "Convert an STL between binary and ASCII either way, in your browser. Paste binary STL bytes as base64 or hex for readable text, or ASCII STL for a binary download."
tags          = ["stl format converter", "binary stl to ascii", "ascii stl to binary", "stl converter", "stl binary to text", "convert stl encoding", "stl to ascii online", "binary stl reader", "stl file converter"]
h1            = "STL format converter"
hero_subtitle = "Re-encode an STL mesh either way: paste a binary STL's bytes as base64 or hex to get readable ASCII STL text you can diff and edit, or paste ASCII STL to get a compact binary STL back as a downloadable file. The geometry is carried as the same 32-bit floats binary STL stores — nothing is welded, repaired, scaled or re-ordered — so with scientific notation at 9 decimals a binary → ASCII → binary round trip is byte-identical. Runs locally in your browser."
wasm          = "gizza_ai_stl_format_converter_web"
export        = "run"
live          = false
output_label  = "Converted STL"
format        = "text"
wide          = true

[[input]]
name        = "stl"
label       = "STL mesh"
placeholder = "solid demo\n  facet normal 0 0 1\n    outer loop\n      vertex 0 0 0\n      vertex 10 0 0\n      vertex 0 10 0\n    endloop\n  endfacet\nendsolid demo"
source      = "field"
multiline   = true

[[input]]
name   = "input_format"
label  = "Input encoding"
source = "field"
labels = { auto = "Auto-detect", ascii = "ASCII STL text", base64 = "Binary STL bytes, base64", hex = "Binary STL bytes, hex" }

[[input]]
name   = "to"
label  = "Convert to"
source = "field"
labels = { auto = "The other encoding (flip)", ascii = "ASCII STL text", binary = "Binary STL" }

[[input]]
name   = "output"
label  = "Return"
source = "field"
labels = { stl = "The converted STL", summary = "A conversion summary" }

[[input]]
name        = "solid_name"
label       = "Solid name / binary header (blank keeps the source's)"
placeholder = "bracket-v2"
source      = "field"

[[input]]
name   = "normals"
label  = "Facet normals"
source = "field"
labels = { keep = "Keep the stored normals (lossless)", recompute = "Recompute from the triangle winding", zero = "Write 0 0 0" }

[[input]]
name   = "number_format"
label  = "ASCII number format"
source = "field"
labels = { scientific = "Scientific — 2.648000e-002 (STL spec)", decimal = "Decimal — 0.002648 (readable)" }

[[input]]
name        = "precision"
label       = "ASCII decimal places (9 round-trips exactly)"
placeholder = "6"
source      = "field"
kind        = "slider"
step        = "1"

[[input]]
name   = "output_encoding"
label  = "Binary output as"
source = "field"
labels = { "data-url" = "Downloadable data:model/stl URL", base64 = "Raw base64 bytes", hex = "Raw hex bytes" }

[[example]]
label  = "Binary cube → ASCII"
params = { stl = "" }

[[example]]
label  = "ASCII triangle → binary"
params = { stl = "solid demo\n  facet normal 0 0 1\n    outer loop\n      vertex 0 0 0\n      vertex 10 0 0\n      vertex 0 10 0\n    endloop\n  endfacet\nendsolid demo\n" }

[[example]]
label  = "Readable decimals, not exponents"
params = { stl = "", number_format = "decimal" }

[[example]]
label  = "Lossless round-trip (9 decimals)"
params = { stl = "", precision = "9" }

[[example]]
label  = "Conversion summary"
params = { stl = "", output = "summary" }

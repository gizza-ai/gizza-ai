slug          = "audio-volume-adjust"
title         = "Change Audio Volume Online — gizza.ai"
description   = "Boost or cut any audio file's volume right in your browser — by decibels or a factor, with a clipping-safe peak limiter. Nothing is uploaded, free."
tags          = ["audio", "volume", "boost", "louder", "gain", "db", "quieter", "amplify"]
h1            = "Change Audio Volume"
hero_subtitle = "Pick an audio file and a gain — it's boosted or cut in your browser, nothing is uploaded."
wasm          = "gizza_ai_audio_volume_adjust_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Adjusted audio"
format        = "audio"

[[input]]
name   = "audio"
source = "file"
accept = "audio/*"
label  = "Audio"

[[input]]
name        = "amount"
source      = "field"
label       = "Amount"
placeholder = "6"

[[input]]
name   = "unit"
source = "field"
label  = "Unit"

[[input]]
name   = "limiter"
source = "field"
label  = "Prevent clipping (limiter)"

[[input]]
name   = "format"
source = "field"
label  = "Format"

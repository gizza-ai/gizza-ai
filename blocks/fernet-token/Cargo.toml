[workspace]
resolver = "2"
members = [".", "core", "web"]

[package]
name = "gizza-ai-fernet-token-block"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wafer-sdk = { git = "https://github.com/wafer-run/wafer-run.git", branch = "main" }
wafer-block = { git = "https://github.com/wafer-run/wafer-run.git", branch = "main" }
gizza-ai-fernet-token-core = { path = "core" }
gizza-ai-block-utils = { path = "../../block-utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CSPRNG for the generated key + per-token IV (WASI random_get on wasm32-wasip1,
# the OS RNG natively). The page target adds the `js` backend in web/Cargo.toml.
getrandom = "0.2"

[package]
name = "gizza-ai-regex-bulk-match-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# regex for the user-supplied pattern; pure-Rust, wasm-safe (same crate
# regex-column-validate / regex-extract / regex-search use).
regex = "1"

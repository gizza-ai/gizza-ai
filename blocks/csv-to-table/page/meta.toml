slug          = "csv-to-table"
title         = "CSV to Table — Markdown & HTML table generator — gizza.ai"
description   = "Convert CSV data into a Markdown or HTML table, in your browser. Free, private, no upload."
tags          = ["csv to markdown", "csv to html table", "markdown table", "html table generator", "csv table"]
h1            = "CSV to table"
hero_subtitle = "Convert CSV into a Markdown or HTML table. Runs entirely in your browser, no upload."
wasm          = "gizza_ai_csv_to_table_web"
export        = "run"
live          = false
output_label  = "Table"
format        = "text"

[[input]]
name        = "data"
label       = "CSV"
placeholder = "name,role\nAda,Engineer\nBo,Designer"
source      = "field"
multiline   = true

[[input]]
name        = "format"
label       = "Format (markdown | html)"
placeholder = "markdown"
source      = "field"

[[input]]
name        = "header"
label       = "First row is a header"
source      = "field"

[[input]]
name        = "delimiter"
label       = "Delimiter (, tab ; |)"
placeholder = ","
source      = "field"

[package]
name = "gizza-ai-image-border-frame-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

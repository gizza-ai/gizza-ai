[package]
name = "gizza-ai-ssh-public-key-from-private-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
gizza-ai-ssh-public-key-from-private-core = { path = "../core" }
# The rsa/p256/p384/ed25519 crates pull getrandom; on wasm32-unknown-unknown it
# needs the "js" feature to compile (we only parse keys, but the dep graph still
# requires it).
getrandom = { version = "0.2", features = ["js"] }

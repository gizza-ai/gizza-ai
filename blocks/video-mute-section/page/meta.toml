slug          = "video-mute-section"
title         = "Mute Part of a Video Online"
description   = "Silence the audio over a chosen time range in a video while keeping the rest of the sound and the picture untouched. Free, private, runs in your browser."
tags          = ["mute part of video", "silence video section", "mute video range", "remove audio section", "silence audio range", "mute video clip", "ffmpeg"]
h1            = "Mute Part of a Video"
hero_subtitle = "Pick a video and silence the audio between a start and end time — the rest of the sound stays, the picture is copied untouched, and nothing is uploaded."
wasm          = "gizza_ai_video_mute_section_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Video with the section muted"
format        = "video"

[[input]]
name   = "file"
source = "file"
accept = "video/*"
label  = "Video"

# Field order MUST match web/src/lib.rs build_argv: start, end.
[[input]]
name        = "start"
source      = "field"
label       = "Mute from (seconds)"
placeholder = "5"

[[input]]
name        = "end"
source      = "field"
label       = "Mute until (seconds)"
placeholder = "10"

[[example]]
label  = "Silence seconds 5–10"
params = { start = "5", end = "10" }

[[example]]
label  = "Mute the first 3 seconds"
params = { start = "0", end = "3" }

[[example]]
label  = "Bleep a word at 12.5–13.2"
params = { start = "12.5", end = "13.2" }

[package]
name = "gizza-ai-rncryptor-encrypt-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
pbkdf2 = { version = "0.13", default-features = false }
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
subtle = "2"
hex = "0.4"
base64 = "0.22"
# Supplies the fresh salts + IV when the caller leaves those fields empty: WASI
# `random_get` under wafer (wasm32-wasip1) and the native OS RNG in the CLI.
getrandom = "0.2"

# wasm32-unknown-unknown (the page build) has no entropy source of its own;
# getrandom's `js` backend routes to crypto.getRandomValues. Scoped to that
# target so the wasm32-wasip1 block build keeps the plain WASI backend.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

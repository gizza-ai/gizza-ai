slug          = "todo-organizer"
title         = "To-do Organizer — Brain-dump to Prioritized Checklist"
description   = "Turn a brain-dump into a prioritized Markdown checklist — tasks grouped High/Medium/Low by urgency keywords, with due-date hints. Free, in-browser."
tags          = ["todo organizer", "task prioritizer", "brain dump to list", "markdown checklist", "to-do list maker"]
h1            = "To-do Organizer"
hero_subtitle = "Paste a messy brain-dump and get a clean, prioritized Markdown checklist. Tasks are grouped High/Medium/Low by urgency keywords, with due-date hints surfaced. Runs entirely in your browser, no upload, no sign-up."
wasm          = "gizza_ai_todo_organizer_web"
export        = "run"
live          = false
output_label  = "Organized checklist (Markdown)"
format        = "text"

[[input]]
name        = "text"
label       = "Brain-dump (one task per line)"
placeholder = "Call the bank urgently\nBuy milk\nClean the garage someday\nSubmit report by Friday"
source      = "field"
multiline   = true

[[input]]
name        = "group_by"
label       = "Grouping"
source      = "field"

[[input]]
name        = "numbered"
label       = "Numbered list"
source      = "field"

[[input]]
name        = "show_due"
label       = "Show due-date hints"
source      = "field"

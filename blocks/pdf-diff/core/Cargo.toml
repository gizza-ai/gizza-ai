[package]
name = "gizza-ai-pdf-diff-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# default-features = false drops `rayon` (threads) and the date crates so the
# tree stays thread-free and compiles to wasm32-wasip1 (same pin as
# pdf-extract-text / pdf-crop / merge-pdf).
lopdf = { version = "=0.36.0", default-features = false }
serde = { version = "1", features = ["derive"] }

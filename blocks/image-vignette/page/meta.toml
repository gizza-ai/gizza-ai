slug          = "image-vignette"
title         = "Add a Vignette to an Image Online — gizza.ai"
description   = "Add a soft darkened or lightened vignette around the edges of a photo, right in your browser — adjustable strength and center. Nothing is uploaded, free."
tags          = ["image", "vignette", "photo", "effects", "darken", "lighten", "edges", "filter"]
h1            = "Add a Vignette to an Image"
hero_subtitle = "Pick an image and a strength — the vignette is applied in your browser, nothing is uploaded."
wasm          = "gizza_ai_image_vignette_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Vignetted image"
format        = "image"

[[input]]
name   = "image"
source = "file"
accept = "image/*"
label  = "Image"

[[input]]
name        = "strength"
source      = "field"
label       = "Strength (0–100)"
placeholder = "40"

[[input]]
name   = "mode"
source = "field"
label  = "Mode"

[[input]]
name        = "center_x"
source      = "field"
label       = "Center X (% of width)"
placeholder = "50"

[[input]]
name        = "center_y"
source      = "field"
label       = "Center Y (% of height)"
placeholder = "50"

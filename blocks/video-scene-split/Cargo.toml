[workspace]
resolver = "2"
members = [".", "core", "web"]

[package]
name = "gizza-ai-video-scene-split-block"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wafer-sdk = { git = "https://github.com/wafer-run/wafer-run.git", branch = "main" }
wafer-block = { git = "https://github.com/wafer-run/wafer-run.git", branch = "main" }
gizza-ai-video-scene-split-core = { path = "core" }
gizza-ai-block-utils = { path = "../../block-utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# zip with deflate only (flate2-based) — bundle every scene clip + the timing
# CSV into one downloadable archive; drop the default time/aes/bzip2/zstd deps.
zip = { version = "8", default-features = false, features = ["deflate"] }

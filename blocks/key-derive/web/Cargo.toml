[package]
name = "gizza-ai-key-derive-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
gizza-ai-key-derive-core = { path = "../core" }
# argon2 pulls getrandom 0.2; the page targets wasm32-unknown-unknown which needs
# the js backend even though this tool derives with a caller-supplied salt.
getrandom = { version = "0.2", features = ["js"] }

[package]
name = "gizza-ai-key-derive-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
pbkdf2 = { version = "0.13", default-features = false }
scrypt = { version = "0.12", default-features = false }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
hkdf = "0.13"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
getrandom = "0.2"

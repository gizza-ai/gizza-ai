slug          = "video-caption-burner"
title         = "Burn Subtitles Into a Video Online — Free, In-Browser — gizza.ai"
description   = "Hard-burn an SRT or WebVTT subtitle track into your video so captions show even when muted — pick position, font size, color and a background bar. Free, in your browser."
tags          = ["burn subtitles", "hardcode subtitles", "open captions", "srt to video", "vtt", "burn captions", "caption video", "hardsub", "reels", "shorts", "ffmpeg"]
h1            = "Burn Subtitles Into a Video"
hero_subtitle = "Paste your SRT or WebVTT captions and they're baked into the video — always visible, even on silent autoplay. Everything runs in your browser; nothing is uploaded."
wasm          = "gizza_ai_video_caption_burner_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Captioned video"
format        = "video"

[[input]]
name   = "file"
source = "file"
accept = "video/*"
label  = "Video"

# Field order MUST equal web/src/lib.rs build_argv param order:
# subtitles, position, font_size, font_color, background, background_color,
# background_opacity.
[[input]]
name        = "subtitles"
source      = "field"
label       = "Subtitles (SRT or WebVTT)"
placeholder = "1\n00:00:01,000 --> 00:00:04,000\nHello, world!"
multiline   = true

[[input]]
name   = "position"
source = "field"
label  = "Position"

[input.labels]
"bottom" = "Bottom (default)"
"center" = "Center"
"top"    = "Top"

[[input]]
name        = "font_size"
source      = "field"
label       = "Font size (px)"
placeholder = "24"
kind        = "slider"
step        = "1"

[[input]]
name        = "font_color"
source      = "field"
label       = "Text color"
placeholder = "white, yellow or #FFCC00"
kind        = "color"

[[input]]
name   = "background"
source = "field"
label  = "Background bar behind the captions"

[[input]]
name        = "background_color"
source      = "field"
label       = "Background bar color"
placeholder = "black or #000000"
kind        = "color"

[[input]]
name        = "background_opacity"
source      = "field"
label       = "Background opacity"
placeholder = "0.5"
kind        = "slider"
step        = "0.05"

[[example]]
label  = "Classic white captions"
params = { subtitles = "1\n00:00:00,000 --> 00:00:02,000\nWelcome to the channel\n\n2\n00:00:02,000 --> 00:00:04,000\nLet's get started", position = "bottom" }

[[example]]
label  = "Yellow, no bar"
params = { subtitles = "1\n00:00:00,000 --> 00:00:03,000\nBright yellow captions", font_color = "#FFCC00", background = "false" }

[[example]]
label  = "Big top captions"
params = { subtitles = "1\n00:00:00,000 --> 00:00:03,000\nUP HERE", position = "top", font_size = "48" }

[[example]]
label  = "WebVTT input"
params = { subtitles = "WEBVTT\n\n00:00.000 --> 00:02.000\nWebVTT works too\n\n00:02.000 --> 00:04.000\nSame result" }

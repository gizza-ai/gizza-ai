[package]
name = "gizza-ai-super-timeline-builder-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
csv = "1"
# No `clock` feature: we only parse/format timestamps (never read the system
# clock), so this stays instantiable under both wafer (wasm32-wasip1) and
# wasm-pack (wasm32-unknown-unknown) with no getrandom/js dependency.
chrono = { version = "0.4", default-features = false, features = ["std"] }

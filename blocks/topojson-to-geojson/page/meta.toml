slug          = "topojson-to-geojson"
title         = "TopoJSON to GeoJSON Converter — Expand Shared Arcs"
description   = "Convert TopoJSON to GeoJSON in your browser. Decodes shared arcs, delta encoding and the quantization transform into standard RFC 7946 features."
tags          = ["topojson to geojson", "topojson converter", "convert topojson", "topojson decoder", "geojson converter", "topojson arcs"]
h1            = "TopoJSON to GeoJSON Converter"
hero_subtitle = "Expand a compact TopoJSON topology — shared arcs, delta encoding and the quantization transform — into standard GeoJSON features. Runs in your browser; nothing is uploaded."
wasm          = "gizza_ai_topojson_to_geojson_web"
export        = "run"
live          = false
output_label  = "GeoJSON"
format        = "text"

[[input]]
name        = "topojson"
label       = "TopoJSON"
placeholder = "{ \"type\": \"Topology\", \"objects\": { \"line\": { \"type\": \"LineString\", \"arcs\": [0] } }, \"arcs\": [[[0, 0], [1, 1]]] }"
source      = "field"
multiline   = true

[[input]]
name        = "object"
label       = "Object to expand (blank = all)"
placeholder = "countries"
source      = "field"

# output renders as a <select>; the option list derives from the descriptor enum.
[[input]]
name   = "output"
label  = "Output shape"
source = "field"

[input.labels]
"feature-collection"  = "FeatureCollection — features with properties and id"
"geometry-collection" = "GeometryCollection — geometries only"

[[input]]
name   = "include_bbox"
label  = "Add a bounding box (bbox)"
source = "field"

[[input]]
name        = "precision"
label       = "Coordinate decimals (-1 = full precision)"
placeholder = "-1"
source      = "field"

[[input]]
name        = "indent"
label       = "Indent spaces (0 = minify)"
placeholder = "2"
source      = "field"

[[example]]
label  = "Two polygons sharing an arc"
params = { topojson = "{\"type\":\"Topology\",\"transform\":{\"scale\":[0.5,0.5],\"translate\":[10,20]},\"objects\":{\"blocks\":{\"type\":\"GeometryCollection\",\"geometries\":[{\"type\":\"Polygon\",\"id\":\"a\",\"properties\":{\"name\":\"West\"},\"arcs\":[[0,1]]},{\"type\":\"Polygon\",\"id\":\"b\",\"properties\":{\"name\":\"East\"},\"arcs\":[[2,-1]]}]}},\"arcs\":[[[2,0],[0,2]],[[2,2],[-2,0],[0,-2],[2,0]],[[2,0],[2,0],[0,2],[-2,0]]]}", object = "", output = "feature-collection", include_bbox = "false", precision = "-1", indent = "2" }

[[example]]
label  = "One named object, with bbox"
params = { topojson = "{\"type\":\"Topology\",\"objects\":{\"roads\":{\"type\":\"LineString\",\"properties\":{\"ref\":\"A1\"},\"arcs\":[0]},\"rails\":{\"type\":\"LineString\",\"properties\":{\"ref\":\"ECML\"},\"arcs\":[1]}},\"arcs\":[[[0,0],[1,3]],[[100,100],[200,200]]]}", object = "roads", output = "feature-collection", include_bbox = "true", precision = "-1", indent = "2" }

[[example]]
label  = "Geometries only, rounded, minified"
params = { topojson = "{\"type\":\"Topology\",\"transform\":{\"scale\":[0.1,0.1],\"translate\":[0,0]},\"objects\":{\"pts\":{\"type\":\"MultiPoint\",\"coordinates\":[[3,3],[7,9]]}},\"arcs\":[]}", object = "", output = "geometry-collection", include_bbox = "false", precision = "6", indent = "0" }

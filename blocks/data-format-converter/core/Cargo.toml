[package]
name = "gizza-ai-data-format-converter-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
csv = "1"
# preserve_order: object keys keep their source order (CSV header order / JSON
# key order) instead of being alphabetized, so record output is stable.
serde_json = { version = "1", features = ["preserve_order"] }

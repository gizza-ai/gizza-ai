slug          = "ip-address-validate"
title         = "IP Address Validator — check, canonicalize and classify IPv4 & IPv6"
description   = "Validate a list of IPv4/IPv6 addresses, get the RFC 5952 canonical form, the type (private, loopback, multicast…) and why anything failed. Runs in your browser."
tags          = ["ip address validator", "ipv6 validator", "ipv4 validator", "canonicalize ipv6", "expand ipv6 address", "private ip checker", "bulk ip validation", "reverse dns pointer"]
h1            = "IP Address Validator"
hero_subtitle = "Paste one address or five thousand. Each line is checked with a specific reason when it fails, rewritten in RFC 5952 canonical form, and classified against the IANA special-purpose registries — private, loopback, link-local, multicast, documentation, CGNAT and the rest."
wasm          = "gizza_ai_ip_address_validate_web"
export        = "run"
live          = false
output_label  = "Result"
format        = "text"
wide          = true

[[input]]
name        = "addresses"
label       = "IP addresses (one per line)"
placeholder = "192.168.1.1\n2001:0DB8::1\n100.64.0.1\n10.0.0.0/8\n[2001:db8::1]:443\n192.168.1.256"
source      = "field"
multiline   = true

[[input]]
name    = "family"
label   = "Accepted family"
default = "any"
source  = "field"
labels  = { any = "Any (default) — IPv4 and IPv6", ipv4 = "IPv4 only — reject IPv6 lines", ipv6 = "IPv6 only — reject IPv4 lines" }

[[input]]
name    = "output"
label   = "Output"
default = "report"
source  = "field"
labels  = { report = "Report (default) — labelled details per address", table = "Table — CSV, one row per address", json = "JSON — array of objects", valid = "Valid only — canonical addresses", invalid = "Invalid only — with the reason", summary = "Summary — CSV of the totals" }

[[input]]
name    = "ipv6_form"
label   = "IPv6 canonical form"
default = "compressed"
source  = "field"
labels  = { compressed = "Compressed (default) — RFC 5952, 2001:db8::1", expanded = "Expanded — all 8 groups, 2001:0db8:0000:…:0001" }

[[input]]
name    = "allow_prefix"
label   = "Allow /prefix suffix (10.0.0.0/8)"
default = "true"
source  = "field"

[[input]]
name    = "allow_port"
label   = "Allow :port suffix ([2001:db8::1]:443)"
default = "true"
source  = "field"

[[input]]
name   = "allow_leading_zeros"
label  = "Allow IPv4 leading zeros, read as decimal (192.168.01.1)"
source = "field"

[[input]]
name   = "dedupe"
label  = "Drop duplicate addresses"
source = "field"

[[example]]
label  = "Classify a mixed list"
params = { addresses = "192.168.1.1\n8.8.8.8\n2001:0DB8::1\nfe80::1%eth0\n100.64.0.1", family = "any", output = "report", ipv6_form = "compressed", allow_prefix = "true", allow_port = "true", allow_leading_zeros = "false", dedupe = "false" }

[[example]]
label  = "Canonicalize IPv6"
params = { addresses = "2001:0DB8:0000:0000:0000:0000:0000:0001\n::FFFF:192.0.2.1\nFF02:0:0:0:0:0:0:1", family = "ipv6", output = "valid", ipv6_form = "compressed", allow_prefix = "true", allow_port = "true", allow_leading_zeros = "false", dedupe = "false" }

[[example]]
label  = "Expand IPv6 to 8 groups"
params = { addresses = "2001:db8::1\nfe80::1\n::1", family = "ipv6", output = "valid", ipv6_form = "expanded", allow_prefix = "true", allow_port = "true", allow_leading_zeros = "false", dedupe = "false" }

[[example]]
label  = "Find the bad lines"
params = { addresses = "192.168.1.256\n2001:db8::1::2\n10.0.0.0/33\nnot-an-ip\n192.0.2.1", family = "any", output = "invalid", ipv6_form = "compressed", allow_prefix = "true", allow_port = "true", allow_leading_zeros = "false", dedupe = "false" }

[[example]]
label  = "Audit a log's IPs as CSV"
params = { addresses = "203.0.113.9\n10.1.2.3\n2001:db8::1\n203.0.113.9\n8.8.8.8", family = "any", output = "table", ipv6_form = "compressed", allow_prefix = "true", allow_port = "true", allow_leading_zeros = "false", dedupe = "false" }

[[example]]
label  = "Count by category"
params = { addresses = "10.0.0.1\n10.0.0.2\n127.0.0.1\n8.8.8.8\nfe80::1\nnope", family = "any", output = "summary", ipv6_form = "compressed", allow_prefix = "true", allow_port = "true", allow_leading_zeros = "false", dedupe = "false" }

slug          = "spell-check"
title         = "Spell Checker — Free Online Spelling Corrector — gizza.ai"
description   = "Check English spelling, get ranked suggestions, and copy a corrected version. Private, free, and runs in your browser."
tags          = ["spell checker", "spell check", "spelling corrector", "fix spelling", "typo finder", "correct text", "proofreading", "spelling suggestions", "english spell check"]
h1            = "Spell Checker"
hero_subtitle = "Paste English text to find misspelled words, see ranked suggestions, and get a fully corrected copy. Runs entirely in your browser — no server, no sign-up."
wasm          = "gizza_ai_spell_check_web"
export        = "run"
live          = false
output_label  = "Spelling report"
format        = "text"

[[input]]
name        = "text"
label       = "Text to check"
placeholder = "I recieve teh enviroment."
source      = "field"
multiline   = true

# max_suggestions renders as a bounded slider (1–20); ignore_* render as
# checkboxes and custom_words as a field — control types come from the
# descriptor schema (manifest.json), so options are not duplicated here.
[[input]]
name        = "max_suggestions"
label       = "Suggestions per word"
placeholder = "5"
source      = "field"
kind        = "slider"
step        = "1"

[[input]]
name        = "ignore_uppercase"
label       = "Ignore ALL-CAPS acronyms (NASA, HTML)"
source      = "field"

[[input]]
name        = "ignore_capitalized"
label       = "Ignore Capitalized words (names, proper nouns)"
source      = "field"

[[input]]
name        = "custom_words"
label       = "Custom words (treated as correct)"
placeholder = "gizza, wafer, wasm"
source      = "field"
multiline   = true

[[example]]
label = "Typo sentence"
[example.params]
text = "I recieve teh enviroment."

[[example]]
label = "Wider suggestions"
[example.params]
text = "acheive enviroment definately"
max_suggestions = "8"

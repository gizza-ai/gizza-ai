[package]
name = "gizza-ai-pronounceable-password-generator-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
gizza-ai-pronounceable-password-generator-core = { path = "../core" }
# getrandom 0.2 needs the `js` backend on the wasm32-unknown-unknown page target.
getrandom = { version = "0.2", features = ["js"] }

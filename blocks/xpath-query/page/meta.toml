slug          = "xpath-query"
title         = "XPath Query — Evaluate XPath 1.0 on XML/XHTML"
description   = "Run an XPath 1.0 expression against XML or XHTML and return matching node values or serialized XML. Local browser WebAssembly tool."
tags          = ["xpath", "xpath query", "xml xpath", "xhtml xpath", "xml query", "xpath tester", "xpath evaluator"]
h1            = "XPath query"
hero_subtitle = "Evaluate XPath 1.0 expressions against XML or XHTML. Return text values, attributes, counts, booleans, or serialized matching nodes."
wasm          = "gizza_ai_xpath_query_web"
export        = "run"
live          = false
output_label  = "Matches"
format        = "text"

[[input]]
name        = "expression"
label       = "XPath expression"
placeholder = "//book/title or count(//item)"
source      = "field"

[[input]]
name        = "xml"
label       = "XML or XHTML document"
placeholder = "<catalog><book id=\"b1\"><title>Rust</title></book></catalog>"
source      = "field"
multiline   = true

[[input]]
name        = "output"
label       = "Output (value | xml)"
placeholder = "value"
source      = "field"

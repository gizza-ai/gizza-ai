slug          = "svg-to-data-uri"
title         = "SVG to Data URI — URL-encode or Base64 for CSS and HTML"
description   = "Convert SVG markup to an inline data: URI — URL-encoded or Base64 — with ready-to-paste CSS, mask, img and JSX snippets. Free, runs in your browser."
tags          = ["svg to data uri", "svg url encoder", "svg to base64", "css background-image svg", "inline svg", "data uri"]
h1            = "SVG to Data URI"
hero_subtitle = "Paste SVG markup and get an inline data: URI plus the CSS, mask, img or JSX snippet to paste. Nothing is uploaded — it all runs in your browser."
wasm          = "gizza_ai_svg_to_data_uri_web"
export        = "run"
live          = false
output_label  = "Snippet"
format        = "text"

[[input]]
name        = "svg"
label       = "SVG markup"
placeholder = "<svg viewBox=\"0 0 16 16\"><circle cx=\"8\" cy=\"8\" r=\"7\" fill=\"#0af\"/></svg>"
source      = "field"
multiline   = true

# encoding/output/quotes render as <select>; options derive from the descriptor.
[[input]]
name        = "encoding"
label       = "Encoding"
source      = "field"

[input.labels]
url    = "URL-encoded (usually smaller)"
base64 = "Base64 (about 33% larger)"

[[input]]
name        = "output"
label       = "Snippet"
source      = "field"

[input.labels]
uri     = "Data URI only"
css     = "CSS background-image"
mask    = "CSS mask-image"
img     = "HTML <img> tag"
jsx     = "JSX component"
compare = "Size comparison"

[[input]]
name        = "quotes"
label       = "Attribute quotes (URL-encoded only)"
source      = "field"

[input.labels]
single = "Rewrite \" to ' (shorter)"
encode = "Percent-encode \" as %22"

[[input]]
name        = "minify"
label       = "Minify first (strip XML declaration, DOCTYPE, comments, whitespace)"
source      = "field"

[[input]]
name        = "add_xmlns"
label       = "Add xmlns when missing"
source      = "field"

[[example]]
label = "CSS background icon"
[example.params]
svg       = "<svg viewBox=\"0 0 16 16\"><circle cx=\"8\" cy=\"8\" r=\"7\" fill=\"#0af\"/></svg>"
encoding  = "url"
output    = "css"
quotes    = "single"
minify    = "true"
add_xmlns = "true"

[[example]]
label = "Base64 <img> tag"
[example.params]
svg       = "<svg viewBox=\"0 0 16 16\"><path d=\"M2 9l4 4 8-9\" stroke=\"#111\" stroke-width=\"2\" fill=\"none\"/></svg>"
encoding  = "base64"
output    = "img"
quotes    = "single"
minify    = "true"
add_xmlns = "true"

[[example]]
label = "Which encoding is smaller?"
[example.params]
svg       = "<svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"4\" fill=\"#f43f5e\"/></svg>"
encoding  = "url"
output    = "compare"
quotes    = "single"
minify    = "true"
add_xmlns = "true"

slug          = "salsa20-cipher"
title         = "Salsa20 Cipher — Encrypt/decrypt with Salsa20 (key + nonce) — gizza.ai"
description   = "Encrypt and decrypt with the Salsa20 stream cipher in your browser — 16/32-byte key, 8-byte nonce, hex or base64 output. Free, private, nothing uploaded."
tags          = ["salsa20", "salsa20 encrypt", "salsa20 decrypt", "stream cipher", "djb", "estream", "cipher"]
h1            = "Salsa20 cipher"
hero_subtitle = "Encrypt or decrypt text with Salsa20 — 16/32-byte key, 8-byte nonce, text or encoded inputs, hex or base64. Runs in your browser; nothing is uploaded."
wasm          = "gizza_ai_salsa20_cipher_web"
export        = "run"
live          = false
output_label  = "Result"
format        = "text"

[[input]]
name        = "data"
label       = "Data (plaintext to encrypt, or ciphertext to decrypt)"
placeholder = "Text to encrypt…"
source      = "field"
multiline   = true

[[input]]
name        = "operation"
label       = "Operation (encrypt | decrypt)"
placeholder = "encrypt"
source      = "field"

[[input]]
name        = "key"
label       = "Key (16 or 32 bytes)"
placeholder = "32-char passphrase, or encoded key"
source      = "field"

[[input]]
name        = "nonce"
label       = "Nonce (8 bytes)"
placeholder = "8-char string, or 16-char hex"
source      = "field"

[[input]]
name        = "key_format"
label       = "Key/nonce format (text | encoded)"
placeholder = "text"
source      = "field"

[[input]]
name        = "counter"
label       = "Initial block counter"
placeholder = "0"
source      = "field"

[[input]]
name        = "format"
label       = "Encoding (hex | base64)"
placeholder = "hex"
source      = "field"

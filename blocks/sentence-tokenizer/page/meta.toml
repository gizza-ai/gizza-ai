slug          = "sentence-tokenizer"
title         = "Sentence Tokenizer — Split Text into Sentences and Tokens"
description   = "Tokenize text into sentences and word, number and punctuation tokens with character offsets. JSON, TSV, one-token-per-line output. Free, in your browser."
tags          = ["sentence tokenizer", "word tokenizer", "tokenize text online", "sentence segmentation", "nlp tokenizer", "character offsets", "token spans", "split text into tokens", "punkt alternative", "treebank tokenizer"]
h1            = "Sentence Tokenizer"
hero_subtitle = "Split any text into sentences and into word, number, punctuation, URL and e-mail tokens — each with its exact character span in the original text. Abbreviation-, decimal- and quote-aware boundaries, Treebank contraction splitting, JSON, TSV or plain-line output. Runs entirely in your browser, no upload, no sign-up."
wasm          = "gizza_ai_sentence_tokenizer_web"
export        = "run"
live          = false
output_label  = "Tokens"
format        = "text"
wide          = true

[[input]]
name        = "text"
label       = "Text"
placeholder = "Dr. Green paid $99.99. It works."
source      = "field"
multiline   = true

# format / newlines render as <select> and the four flags as checkboxes — the
# control type and options come from the descriptor's schema (manifest.json).
[[input]]
name   = "format"
label  = "Output format"
source = "field"

[input.labels]
json      = "JSON with counts, spans and token types"
table     = "TSV table (sentence, token, start, end, type, text)"
lines     = "One token per line"
spaces    = "One sentence per line, tokens space-separated"
sentences = "One sentence per line (original text)"

[[input]]
name   = "newlines"
label  = "Line breaks"
source = "field"

[input.labels]
paragraph = "Only a blank line ends a sentence"
never     = "Never end a sentence (join wrapped lines)"
always    = "Always end a sentence (one per line)"

[[input]]
name   = "split_contractions"
label  = "Split contractions (don't → do + n't)"
source = "field"

[[input]]
name   = "split_hyphenated"
label  = "Split hyphenated compounds"
source = "field"

[[input]]
name   = "lowercase"
label  = "Lowercase token text"
source = "field"

[[input]]
name   = "drop_punctuation"
label  = "Drop punctuation and symbols"
source = "field"

[[input]]
name        = "extra_abbreviations"
label       = "Extra abbreviations (never split after these)"
placeholder = "Corp., Ltd., Inc."
source      = "field"

[[example]]
label  = "Tokens with offsets (JSON)"
params = { text = "Dr. Green paid $99.99. It works.", format = "json", newlines = "paragraph", split_contractions = "true" }

[[example]]
label  = "TSV table of spans"
params = { text = "J. R. R. Tolkien met Mrs. Hall, e.g. on Mar. 3.", format = "table", newlines = "paragraph", split_contractions = "true" }

[[example]]
label  = "Treebank contractions"
params = { text = "They don't like Anna's cat.", format = "lines", newlines = "paragraph", split_contractions = "true" }

[[example]]
label  = "Words only, lowercased"
params = { text = "Hello, World! Bye.", format = "lines", newlines = "paragraph", split_contractions = "true", lowercase = "true", drop_punctuation = "true" }

[[example]]
label  = "URLs, e-mails and numbers"
params = { text = "Order 1,000.00 on 2018-11-11 via https://example.com/a.b or mail ops@example.com.", format = "table", newlines = "paragraph", split_contractions = "true" }

[[example]]
label  = "One line per sentence"
params = { text = "Buy milk\nWalk the dog\nBook the flight", format = "sentences", newlines = "always", split_contractions = "true" }

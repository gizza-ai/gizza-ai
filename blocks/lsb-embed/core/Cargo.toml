[package]
name = "gizza-ai-lsb-embed-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# Pure-Rust decode/encode. default-features off to drop codecs we don't need;
# PNG is the lossless output that preserves the hidden LSBs (JPEG would destroy
# them). The common web input formats are enabled so any uploaded image works.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

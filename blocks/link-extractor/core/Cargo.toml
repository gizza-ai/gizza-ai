[package]
name = "gizza-ai-link-extractor-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# scraper: html5ever-based HTML parsing + CSS selectors (wasm32-safe, also used
# by html-table-extractor / css-select-extract).
scraper = "0.20"
# pulldown-cmark: pure-Rust CommonMark parser (wasm32-safe), for Markdown links.
pulldown-cmark = { version = "0.12", default-features = false }
# url: WHATWG URL parser (wasm32-safe, already used by extract-urls) — resolves
# relative links against an optional base URL.
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

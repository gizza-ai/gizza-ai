[package]
name = "gizza-ai-pdf-form-data-extract-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# Pure-Rust PDF parser (no native libs). `default-features = false` drops `rayon`
# (threads) and the `chrono`/`jiff`/`time` date crates, keeping the tree
# thread-free so it links cleanly on wasm32-wasip1 (the block target) — the same
# recipe pdf-extract-text / pdf-form-fill use. We only READ the AcroForm dicts, so
# none of lopdf's write/encrypt paths are exercised.
lopdf = { version = "=0.36.0", default-features = false }
# Emits the JSON output shape (array of {name, type, value} objects).
serde_json = "1"

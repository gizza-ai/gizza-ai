[workspace]
resolver = "2"
members = ["."]

[package]
name = "gizza-ai-recipe-extract-block"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wafer-sdk = { git = "https://github.com/wafer-run/wafer-run.git", branch = "main" }
wafer-block = { git = "https://github.com/wafer-run/wafer-run.git", branch = "main" }
gizza-ai-block-utils = { path = "../../block-utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# scraper: html5ever-based lenient HTML parsing (wasm32-safe; same engine
# css-select-extract / structured-data-validator use).
scraper = { version = "0.20", default-features = false }

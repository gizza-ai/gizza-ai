slug          = "geojson-coords-to-csv"
title         = "GeoJSON Coordinate Extractor — Every Vertex to CSV"
description   = "Extract every coordinate in a GeoJSON file into a flat longitude,latitude CSV — one row per vertex, with elevation, rounding, dedupe and lat/lon order options."
tags          = ["geojson coordinates", "coordinate extractor", "geojson to csv", "vertices to csv", "lat lon csv", "gis", "polygon vertices"]
h1            = "GeoJSON Coordinate Extractor"
hero_subtitle = "Paste a FeatureCollection, Feature or bare geometry and get every coordinate as its own CSV row — longitude, latitude and elevation. Choose the axis order, round to a fixed number of decimals, drop repeated ring-closing vertices, and add index, feature and part/ring/position columns. Runs entirely in your browser; nothing is uploaded."
wasm          = "gizza_ai_geojson_coords_to_csv_web"
export        = "run"
live          = false
output_label  = "Coordinate CSV"
format        = "text"

[[input]]
name        = "geojson"
label       = "GeoJSON"
placeholder = "{\"type\":\"Feature\",\"properties\":{},\"geometry\":{\"type\":\"LineString\",\"coordinates\":[[-105.1,40.1],[-105.2,40.2]]}}"
source      = "field"
multiline   = true

[[input]]
name   = "order"
label  = "Coordinate order"
source = "field"

[input.labels]
lonlat = "longitude, latitude (GeoJSON order)"
latlon = "latitude, longitude (map order)"

[[input]]
name   = "columns"
label  = "Columns"
source = "field"

[input.labels]
coords = "Coordinates only"
indexed = "Index + coordinates"
feature = "Index, feature and geometry type"
full = "Everything — part, ring, position and ring_close too"

[[input]]
name   = "shapes"
label  = "Geometries to include"
source = "field"

[input.labels]
all = "All geometries"
points = "Points only"
lines = "Lines only"
polygons = "Polygons only"

[[input]]
name   = "elevation"
label  = "Elevation column"
source = "field"

[input.labels]
auto = "Only when the data has Z values"
always = "Always (blank when 2-D)"
never = "Never"

[[input]]
name        = "precision"
label       = "Decimal places"
placeholder = "-1 keeps the source value; 0-15 rounds"
source      = "field"

[[input]]
name   = "dedupe"
label  = "Repeated coordinates"
source = "field"

[input.labels]
none = "Keep every position"
"ring-close" = "Drop each ring's closing vertex"
adjacent = "Also drop consecutive repeats"
all = "Unique coordinates only"

[[input]]
name   = "properties"
label  = "Append feature property columns"
source = "field"

[[input]]
name   = "delimiter"
label  = "Delimiter"
source = "field"

[input.labels]
comma = "Comma (,)"
semicolon = "Semicolon (;)"
tab = "Tab"
pipe = "Pipe (|)"

[[input]]
name   = "header"
label  = "Include header row"
source = "field"

[[example]]
label = "Line vertices"
[example.params]
geojson = "{\"type\":\"Feature\",\"properties\":{\"name\":\"Ridge trail\"},\"geometry\":{\"type\":\"LineString\",\"coordinates\":[[-105.1,40.1,2410],[-105.2,40.2,2530],[-105.3,40.15,2480]]}}"
order = "lonlat"
columns = "coords"
shapes = "all"
elevation = "auto"
precision = "-1"
dedupe = "none"
properties = "false"
delimiter = "comma"
header = "true"

[[example]]
label = "Polygon corners, no closing vertex"
[example.params]
geojson = "{\"type\":\"Polygon\",\"coordinates\":[[[-105.0,40.0],[-104.9,40.0],[-104.9,40.1],[-105.0,40.1],[-105.0,40.0]]]}"
order = "lonlat"
columns = "indexed"
shapes = "all"
elevation = "never"
precision = "-1"
dedupe = "ring-close"
properties = "false"
delimiter = "comma"
header = "true"

[[example]]
label = "Lat/lon for a spreadsheet"
[example.params]
geojson = "{\"type\":\"FeatureCollection\",\"features\":[{\"type\":\"Feature\",\"id\":\"a\",\"properties\":{\"name\":\"Depot\"},\"geometry\":{\"type\":\"Point\",\"coordinates\":[-105.27055,40.01499]}},{\"type\":\"Feature\",\"id\":\"b\",\"properties\":{\"name\":\"Yard\"},\"geometry\":{\"type\":\"Point\",\"coordinates\":[-105.08442,40.58526]}}]}"
order = "latlon"
columns = "coords"
shapes = "all"
elevation = "never"
precision = "5"
dedupe = "none"
properties = "true"
delimiter = "comma"
header = "true"

[[example]]
label = "Full audit columns"
[example.params]
geojson = "{\"type\":\"MultiPolygon\",\"coordinates\":[[[[0,0],[1,0],[1,1],[0,0]]],[[[5,5],[6,5],[6,6],[5,5]]]]}"
order = "lonlat"
columns = "full"
shapes = "polygons"
elevation = "never"
precision = "-1"
dedupe = "ring-close"
properties = "false"
delimiter = "comma"
header = "true"

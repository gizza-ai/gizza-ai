slug          = "table-heatmap"
title         = "Table Heatmap — color-scale conditional formatting for CSV — gizza.ai"
description   = "Shade a CSV/table's numeric cells with a spreadsheet-style color scale and get a styled HTML table. Free, private, no upload."
tags          = ["table heatmap", "conditional formatting", "csv color scale", "heatmap table", "html table generator"]
h1            = "Table heatmap"
hero_subtitle = "Apply spreadsheet-style color-scale conditional formatting to a CSV/table and get a styled HTML table. Runs entirely in your browser, no upload."
wasm          = "gizza_ai_table_heatmap_web"
export        = "run"
live          = false
output_label  = "HTML table"
format        = "text"

[[input]]
name        = "data"
label       = "CSV / table"
placeholder = "region,q1,q2\nNorth,120,90\nSouth,60,150"
source      = "field"
multiline   = true

[[input]]
name        = "scale"
label       = "Color scale"
placeholder = "red-yellow-green"
source      = "field"

[[input]]
name        = "header"
label       = "First row is a header"
source      = "field"

[[input]]
name        = "per_column"
label       = "Scale each column independently"
source      = "field"

[[input]]
name        = "min"
label       = "Fixed minimum (optional)"
placeholder = "auto"
source      = "field"

[[input]]
name        = "midpoint"
label       = "Fixed midpoint, diverging scales (optional)"
placeholder = "auto"
source      = "field"

[[input]]
name        = "max"
label       = "Fixed maximum (optional)"
placeholder = "auto"
source      = "field"

[[input]]
name        = "delimiter"
label       = "Delimiter (, tab ; |)"
placeholder = ","
source      = "field"

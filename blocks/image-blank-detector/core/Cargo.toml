[package]
name = "gizza-ai-image-blank-detector-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# image: pure-Rust decode only (no encode needed at runtime); default-features
# off keeps the wasm small. Common web formats only.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[package]
name = "gizza-ai-svg-to-png-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
resvg = { version = "0.44", default-features = false }
usvg = { version = "0.44", default-features = false }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "png"] }
jpeg-encoder = { version = "0.7", default-features = false }

[dev-dependencies]
png = "0.17"

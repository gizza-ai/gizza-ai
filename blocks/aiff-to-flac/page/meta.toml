slug          = "aiff-to-flac"
title         = "AIFF to FLAC Converter"
description   = "Convert AIFF or AIF audio to lossless FLAC in your browser — preserve samples and textual tags, choose FLAC compression level 0-12, and download the result."
tags          = ["audio", "aiff", "aif", "flac", "convert", "lossless"]
h1            = "Convert AIFF to FLAC"
hero_subtitle = "Upload an AIFF/AIF audio file and make a smaller lossless FLAC locally in your browser."
wasm          = "gizza_ai_aiff_to_flac_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Converted FLAC"
format        = "audio"

[[input]]
name   = "compression_level"
source = "field"
kind   = "slider"
label  = "FLAC compression level"
placeholder = "5"
min    = "0"
max    = "12"
step   = "1"

[[input]]
name   = "audio"
source = "file"
accept = "audio/*,.aif,.aiff"
label  = "AIFF audio"

[[example]]
label = "Default compression"
compression_level = "5"

[[example]]
label = "Maximum compression"
compression_level = "12"

[workspace]
resolver = "2"
members = ["."]

[package]
name = "gizza-ai-image-fetch-block"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wafer-sdk = { path = "../../../wafer-run-binary-transport/sdks/rust" }
wafer-block = { path = "../../../wafer-run-binary-transport/crates/wafer-block" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

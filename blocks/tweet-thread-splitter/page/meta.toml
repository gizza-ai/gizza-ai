slug          = "tweet-thread-splitter"
title         = "Tweet Thread Splitter — Split Text into Numbered Tweets"
description   = "Split long text into a numbered tweet thread that never breaks mid-word — custom character limit, (i/N) counters, sentence-aware breaks. Free, in your browser."
tags          = ["tweet thread", "twitter thread", "x thread", "thread maker", "tweet splitter", "280 characters", "character counter", "split text", "thread numbering"]
h1            = "Tweet Thread Splitter"
hero_subtitle = "Paste a long post and split it into a numbered Twitter/X thread of character-limit-safe tweets that never break a word in half. Runs entirely in your browser, no server, no sign-up."
wasm          = "gizza_ai_tweet_thread_splitter_web"
export        = "run"
live          = false
output_label  = "Thread"
format        = "text"

[[input]]
name        = "text"
label       = "Your text"
placeholder = "Paste the long post you want to turn into a thread…"
source      = "field"
multiline   = true

# limit/numbering/count render as a field / <select> and prefer_sentences as a
# checkbox — the control type + options are derived from the descriptor's schema
# (manifest.json), so labels here stay short and option lists are not duplicated.
[[input]]
name        = "limit"
label       = "Characters per tweet (10–25000)"
placeholder = "280"
source      = "field"

[[input]]
name        = "numbering"
label       = "Numbering style"
source      = "field"

[[input]]
name        = "count"
label       = "Count length by"
source      = "field"

[[input]]
name        = "prefer_sentences"
label       = "Prefer breaking on sentence boundaries"
source      = "field"

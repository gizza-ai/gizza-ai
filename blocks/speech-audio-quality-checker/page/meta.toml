slug          = "speech-audio-quality-checker"
title         = "Speech Audio Quality Checker — ASR Readiness Preflight"
description   = "Paste a short WAV clip as base64 or hex and check ASR readiness: sample rate, channels, SNR estimate, clipping, level, and verdict."
tags          = ["speech audio", "asr", "transcription", "wav", "snr", "clipping", "audio quality", "speech to text"]
h1            = "Speech audio quality checker"
hero_subtitle = "Pre-flight a short WAV recording before transcription. Decode pasted base64 or hex WAV bytes and check sample rate, channel count, level, estimated SNR, clipping, and an overall ASR-readiness verdict."
wasm          = "gizza_ai_speech_audio_quality_checker_web"
export        = "run"
live          = false
output_label  = "Quality report"
format        = "text"

[[input]]
name        = "input"
label       = "WAV bytes (base64 or hex)"
placeholder = ""
source      = "field"
multiline   = true

[[input]]
name        = "input_format"
label       = "Input encoding"
source      = "field"

[[input]]
name        = "output"
label       = "Output format"
source      = "field"

[[input]]
name        = "target_sample_rate"
label       = "Target sample rate (Hz)"
placeholder = "16000"
source      = "field"

[[input]]
name        = "min_snr_db"
label       = "Minimum SNR (dB)"
placeholder = "20"
source      = "field"

[[input]]
name        = "max_clipping_pct"
label       = "Max clipping (%)"
placeholder = "1.0"
source      = "field"

[[input]]
name        = "clipping_threshold"
label       = "Clipping threshold (full scale)"
placeholder = "0.99"
source      = "field"

[[example]]
label = "Clean 16 kHz WAV → report"
[example.values]
input        = ""
input_format = "base64"
output       = "report"

[[example]]
label = "Same clip → JSON"
[example.values]
input        = ""
input_format = "base64"
output       = "json"

slug          = "xml-structure-analyzer"
title         = "XML Structure Analyzer"
description   = "Analyze an XML document's element tree, tag counts, nesting depth, attributes, namespaces, and structural warnings locally in your browser."
tags          = ["xml", "parser", "structure", "metadata", "developer"]
h1            = "XML Structure Analyzer"
hero_subtitle = "Paste XML to inspect its tree, tag frequency, depth, attributes, namespaces, and document health without transforming the data."
wasm          = "gizza_ai_xml_structure_analyzer_web"
export        = "run"
live          = false
output_label  = "Structure report"
format        = "text"

[[input]]
name        = "xml"
label       = "XML document"
placeholder = "<catalog>\n  <book id=\"b1\"><title>Dune</title></book>\n</catalog>"
source      = "field"
multiline   = true

[[input]]
name        = "format"
label       = "Output format"
source      = "field"
[input.labels]
text = "Text report"
json = "JSON"
csv = "CSV tag table"

[[input]]
name        = "tree_depth"
label       = "Tree depth cap"
placeholder = "0"
source      = "field"
kind        = "slider"
min         = "0"
max         = "20"
step        = "1"

[[input]]
name        = "top_tags"
label       = "Top tag rows"
placeholder = "50"
source      = "field"
kind        = "slider"
min         = "0"
max         = "200"
step        = "1"

[[input]]
name        = "show_attributes"
label       = "Show attributes"
source      = "field"

[[example]]
label = "Book catalog"
xml = "<catalog>\n  <book id=\"b1\"><title>Dune</title><price currency=\"USD\">9.99</price></book>\n  <book id=\"b2\"><title>Emma</title><price currency=\"EUR\">7.50</price></book>\n  <meta/>\n</catalog>"
format = "text"
tree_depth = "0"
top_tags = "50"
show_attributes = "true"

[[example]]
label = "Namespaced envelope"
xml = "<soap:Envelope xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\" xmlns:unused=\"urn:nope\"><soap:Body><Ping id=\"p1\"/></soap:Body></soap:Envelope>"
format = "json"
tree_depth = "0"
top_tags = "50"
show_attributes = "true"

[[example]]
label = "CSV tag counts"
xml = "<rss><channel><item><title>One</title></item><item><title>Two</title></item></channel></rss>"
format = "csv"
tree_depth = "0"
top_tags = "50"
show_attributes = "false"

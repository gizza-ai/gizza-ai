slug          = "xml-to-csv"
title         = "XML to CSV — Convert XML to a CSV table — gizza.ai"
description   = "Flatten repeated XML elements into a CSV table, with columns inferred from child tags and attributes, in your browser. Free, private, no upload."
tags          = ["xml to csv", "xml csv converter", "convert xml", "flatten xml", "xml to spreadsheet"]
h1            = "XML to CSV"
hero_subtitle = "Flatten repeated XML elements into a CSV table — columns inferred from child tags and attributes. Runs entirely in your browser, no upload."
wasm          = "gizza_ai_xml_to_csv_web"
export        = "run"
live          = false
output_label  = "CSV"
format        = "text"

[[input]]
name        = "xml"
label       = "XML"
placeholder = "<catalog>\n  <book><title>Dune</title><author>Herbert</author></book>\n  <book><title>Hyperion</title><author>Simmons</author></book>\n</catalog>"
source      = "field"
multiline   = true

[[input]]
name        = "record"
label       = "Record tag (blank = auto-detect)"
placeholder = "book"
source      = "field"

[[input]]
name        = "attributes"
label       = "Include attributes as columns"
source      = "field"

[[input]]
name        = "delimiter"
label       = "Delimiter (, tab ; |)"
placeholder = ","
source      = "field"

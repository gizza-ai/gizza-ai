[package]
name = "gizza-ai-pptx-to-text-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# A modern .pptx is a ZIP of Office Open XML PresentationML parts.
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.40", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

slug          = "html-minifier"
title         = "HTML Minifier — collapse whitespace & strip comments"
description   = "Minify HTML by collapsing whitespace and removing comments, in your browser. Preserves pre/script/style and significant inline spacing. Nothing is uploaded."
tags          = ["html minifier", "minify html", "compress html", "remove html comments", "collapse whitespace"]
h1            = "HTML Minifier"
hero_subtitle = "Shrink HTML by collapsing whitespace and removing comments. pre/script/style and significant inline spacing are preserved. Runs in your browser; nothing is uploaded."
wasm          = "gizza_ai_html_minifier_web"
export        = "run"
live          = false
output_label  = "Minified HTML"
format        = "text"

[[input]]
name        = "html"
label       = "HTML"
placeholder = "<div>\n  <p>Paste your HTML here</p>\n</div>"
source      = "field"
multiline   = true

[[input]]
name        = "remove_comments"
label       = "Remove comments"
source      = "field"

slug          = "sql-formatter"
title         = "SQL Formatter — pretty-print / beautify SQL queries"
description   = "Format, beautify and standardize SQL queries in your browser. Clauses on their own lines, configurable indentation, keyword casing. Nothing is uploaded."
tags          = ["sql formatter", "sql beautifier", "format sql", "pretty print sql", "sql pretty print", "beautify sql query", "sql indenter"]
h1            = "SQL Formatter"
hero_subtitle = "Pretty-print messy or minified SQL with clean indentation — major clauses on their own lines, configurable indent width and keyword casing. Dialect-agnostic and forgiving. Runs entirely in your browser; nothing is uploaded."
wasm          = "gizza_ai_sql_formatter_web"
export        = "run"
live          = false
output_label  = "Formatted SQL"
format        = "text"

[[input]]
name        = "sql"
label       = "SQL"
placeholder = "select id, name from users where age>18 order by name"
source      = "field"
multiline   = true

[[input]]
name        = "indent"
label       = "Indent (spaces per level)"
placeholder = "2"
source      = "field"

[[input]]
name        = "keyword_case"
label       = "Keyword case"
source      = "field"

[package]
name = "gizza-ai-argon2-hash-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
gizza-ai-argon2-hash-core = { path = "../core" }
# argon2 salt uses getrandom 0.2; the page targets wasm32-unknown-unknown which
# needs the js backend.
getrandom = { version = "0.2", features = ["js"] }

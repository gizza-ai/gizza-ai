slug          = "edge-detection"
title         = "Edge Detection Online — Canny & Sobel Edge Map from an Image"
description   = "Detect edges in a photo with the Canny or Sobel operator and download the edge map. Adjustable thresholds, noise blur and inverted line art, all in your browser."
tags          = ["edge detection", "canny", "sobel", "edge map", "image", "outline", "line art", "contour", "computer vision", "gradient", "invert", "png", "jpg", "webp"]
h1            = "Detect Edges in an Image"
hero_subtitle = "Pick an image and a method — Canny or Sobel edges are traced in your browser, nothing is uploaded."
wasm          = "gizza_ai_edge_detection_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Edge map"
format        = "image"

[[input]]
name   = "image"
source = "file"
accept = "image/*"
label  = "Image"

# Field order MUST equal web/src/lib.rs build_argv param order:
# method, low, high, blur, invert, format.
[[input]]
name   = "method"
source = "field"
label  = "Method"

[input.labels]
"canny"    = "canny — thin white edges on black"
"sobel"    = "sobel — soft gradient magnitude"
"colormix" = "colormix — edges inked over the photo"

[[input]]
name        = "low"
source      = "field"
label       = "Canny low threshold (0–1)"
placeholder = "0.078"
kind        = "slider"
step        = "0.005"

[[input]]
name        = "high"
source      = "field"
label       = "Canny high threshold (0–1)"
placeholder = "0.196"
kind        = "slider"
step        = "0.005"

[[input]]
name        = "blur"
source      = "field"
label       = "Noise reduction (blur sigma, px)"
placeholder = "0"
kind        = "slider"
step        = "0.1"

[[input]]
name   = "invert"
source = "field"
label  = "Invert (black lines on white)"

[[input]]
name   = "format"
source = "field"
label  = "Output format"

[input.labels]
"png"  = "png — lossless, best for line art"
"jpg"  = "jpg — smaller, rings around thin lines"
"webp" = "webp — modern, small"

[[example]]
label  = "Canny (default)"
params = { method = "canny", low = "0.078", high = "0.196" }

[[example]]
label  = "Clean outline"
params = { method = "canny", low = "0.2", high = "0.5", blur = "1" }

[[example]]
label  = "Fine detail"
params = { method = "canny", low = "0.03", high = "0.1" }

[[example]]
label  = "Sobel gradient"
params = { method = "sobel" }

[[example]]
label  = "Coloring page"
params = { method = "canny", low = "0.15", high = "0.4", blur = "1.5", invert = "true" }

[[example]]
label  = "Inked photo"
params = { method = "colormix", low = "0.1", high = "0.3" }

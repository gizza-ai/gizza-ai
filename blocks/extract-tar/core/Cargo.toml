[package]
name = "gizza-ai-extract-tar-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# tar: pure-Rust tar reader/writer. default-features off drops the `xattr` extra
# (unix-only) so it compiles to wasm32-wasip1; we only read entries.
tar = { version = "0.4", default-features = false }
# flate2: gzip (tar.gz/tgz) inflate — proven wasm32-safe (miniz_oxide backend).
flate2 = "1"
# zip with deflate only — repack extracted files into one archive.
zip = { version = "8", default-features = false, features = ["deflate"] }

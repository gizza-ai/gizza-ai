[package]
name = "gizza-ai-html-form-field-extractor-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# scraper: html5ever-based HTML parsing, wasm32-safe (the same engine
# html-extract and html-table-extractor already use). Forms in the wild have
# unquoted attributes and implied closing tags, so a real parser is required.
scraper = { version = "0.20", default-features = false }
# preserve_order keeps the JSON keys in the order a reader expects
# (tag, type, name, id, label, required, …) instead of alphabetical.
serde_json = { version = "1", features = ["preserve_order"] }
# csv gives correct quoting/escaping for the flat one-row-per-field output.
csv = "1"

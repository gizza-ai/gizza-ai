slug          = "multi-encoder"
title         = "Multi Encoder — Base64 / Hex / Binary / Morse — gizza.ai"
description   = "Encode or decode text across Base64, hex, binary, URL-encoding, ROT13, and Morse — one tool, both directions. Runs in your browser, nothing uploaded, free."
tags          = ["base64", "hex encode", "binary text", "url encode", "rot13", "morse code", "encoder decoder"]
h1            = "Multi Encoder"
hero_subtitle = "Encode or decode text — Base64, hex, binary, URL, ROT13, or Morse — in one tool. Runs entirely in your browser, no upload."
wasm          = "gizza_ai_multi_encoder_web"
export        = "run"
live          = false
output_label  = "Result"
format        = "text"

[[input]]
name        = "text"
label       = "Text"
placeholder = "Hello, world"
source      = "field"
multiline   = true

[[input]]
name        = "encoding"
label       = "Scheme (base64|hex|binary|url|rot13|morse)"
placeholder = "base64"
source      = "field"

[[input]]
name        = "direction"
label       = "Direction (encode|decode)"
placeholder = "encode"
source      = "field"

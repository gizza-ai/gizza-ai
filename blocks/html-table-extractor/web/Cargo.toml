[package]
name = "gizza-ai-html-table-extractor-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
gizza-ai-html-table-extractor-core = { path = "../core" }
# scraper's tree pulls getrandom 0.3 (via ahash); on the wasm32-unknown-unknown
# page target it needs the wasm_js backend (also enabled via the cfg in
# .cargo/config.toml). Harmless on the wasm32-wasip1 block target.
getrandom = { version = "0.3", features = ["wasm_js"] }

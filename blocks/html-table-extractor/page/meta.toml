slug          = "html-table-extractor"
title         = "Extract Tables from HTML — CSV or JSON — gizza.ai"
description   = "Paste HTML and pull out any <table> as clean CSV or JSON. Pick the table and output format. Runs in your browser, nothing is uploaded, free."
tags          = ["html table to csv", "extract table", "html to json", "scrape table", "table converter"]
h1            = "Extract Tables from HTML"
hero_subtitle = "Paste HTML, choose a table and a format — get clean CSV or JSON. Runs entirely in your browser, no upload, no sign-up."
wasm          = "gizza_ai_html_table_extractor_web"
export        = "run"
live          = false
output_label  = "Extracted table"
format        = "text"

[[input]]
name        = "html"
label       = "HTML"
placeholder = "Paste HTML containing a <table>…"
source      = "field"
multiline   = true

[[input]]
name        = "format"
label       = "Output format (csv|json)"
placeholder = "csv"
source      = "field"

[[input]]
name        = "table_index"
label       = "Table number (0 = first)"
placeholder = "0"
source      = "field"

[[input]]
name        = "header"
label       = "First row is a header"
source      = "field"

slug          = "hash-all"
title         = "Hash All — MD5, SHA, SHA-3, RIPEMD, BLAKE3, Whirlpool, CRC-32"
description   = "Hash text with every common algorithm at once — MD5, SHA-1, SHA-256/512, SHA-3, BLAKE3, RIPEMD-160, CRC-32 and more — free and private in your browser."
tags          = ["hash", "md5", "sha1", "sha256", "sha512", "sha3", "ripemd", "blake2", "blake3", "whirlpool", "crc32", "checksum", "digest", "hex", "base64", "cryptography"]
h1            = "Hash All Generator"
hero_subtitle = "Compute every common digest of any text at once — CRC-32, MD5, SHA-1, the SHA-2 family, SHA-3, RIPEMD-160, BLAKE2, BLAKE3 and Whirlpool — in one labeled table. Runs entirely in your browser, no server, no sign-up."
wasm          = "gizza_ai_hash_all_web"
export        = "run"
live          = false
output_label  = "All digests"
format        = "text"

[[input]]
name        = "text"
label       = "Text to hash"
placeholder = "Hello, world!"
source      = "field"
multiline   = true

# input_encoding/output_format render as <select> and uppercase as a checkbox —
# control type + options are derived from the descriptor's schema (manifest.json),
# so labels here stay short and option lists are NOT duplicated.
[[input]]
name        = "input_encoding"
label       = "Interpret input as"
source      = "field"

[[input]]
name        = "output_format"
label       = "Output format"
source      = "field"

[[input]]
name        = "uppercase"
label       = "Uppercase hex"
source      = "field"

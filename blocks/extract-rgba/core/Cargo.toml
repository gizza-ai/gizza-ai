[package]
name = "gizza-ai-extract-rgba-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# image: pure-Rust decode → raw RGBA. default-features off; common formats.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }

slug          = "image-compress"
title         = "Compress an Image Online"
description   = "Shrink an image's file size right in your browser — re-encode a JPG, PNG, or WebP at a chosen quality, same format out. No upload to a server, runs locally, free."
tags          = ["image", "compress", "shrink", "optimize", "quality", "jpg", "png", "webp", "file size"]
h1            = "Compress an Image"
hero_subtitle = "Pick an image, choose a quality — it's re-encoded smaller in your browser, nothing is uploaded."
wasm          = "gizza_ai_image_compress_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Compressed image"
format        = "image"

[[input]]
name   = "image"
source = "file"
accept = "image/*"
label  = "Image"

[[input]]
name        = "quality"
source      = "field"
label       = "Quality (1-100)"
placeholder = "80"

slug          = "extract-substring"
title         = "Extract Substring — by index or between delimiters — gizza.ai"
description   = "Pull out a portion of text by start/end character index, or everything between two delimiters — in your browser. Nothing is uploaded."
tags          = ["substring", "extract text", "between delimiters", "slice string", "cut text", "string index"]
h1            = "Extract Substring"
hero_subtitle = "Grab part of some text — by character index (negatives count from the end) or everything between two delimiters. Runs in your browser; nothing is uploaded."
wasm          = "gizza_ai_extract_substring_web"
export        = "run"
live          = false
output_label  = "Result"
format        = "text"

[[input]]
name        = "text"
label       = "Text"
placeholder = "The source text…"
source      = "field"
multiline   = true

# mode renders as a <select>; options derive from the descriptor schema.
[[input]]
name        = "mode"
label       = "Mode"
source      = "field"

[[input]]
name        = "start"
label       = "Start index (index mode)"
placeholder = "0"
source      = "field"

[[input]]
name        = "end"
label       = "End index (index mode, optional)"
placeholder = ""
source      = "field"

[[input]]
name        = "start_delim"
label       = "Start delimiter (delimiters mode)"
placeholder = "["
source      = "field"

[[input]]
name        = "end_delim"
label       = "End delimiter (delimiters mode)"
placeholder = "]"
source      = "field"

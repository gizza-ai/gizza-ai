[package]
name = "gizza-ai-scrypt-derive-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
gizza-ai-scrypt-derive-core = { path = "../core" }

[profile.release]
# scrypt does heavy integer mixing; keep opt-level for in-browser speed.
opt-level = 3

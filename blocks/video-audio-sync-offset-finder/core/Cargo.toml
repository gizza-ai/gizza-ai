[package]
name = "gizza-ai-video-audio-sync-offset-finder-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# symphonia: pure-Rust container demuxers + audio decoders (same wasm-proven
# crate + feature set as blocks/media-info; full DECODE proven by
# blocks/loudness-matched-ab-prep). Video tracks in MP4/MKV appear as
# CODEC_TYPE_NULL and are skipped -- only the audio track is decoded.
# No std clock / no I/O at runtime.
symphonia = { version = "0.5", default-features = false, features = [
    "isomp4",
    "mkv",
    "ogg",
    "wav",
    "aiff",
    "caf",
    "flac",
    "mp3",
    "aac",
    "adpcm",
    "pcm",
    "vorbis",
    "alac",
] }

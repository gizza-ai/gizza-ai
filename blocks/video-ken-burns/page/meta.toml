slug          = "video-ken-burns"
title         = "Ken Burns Effect — Animate a Photo into Video"
description   = "Turn a still photo into a short MP4 with a smooth pan-and-zoom (Ken Burns) move, right in your browser. Pick the motion, length and size — nothing is uploaded, free."
tags          = ["ken burns", "photo to video", "pan and zoom", "zoom photo", "image to video", "slideshow", "ffmpeg"]
h1            = "Ken Burns Effect from a Photo"
hero_subtitle = "Pick a photo and a motion — it's animated into a short video clip in your browser, nothing is uploaded."
wasm          = "gizza_ai_video_ken_burns_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Animated clip"
format        = "video"

[[input]]
name   = "file"
source = "file"
accept = "image/*"
label  = "Photo"

[[input]]
name   = "direction"
source = "field"
label  = "Motion"

[input.labels]
zoom-in   = "Zoom in — push slowly toward the center (default)"
zoom-out  = "Zoom out — pull back to reveal the whole photo"
pan-left  = "Pan left — glide across toward the left"
pan-right = "Pan right — glide across toward the right"
pan-up    = "Pan up — drift upward"
pan-down  = "Pan down — drift downward"

[[input]]
name        = "duration"
source      = "field"
label       = "Duration (seconds, 1-30)"
placeholder = "5"
kind        = "slider"
step        = "0.5"

[[input]]
name        = "zoom"
source      = "field"
label       = "Zoom amount (1.0-2.0)"
placeholder = "1.3"
kind        = "slider"
step        = "0.05"

[[input]]
name        = "width"
source      = "field"
label       = "Width (px)"
placeholder = "1280"

[[input]]
name        = "height"
source      = "field"
label       = "Height (px)"
placeholder = "720"

[[input]]
name        = "fps"
source      = "field"
label       = "Frames per second (1-60)"
placeholder = "30"
kind        = "slider"
step        = "1"

[[example]]
label  = "Slow zoom-in (7s)"
params = { direction = "zoom-in", duration = "7", zoom = "1.3", width = "1280", height = "720", fps = "30" }

[[example]]
label  = "Zoom-out reveal (5s)"
params = { direction = "zoom-out", duration = "5", zoom = "1.5", width = "1280", height = "720", fps = "30" }

[[example]]
label  = "Pan right (6s)"
params = { direction = "pan-right", duration = "6", zoom = "1.4", width = "1280", height = "720", fps = "30" }

[[example]]
label  = "Vertical story (5s)"
params = { direction = "zoom-in", duration = "5", zoom = "1.3", width = "1080", height = "1920", fps = "30" }

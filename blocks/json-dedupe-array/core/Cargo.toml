[package]
name = "gizza-ai-json-dedupe-array-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order keeps each element's ORIGINAL object key order in the output;
# comparison canonicalises key order separately (see core::canonical).
serde_json = { version = "1", features = ["preserve_order"] }

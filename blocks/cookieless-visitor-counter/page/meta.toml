slug          = "cookieless-visitor-counter"
title         = "Cookieless Visitor Counter — Unique Visitors from an Access Log"
description   = "Count unique visitors in an Apache, nginx, JSON or CSV access log with the daily-salted-hash method. No cookies, no PII kept. Runs in your browser, free."
tags          = ["cookieless visitor counter", "unique visitors from log", "daily salted hash", "privacy analytics", "access log analyzer", "server log unique visitors", "gdpr analytics", "no cookie analytics"]
h1            = "Cookieless Visitor Counter"
hero_subtitle = "Paste an access log and get unique visitors per day — identified by a salted SHA-256 hash that rotates every period, exactly like privacy-first analytics. No cookies, no consent banner, and no IP or user-agent is ever kept. Runs entirely in your browser; nothing is uploaded."
wasm          = "gizza_ai_cookieless_visitor_counter_web"
export        = "run"
live          = false
output_label  = "Visitor report"
format        = "text"

[[input]]
name        = "input"
label       = "Access log"
placeholder = "203.0.113.45 - - [06/Aug/2026:10:00:00 +0000] \"GET / HTTP/1.1\" 200 2326 \"-\" \"Mozilla/5.0 (Macintosh) Chrome/125.0\"\n198.51.100.7 - - [06/Aug/2026:10:04:11 +0000] \"GET /pricing HTTP/1.1\" 200 1180 \"-\" \"Mozilla/5.0 (Windows NT 10.0) Firefox/128.0\""
source      = "field"
multiline   = true

[[input]]
name   = "format"
label  = "Log format"
source = "field"

[input.labels]
auto     = "Auto — sniff the format from the first line"
combined = "Combined log (Apache / nginx, with user-agent)"
common   = "Common log (no user-agent field)"
json     = "JSON / NDJSON — one object per line"
csv      = "CSV — header row naming an ip column"

[[input]]
name   = "identity"
label  = "What identifies a visitor"
source = "field"

[input.labels]
ip_ua      = "IP + user-agent (the privacy-analytics convention)"
ip         = "IP only (the older AWStats convention)"
network_ua = "IP network (/24, /48) + user-agent (Matomo / GA style)"

[[input]]
name   = "period"
label  = "Bucket & salt-rotation window"
source = "field"

[input.labels]
hour  = "Hourly"
day   = "Daily — one row per date"
month = "Monthly"
total = "Whole log — a single bucket"

[[input]]
name        = "salt"
label       = "Secret salt (optional)"
placeholder = "e.g. a per-site random string"
source      = "field"

[[input]]
name   = "exclude_bots"
label  = "Exclude crawler and bot hits"
source = "field"

[[input]]
name        = "hash_length"
label       = "Visitor ID length in hex chars (6–64)"
placeholder = "12"
source      = "field"

[[input]]
name   = "output"
label  = "Output"
source = "field"

[input.labels]
report = "Report — summary, per-period table and totals"
table  = "Markdown table"
json   = "JSON"
csv    = "CSV"
ids    = "Pseudonymous IDs — one row per request"

[[example]]
label = "Daily report (Combined log)"
[example.params]
input  = "203.0.113.45 - - [06/Aug/2026:10:00:00 +0000] \"GET / HTTP/1.1\" 200 2326 \"-\" \"Mozilla/5.0 (Macintosh) Chrome/125.0\"\n203.0.113.45 - - [06/Aug/2026:10:02:00 +0000] \"GET /pricing HTTP/1.1\" 200 1180 \"-\" \"Mozilla/5.0 (Macintosh) Chrome/125.0\"\n198.51.100.7 - - [06/Aug/2026:11:31:00 +0000] \"GET / HTTP/1.1\" 200 2326 \"-\" \"Mozilla/5.0 (Windows NT 10.0) Firefox/128.0\"\n203.0.113.45 - - [07/Aug/2026:09:12:00 +0000] \"GET /docs HTTP/1.1\" 200 900 \"-\" \"Mozilla/5.0 (Macintosh) Chrome/125.0\"\n66.249.66.1 - - [07/Aug/2026:09:20:00 +0000] \"GET /robots.txt HTTP/1.1\" 200 40 \"-\" \"Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)\""
period = "day"
output = "report"

[[example]]
label = "Hourly JSON"
[example.params]
input  = "203.0.113.45 - - [06/Aug/2026:10:00:00 +0000] \"GET / HTTP/1.1\" 200 2326 \"-\" \"Mozilla/5.0 (Macintosh) Chrome/125.0\"\n198.51.100.7 - - [06/Aug/2026:11:31:00 +0000] \"GET / HTTP/1.1\" 200 2326 \"-\" \"Mozilla/5.0 (Windows NT 10.0) Firefox/128.0\""
period = "hour"
output = "json"

[[example]]
label = "Show the pseudonymous IDs"
[example.params]
input  = "203.0.113.45 - - [06/Aug/2026:10:00:00 +0000] \"GET / HTTP/1.1\" 200 2326 \"-\" \"Mozilla/5.0 (Macintosh) Chrome/125.0\"\n203.0.113.45 - - [07/Aug/2026:09:12:00 +0000] \"GET /docs HTTP/1.1\" 200 900 \"-\" \"Mozilla/5.0 (Macintosh) Chrome/125.0\""
period = "day"
output = "ids"

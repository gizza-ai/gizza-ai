slug          = "email-obfuscator"
title         = "Email Obfuscator — Hide Your Email From Spam Bots (HTML Entities, JS, CSS)"
description   = "Email obfuscator — encode your address as HTML entities, a JavaScript writer, CSS reversal, or a ROT13 mailto so spam bots can't harvest it. Free, in-browser."
tags          = ["email obfuscator", "hide email from bots", "anti spam email", "email entity encoder", "mailto obfuscation", "html entity email", "scraper protection", "email harvester block", "rot13 email", "css email obfuscation"]
h1            = "Email Obfuscator"
hero_subtitle = "Turn your email address into scraper-resistant HTML — entities, JavaScript, CSS reversal, or a ROT13 mailto — that bots can't harvest but people can still click. Runs entirely in your browser."
wasm          = "gizza_ai_email_obfuscator_web"
export        = "run"
live          = false
output_label  = "Obfuscated HTML"
format        = "text"

[[input]]
name        = "email"
label       = "Email address"
placeholder = "you@example.com"
source      = "field"
multiline   = false

# mode + entity_style render as <select> (options from the descriptor), link as
# a checkbox (default checked), and link_text as a text field.
[[input]]
name        = "mode"
label       = "Obfuscation mode"
source      = "field"

[[input]]
name        = "entity_style"
label       = "Entity radix (entities / fallbacks)"
source      = "field"

[[input]]
name        = "link"
label       = "Wrap in a clickable mailto: link"
source      = "field"

[[input]]
name        = "link_text"
label       = "Link text (optional)"
placeholder = "Email us"
source      = "field"

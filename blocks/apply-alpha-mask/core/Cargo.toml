[package]
name = "gizza-ai-apply-alpha-mask-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# image: pure-Rust decode + resize + PNG encode. default-features off to drop
# rayon etc.; enable the raster formats we accept for the image + mask inputs.
# Output is always PNG (only PNG holds the full 8-bit alpha channel we produce).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

slug          = "anova"
title         = "One-Way ANOVA Calculator — F Test, P-Value & Post-Hoc Comparisons"
description   = "Run a one-way ANOVA on long, wide, or summary group data with F statistic, p-value, group means, effect sizes, and post-hoc pairs."
tags          = ["anova", "one-way anova", "f test", "statistics", "p value", "post hoc", "tukey hsd", "welch anova", "levene test"]
h1            = "One-way ANOVA calculator for grouped data"
hero_subtitle = "Paste group observations or summary statistics and get the full ANOVA table, F statistic, p-value, effect sizes, assumption checks, and optional post-hoc comparisons locally in your browser."
wasm          = "gizza_ai_anova_web"
export        = "run"
live          = false
output_label  = "ANOVA result"
format        = "text"

[[input]]
name        = "data"
label       = "Data"
placeholder = "5,5,8\n6,7,11\n9,9,13\n9,10,13\n11,11,14"
source      = "field"
multiline   = true

[[input]]
name   = "format"
label  = "Input format"
source = "field"

[input.labels]
auto    = "Auto-detect"
long    = "Long rows: group,value"
wide    = "Wide table: one column per group"
summary = "Summary rows: name,n,mean,sd"

[[input]]
name   = "delimiter"
label  = "Delimiter"
source = "field"

[input.labels]
auto      = "Auto-detect"
comma     = "Comma ( , )"
tab       = "Tab"
semicolon = "Semicolon ( ; )"
pipe      = "Pipe ( | )"
space     = "Whitespace"

[[input]]
name   = "header"
label  = "Header row"
source = "field"

[input.labels]
auto = "Auto-detect"
yes  = "First row is a header"
no   = "No header"

[[input]]
name        = "alpha"
label       = "Significance level (alpha)"
placeholder = "0.05"
source      = "field"
kind        = "slider"
step        = "0.01"

[[input]]
name        = "decimals"
label       = "Decimal places"
placeholder = "4"
source      = "field"
kind        = "slider"
step        = "1"

[[input]]
name   = "posthoc"
label  = "Post-hoc comparisons"
source = "field"

[input.labels]
none       = "None"
tukey      = "Tukey HSD / Tukey-Kramer"
lsd        = "Fisher's LSD"
bonferroni = "Bonferroni"
holm       = "Holm step-down"

[[input]]
name   = "output"
label  = "Output format"
source = "field"

[input.labels]
summary = "Readable summary"
table   = "Markdown tables"
json    = "JSON"

[[example]]
label = "Textbook wide data"
[example.params]
data = "5,5,8\n6,7,11\n9,9,13\n9,10,13\n11,11,14"
format = "wide"
delimiter = "comma"
header = "no"
alpha = "0.05"
decimals = "4"
posthoc = "none"
output = "summary"

[[example]]
label = "Long rows + Tukey"
[example.params]
data = "group,value\nControl,5\nControl,6\nControl,9\nControl,9\nControl,11\nDrug A,5\nDrug A,7\nDrug A,9\nDrug A,10\nDrug A,11\nDrug B,8\nDrug B,11\nDrug B,13\nDrug B,13\nDrug B,14"
format = "long"
delimiter = "comma"
header = "yes"
alpha = "0.05"
decimals = "4"
posthoc = "tukey"
output = "summary"

[[example]]
label = "Published means as JSON"
[example.params]
data = "name,n,mean,sd\nControl,5,8.0,2.4495\nDrug A,5,8.4,2.4083\nDrug B,5,11.8,2.3875"
format = "summary"
delimiter = "comma"
header = "yes"
alpha = "0.05"
decimals = "4"
posthoc = "holm"
output = "json"

[package]
name = "gizza-ai-ecdsa-secp256k1-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# secp256k1 — pure-Rust RustCrypto (same family as the proven p256 in ecdsa-sign
# and the k256 in crypto-keypair-generator). `ecdsa` + `sha256` give
# deterministic RFC 6979 signing (low-S normalized, recoverable); `pkcs8` +
# `pem` parse/emit PKCS#8 / SEC1 private and SPKI public PEM.
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "pkcs8", "pem", "sha256", "alloc"] }
ecdsa = { version = "0.16", default-features = false, features = ["der"] }
# Key generation draws from getrandom (WASI random_get on wasm32-wasip1) — the
# same recipe crypto-keypair-generator proved on every backend.
rand = { version = "0.8", default-features = false, features = ["getrandom"] }
# Message digests: SHA-256/384/512 + Keccak-256 (the Ethereum hash).
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }

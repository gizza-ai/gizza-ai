slug          = "ipynb-to-markdown"
title         = "IPYNB to Markdown — Convert Jupyter Notebooks Online"
description   = "Convert Jupyter .ipynb JSON to Markdown with fenced code blocks, markdown cells, outputs, errors, HTML tables, and embedded image data URIs. Browser-only."
tags          = ["ipynb to markdown", "jupyter notebook markdown", "nbconvert markdown", "notebook converter", "export ipynb"]
h1            = "Convert IPYNB to Markdown"
hero_subtitle = "Paste a Jupyter notebook JSON file and export a clean Markdown document: markdown cells verbatim, code as fenced blocks, and stored outputs rendered inline. Choose whether to keep code, outputs, prompts, and image data. Runs entirely in your browser."
wasm          = "gizza_ai_ipynb_to_markdown_web"
export        = "run"
live          = false
output_label  = "Markdown"
format        = "text"

[[input]]
name        = "notebook"
label       = "Notebook JSON (.ipynb contents)"
placeholder = "{\"cells\":[{\"cell_type\":\"markdown\",\"source\":[\"# Title\\n\"]},{\"cell_type\":\"code\",\"execution_count\":1,\"source\":[\"print(2 + 2)\"],\"outputs\":[{\"output_type\":\"stream\",\"name\":\"stdout\",\"text\":[\"4\\n\"]}]}],\"metadata\":{\"language_info\":{\"name\":\"python\"}},\"nbformat\":4,\"nbformat_minor\":5}"
source      = "field"
multiline   = true

[[input]]
name   = "include_code"
label  = "Include code cells as fenced blocks"
source = "field"

[[input]]
name   = "include_outputs"
label  = "Include stored outputs (stdout, results, errors, images)"
source = "field"

[[input]]
name   = "include_markdown"
label  = "Include markdown/raw cells"
source = "field"

[[input]]
name   = "show_prompts"
label  = "Show execution-count prompts (In [n] / Out [n])"
source = "field"

[[input]]
name   = "image_mode"
label  = "Image handling"
source = "field"

[input.labels]
embed       = "Embed image data URIs (single-file Markdown)"
placeholder = "Use *[image output]* placeholders"
omit        = "Omit image outputs"

[[example]]
label = "Markdown + code + stdout"
[example.params]
notebook = "{\"cells\":[{\"cell_type\":\"markdown\",\"source\":[\"# Demo\\n\",\"Some notes\"]},{\"cell_type\":\"code\",\"execution_count\":1,\"source\":[\"print(2 + 2)\"],\"outputs\":[{\"output_type\":\"stream\",\"name\":\"stdout\",\"text\":[\"4\\n\"]}]}],\"metadata\":{\"language_info\":{\"name\":\"python\"}},\"nbformat\":4,\"nbformat_minor\":5}"

[[example]]
label = "No code, keep outputs"
[example.params]
notebook = "{\"cells\":[{\"cell_type\":\"code\",\"execution_count\":2,\"source\":[\"2 + 2\"],\"outputs\":[{\"output_type\":\"execute_result\",\"execution_count\":2,\"data\":{\"text/plain\":[\"4\"]},\"metadata\":{}}]}],\"metadata\":{\"language_info\":{\"name\":\"python\"}},\"nbformat\":4,\"nbformat_minor\":5}"
include_code = "false"

[[example]]
label = "Prompts + image placeholder"
[example.params]
notebook = "{\"cells\":[{\"cell_type\":\"code\",\"execution_count\":3,\"source\":[\"plot()\"],\"outputs\":[{\"output_type\":\"display_data\",\"data\":{\"image/png\":\"iVBORw0KGgo=\"},\"metadata\":{}}]}],\"metadata\":{\"language_info\":{\"name\":\"python\"}},\"nbformat\":4,\"nbformat_minor\":5}"
show_prompts = "true"
image_mode = "placeholder"

[[example]]
label = "Code only"
[example.params]
notebook = "{\"cells\":[{\"cell_type\":\"markdown\",\"source\":[\"# Skip me\"]},{\"cell_type\":\"code\",\"source\":[\"x = 1\"],\"outputs\":[]}],\"metadata\":{\"language_info\":{\"name\":\"python\"}},\"nbformat\":4,\"nbformat_minor\":5}"
include_markdown = "false"
include_outputs = "false"

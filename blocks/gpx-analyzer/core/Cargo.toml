[package]
name = "gizza-ai-gpx-analyzer-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# quick-xml: pure-Rust, wasm-safe streaming XML reader (proven in xml-formatter,
# epub-to-markdown). default-features=false drops the optional async/encoding bits.
quick-xml = { version = "0.40", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

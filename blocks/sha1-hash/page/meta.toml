slug          = "sha1-hash"
title         = "SHA-1 Hash Generator — gizza.ai"
description   = "Generate a SHA-1 hash of any text in your browser — hex or base64 output, uppercase option, hex/base64 input decoding. Free, private, nothing uploaded."
tags          = ["sha1", "sha-1", "hash", "checksum", "digest", "hex", "base64", "cryptography"]
h1            = "SHA-1 Hash Generator"
hero_subtitle = "Compute the SHA-1 digest of any text — hex or base64 output, uppercase option, and hex/base64 input decoding. Runs entirely in your browser, no server, no sign-up."
wasm          = "gizza_ai_sha1_hash_web"
export        = "run"
live          = false
output_label  = "SHA-1 digest"
format        = "text"

[[input]]
name        = "text"
label       = "Text to hash"
placeholder = "Hello, world!"
source      = "field"
multiline   = true

# input_encoding/output_format render as <select> and uppercase as a checkbox —
# control type + options are derived from the descriptor's schema (manifest.json),
# so labels here stay short and the option lists are NOT duplicated.
[[input]]
name        = "input_encoding"
label       = "Interpret input as"
source      = "field"

[[input]]
name        = "output_format"
label       = "Output format"
source      = "field"

[[input]]
name        = "uppercase"
label       = "Uppercase hex"
source      = "field"

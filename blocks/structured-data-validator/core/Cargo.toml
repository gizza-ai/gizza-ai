[package]
name = "gizza-ai-structured-data-validator-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# scraper: html5ever-based HTML parsing (wasm32-safe, same engine html-table-extractor uses).
scraper = "0.20"
# ego-tree backs scraper's DOM; we name NodeId to attribute properties to their owning item.
ego-tree = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# scraper pulls ahash/getrandom 0.3 in the wasm32-unknown-unknown web build;
# enable the JS backend so wasm-pack can compile the standalone page.
getrandom = { version = "0.3", features = ["wasm_js"] }

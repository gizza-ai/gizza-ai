[package]
name = "gizza-ai-gpx-to-geojson-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# quick-xml: pure-Rust, wasm-safe streaming XML reader (proven in gpx-analyzer,
# xml-to-json, epub-to-markdown). default-features=false drops the optional
# async/encoding bits.
quick-xml = { version = "0.40", default-features = false }
# preserve_order keeps GeoJSON property keys in the order we insert them
# (name, cmt, desc, ... then coordTimes) instead of alphabetized.
serde_json = { version = "1", features = ["preserve_order"] }

[package]
name = "gizza-ai-image-text-overlay-contrast-checker-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# image: pure-Rust decode of the common web formats (the PNG encoder is only
# pulled in by the unit tests, which build their own fixtures).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
serde = { version = "1", features = ["derive"] }
# Colour parsing + the WCAG relative-luminance / contrast-ratio maths are shared
# with the plain two-colour checker so both tools agree to the last decimal.
gizza-ai-color-contrast-checker-core = { path = "../../color-contrast-checker/core" }

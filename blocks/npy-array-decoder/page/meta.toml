slug          = "npy-array-decoder"
title         = "NPY Array Decoder — Read a NumPy .npy File Online"
description   = "Decode a NumPy .npy file in your browser: read its dtype, shape and byte layout, and export the array values as JSON or CSV. No Python, no NumPy, no upload."
tags          = ["npy", "npy decoder", "npy viewer", "numpy", "read npy file", "npy to csv", "npy to json", "numpy array viewer", "npy file format", "dtype and shape"]
h1            = "NPY Array Decoder"
hero_subtitle = "Paste a NumPy .npy file as base64 or hex and read its dtype, shape, order and byte layout — then export the values as JSON or CSV. Versions 1.0, 2.0 and 3.0; integers, floats, bools, complex and fixed-width text; C and Fortran order. Runs entirely in your browser, no upload, no sign-up."
wasm          = "gizza_ai_npy_array_decoder_web"
export        = "run"
live          = false
output_label  = "Decoded array"
format        = "text"

[[input]]
name        = "input"
label       = ".npy file bytes (base64 or hex)"
placeholder = "k05VTVBZAQB2AHsnZGVzY3InOiAnPGY4JywgJ2ZvcnRyYW5fb3JkZXInOiBGYWxzZSwgJ3NoYXBlJzogKDIsIDMpLCB9ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIAoAAAAAAADwPwAAAAAAAABAAAAAAAAADEAAAAAAAAAQQAAAAAAAABRAAAAAAAAAGEA="
source      = "field"
multiline   = true

# input_format/output render as <select> — the option lists come from the
# descriptor schema (manifest.json), so they are not duplicated here.
[[input]]
name        = "input_format"
label       = "Input encoding"
source      = "field"

[[input]]
name        = "output"
label       = "Output"
source      = "field"

[[input]]
name        = "limit"
label       = "Max values rendered"
placeholder = "1000"
source      = "field"

[[input]]
name        = "delimiter"
label       = "CSV delimiter (or \"tab\")"
placeholder = ","
source      = "field"

# Preset chips — one click prefills the fields with a runnable example.
[[example]]
label = "2x3 float64 array"
[example.values]
input        = "k05VTVBZAQB2AHsnZGVzY3InOiAnPGY4JywgJ2ZvcnRyYW5fb3JkZXInOiBGYWxzZSwgJ3NoYXBlJzogKDIsIDMpLCB9ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIAoAAAAAAADwPwAAAAAAAABAAAAAAAAADEAAAAAAAAAQQAAAAAAAABRAAAAAAAAAGEA="
input_format = "auto"
output       = "summary"

[[example]]
label = "Same array as CSV"
[example.values]
input        = "k05VTVBZAQB2AHsnZGVzY3InOiAnPGY4JywgJ2ZvcnRyYW5fb3JkZXInOiBGYWxzZSwgJ3NoYXBlJzogKDIsIDMpLCB9ICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIAoAAAAAAADwPwAAAAAAAABAAAAAAAAADEAAAAAAAAAQQAAAAAAAABRAAAAAAAAAGEA="
input_format = "auto"
output       = "csv"
delimiter    = ","

[[example]]
label = "uint8 vector from hex (header only)"
[example.values]
input        = "934e554d5059010076007b276465736372273a20277c7531272c2027666f727472616e5f6f72646572273a2046616c73652c20277368617065273a2028342c292c207d2020202020202020202020202020202020202020202020202020202020202020202020202020202020202020202020202020202020202020202020200a0a141e28"
input_format = "hex"
output       = "header"

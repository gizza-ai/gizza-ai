[workspace]
resolver = "2"
members = ["."]

[package]
name = "gizza-ai-clock-block"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wafer-sdk = { path = "../../../wafer-run/sdks/rust" }
wafer-block = { path = "../../../wafer-run/crates/wafer-block" }
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock"] }
serde_json = "1"

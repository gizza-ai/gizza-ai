tags          = ["seconds to hms", "duration converter", "hh:mm:ss", "time converter", "iso 8601 duration", "video timestamp"]
h1            = "Seconds to HH:MM:SS"
hero_subtitle = "Convert raw seconds into clock, day-clock, ISO-8601, or words format with optional fractional-second precision."

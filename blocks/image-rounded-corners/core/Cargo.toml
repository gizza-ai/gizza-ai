[package]
name = "gizza-ai-image-rounded-corners-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# image: pure-Rust decode/encode. PNG output keeps the rounded-corner alpha mask.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

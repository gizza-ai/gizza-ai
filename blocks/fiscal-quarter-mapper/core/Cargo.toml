[package]
name = "gizza-ai-fiscal-quarter-mapper-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
csv = "1"
# chrono for calendar arithmetic only; alloc-only — every date comes from the
# parsed cell, never from the host clock, so the core stays pure and portable.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

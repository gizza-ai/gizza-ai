slug          = "audio-resampler"
title         = "Resample Audio Online"
description   = "Change any audio file's sample rate — 8 kHz voice to 192 kHz studio — with high-quality ffmpeg resampling, right in your browser. Runs locally, nothing is uploaded, free."
tags          = ["audio", "resample", "sample-rate", "hz", "44100", "48000", "16000", "ffmpeg"]
h1            = "Resample an Audio File"
hero_subtitle = "Pick an audio file and a target sample rate — it's resampled in your browser, nothing is uploaded."
wasm          = "gizza_ai_audio_resampler_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Resampled audio"
format        = "audio"

[[input]]
name   = "audio"
source = "file"
accept = "audio/*"
label  = "Audio"

[[input]]
name        = "rate"
source      = "field"
label       = "Target sample rate (Hz)"
placeholder = "44100"

[[input]]
name   = "format"
source = "field"
label  = "Output format"

[input.labels]
wav  = "WAV — lossless default"
flac = "FLAC — lossless compressed"
mp3  = "MP3 — 192 kbps"
ogg  = "OGG Vorbis — 192 kbps"
m4a  = "M4A/AAC — 192 kbps"

[[example]]
label  = "16 kHz speech WAV"
params = { rate = "16000", format = "wav" }

[[example]]
label  = "44.1 kHz music FLAC"
params = { rate = "44100", format = "flac" }

[[example]]
label  = "48 kHz video M4A"
params = { rate = "48000", format = "m4a" }

[[example]]
label  = "8 kHz tiny MP3"
params = { rate = "8000", format = "mp3" }

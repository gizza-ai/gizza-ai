slug          = "dna-reverse-complement"
title         = "DNA Reverse Complement"
description   = "Reverse-complement DNA or RNA in your browser — full IUPAC ambiguity codes, FASTA records, preserved case, complement-only and reverse-only modes. No upload."
tags          = ["reverse complement", "dna reverse complement", "rna reverse complement", "complement dna", "iupac", "ambiguity codes", "fasta", "bioinformatics", "reverse strand", "molecular biology"]
h1            = "DNA / RNA Reverse Complement"
hero_subtitle = "Paste a DNA or RNA sequence and get the reverse complement instantly — full IUPAC ambiguity support, FASTA-aware, case preserved. Runs entirely in your browser, nothing is uploaded."
wasm          = "gizza_ai_dna_reverse_complement_web"
export        = "run"
live          = false
output_label  = "Result sequence"
format        = "text"

# Field ORDER must match the web `run()` parameter order. operation /
# output_alphabet / on_invalid render as <select> and the two flags as
# checkboxes — control types come from the descriptor's schema (manifest.json),
# so labels stay short here and the option lists are NOT duplicated.
[[input]]
name        = "sequence"
label       = "DNA or RNA sequence"
placeholder = ">seq1 example\nATGGCCATTGTAATGGGCCGC"
source      = "field"
multiline   = true

[[input]]
name        = "operation"
label       = "Operation"
source      = "field"

[input.labels]
reverse_complement = "Reverse complement — opposite strand, 5'→3'"
complement = "Complement only — no reversing"
reverse = "Reverse only — no complementing"

[[input]]
name        = "output_alphabet"
label       = "Output alphabet"
source      = "field"

[input.labels]
auto = "Auto — keep DNA as DNA, RNA as RNA"
dna = "DNA — write U as T"
rna = "RNA — write T as U"

[[input]]
name        = "preserve_case"
label       = "Preserve upper/lower case"
source      = "field"

[[input]]
name        = "line_width"
label       = "Wrap width (chars/line, 0 = one line)"
placeholder = "0"
source      = "field"

[[input]]
name        = "on_invalid"
label       = "Unrecognised characters"
source      = "field"

[input.labels]
error = "Report an error"
drop = "Remove them"
keep = "Pass them through"

[[input]]
name        = "show_stats"
label       = "Append length / GC summary"
source      = "field"

[[example]]
label = "Reverse complement"
[example.params]
sequence = "ATGGCCATTGTAATGGGCCGC"

[[example]]
label = "IUPAC ambiguity codes"
[example.params]
sequence = "ACGTRYSWKMBDHVN"

[[example]]
label = "FASTA, wrapped at 10"
[example.params]
sequence = ">seq1 forward primer\nATGGCCATTGTAATGGGCCGC\n>seq2\nTTACGGATCC"
line_width = "10"

[[example]]
label = "RNA → DNA"
[example.params]
sequence = "AUGGCCAUUGUAAUGGGCCGC"
output_alphabet = "dna"

[[example]]
label = "Complement only"
[example.params]
sequence = "ATGGCCATTGTAATGGGCCGC"
operation = "complement"

[[example]]
label = "Numbered paste + stats"
[example.params]
sequence = "1 atggccatt 10 gtaatgggc"
on_invalid = "drop"
show_stats = "true"

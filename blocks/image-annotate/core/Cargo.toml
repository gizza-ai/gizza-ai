[package]
name = "gizza-ai-image-annotate-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# fontdue: pure-Rust TrueType rasterizer (no freetype / system fonts) — same font
# stack as add-text-to-image/code-screenshot. image: pure-Rust decode/encode with
# only the common web codecs enabled (smaller wasm). serde/serde_json: parse the
# JSON `annotations` list into typed marks.
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

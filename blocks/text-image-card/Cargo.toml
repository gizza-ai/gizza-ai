[workspace]
resolver = "2"
members = [".", "core"]

[package]
name = "gizza-ai-text-image-card-block"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wafer-sdk = { git = "https://github.com/wafer-run/wafer-run", rev = "f0ca9c79abbefb4647cc73d15b92bbcd4043e03b" }
wafer-block = { git = "https://github.com/wafer-run/wafer-run", rev = "f0ca9c79abbefb4647cc73d15b92bbcd4043e03b" }
gizza-ai-text-image-card-core = { path = "core" }
gizza-ai-block-utils = { path = "../../block-utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

slug          = "video-audio-sync-offset"
title         = "Fix Video Audio Sync Offset Online"
description   = "Shift a video's audio earlier or later to fix lip-sync in your browser. Positive delays, negative advances; the picture is untouched. Nothing is uploaded."
tags          = ["audio video sync", "lip sync", "fix out of sync audio", "delay audio", "audio offset", "ffmpeg"]
h1            = "Fix Video Audio Sync"
hero_subtitle = "Pick a video and a shift — its audio is nudged earlier or later in your browser while the picture stays untouched. Nothing is uploaded."
wasm          = "gizza_ai_video_audio_sync_offset_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Synced video"
format        = "video"

[[input]]
name   = "file"
source = "file"
accept = "video/*"
label  = "Video"

[[input]]
name        = "offset"
source      = "field"
label       = "Offset (+ delays audio, − advances it)"
placeholder = "200"

[[input]]
name   = "unit"
source = "field"
label  = "Unit"

[input.labels]
ms      = "Milliseconds (ms)"
seconds = "Seconds (s)"

[[example]]
label  = "Delay audio 200 ms"
params = { offset = "200", unit = "ms" }

[[example]]
label  = "Advance audio 200 ms"
params = { offset = "-200", unit = "ms" }

[[example]]
label  = "Bluetooth mic (−200 ms)"
params = { offset = "-200", unit = "ms" }

[[example]]
label  = "Delay audio 0.5 s"
params = { offset = "0.5", unit = "seconds" }

slug          = "csv-to-yaml"
title         = "CSV to YAML — Convert CSV to a YAML list"
description   = "Convert a CSV table into a YAML list of objects keyed by the header row, in your browser. Free, private, no upload."
tags          = ["csv to yaml", "csv yaml converter", "yaml list", "tabular to yaml", "convert csv"]
h1            = "CSV to YAML"
hero_subtitle = "Convert a CSV table into a YAML list of objects keyed by the header row. Runs entirely in your browser, no upload."
wasm          = "gizza_ai_csv_to_yaml_web"
export        = "run"
live          = false
output_label  = "YAML"
format        = "text"

[[input]]
name        = "data"
label       = "CSV"
placeholder = "name,age\nAda,36\nBo,40"
source      = "field"
multiline   = true

[[input]]
name        = "header"
label       = "First row is a header"
source      = "field"

[[input]]
name        = "infer_types"
label       = "Infer numbers/booleans/null"
source      = "field"

[[input]]
name        = "delimiter"
label       = "Delimiter (, tab ; |)"
placeholder = ","
source      = "field"

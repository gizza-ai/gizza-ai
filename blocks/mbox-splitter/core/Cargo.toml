[package]
name = "gizza-ai-mbox-splitter-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# mail-parser: pure-Rust RFC 5322/2045 parser (wasm-safe); used only to decode
# subject/date/message-id for the suggested filenames — message bytes themselves
# are sliced verbatim, never re-serialized.
mail-parser = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

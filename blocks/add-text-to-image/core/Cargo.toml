[package]
name = "gizza-ai-add-text-to-image-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# fontdue: pure-Rust TrueType rasterizer (no freetype / system fonts) — same as
# code-screenshot. image: pure-Rust decode/encode; default-features off to drop
# codecs we don't need (keeps the wasm smaller), enabling the common web formats.
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

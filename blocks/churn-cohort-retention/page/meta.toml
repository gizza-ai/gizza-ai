slug          = "churn-cohort-retention"
title         = "Churn Cohort Retention — Cohort Tables from Signup and Activity CSV"
description   = "Build monthly, weekly, or daily cohort retention and churn tables from signup and activity CSV data, with weighted averages and export formats."
tags          = ["cohort retention", "churn analysis", "retention table", "cohort analysis", "product analytics", "signup cohorts", "activity events", "retention curve"]
h1            = "Churn cohort retention"
hero_subtitle = "Paste signup and activity data, group users into cohorts, and see retention or period-over-period churn by month, week, or day. The tool builds the grid, weighted average row, and text curve locally in your browser."
wasm          = "gizza_ai_churn_cohort_retention_web"
export        = "run"
live          = false
output_label  = "Cohort table"
format        = "text"
wide          = true

[[input]]
name        = "data"
label       = "Activity events CSV"
placeholder = "user,date\nu1,2024-01-05\nu1,2024-02-03\nu2,2024-01-20\nu2,2024-03-02\nu3,2024-02-10"
source      = "field"
multiline   = true

[[input]]
name        = "signups"
label       = "Signup/users CSV (optional)"
placeholder = "user,signup_date\nu1,2024-01-01\nu2,2024-01-15\nu3,2024-02-01"
source      = "field"
multiline   = true

[[input]]
name        = "user"
label       = "User id column"
placeholder = "user"
source      = "field"

[[input]]
name        = "date"
label       = "Activity date column"
placeholder = "date"
source      = "field"

[[input]]
name        = "signup_date"
label       = "Signup date column"
placeholder = "signup_date"
source      = "field"

[[input]]
name   = "granularity"
label  = "Cohort period"
source = "field"

[input.labels]
month = "Monthly cohorts"
week  = "Weekly cohorts (Monday start)"
day   = "Daily cohorts"

[[input]]
name        = "periods"
label       = "Follow-up periods"
placeholder = "6"
source      = "field"
kind        = "slider"
min         = "1"
max         = "36"
step        = "1"

[[input]]
name   = "metric"
label  = "Metric"
source = "field"

[input.labels]
retention = "Retention: active users ÷ cohort size"
churn     = "Churn: users lost since previous period"

[[input]]
name   = "values"
label  = "Cell values"
source = "field"

[input.labels]
percent = "Percent"
count   = "Counts"
both    = "Counts and percent"

[[input]]
name        = "as_of"
label       = "Analysis date (optional)"
placeholder = "2024-06-30"
source      = "field"
kind        = "date"

[[input]]
name   = "header"
label  = "First row contains headers"
source = "field"

[[input]]
name   = "delimiter"
label  = "Delimiter"
source = "field"

[input.labels]
comma     = "Comma"
tab       = "Tab"
semicolon = "Semicolon"
pipe      = "Pipe"

[[input]]
name   = "format"
label  = "Output"
source = "field"

[input.labels]
table = "Readable table"
csv   = "CSV grid"
json  = "Structured JSON"

[[example]]
label  = "Monthly retention from events"
params = { data = "user,date\nu1,2024-01-05\nu1,2024-02-03\nu1,2024-03-01\nu2,2024-01-20\nu2,2024-03-02\nu3,2024-02-10\nu3,2024-03-11", signups = "", user = "user", date = "date", signup_date = "signup_date", granularity = "month", periods = "3", metric = "retention", values = "both", as_of = "2024-04-01", header = "true", delimiter = "comma", format = "table" }

[[example]]
label  = "Signup table, churn view"
params = { data = "user,date\nu1,2024-01-05\nu1,2024-02-03\nu2,2024-01-20\nu3,2024-02-10", signups = "user,signup_date\nu1,2024-01-01\nu2,2024-01-15\nu3,2024-01-18", user = "user", date = "date", signup_date = "signup_date", granularity = "month", periods = "2", metric = "churn", values = "percent", as_of = "2024-03-01", header = "true", delimiter = "comma", format = "table" }

[[example]]
label  = "Weekly cohorts as JSON"
params = { data = "user|date\nu1|2024-01-01\nu1|2024-01-08\nu2|2024-01-02\nu2|2024-01-15\nu3|2024-01-09", signups = "", user = "user", date = "date", signup_date = "signup_date", granularity = "week", periods = "3", metric = "retention", values = "percent", as_of = "2024-01-29", header = "true", delimiter = "pipe", format = "json" }

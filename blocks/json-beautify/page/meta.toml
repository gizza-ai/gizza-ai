slug          = "json-beautify"
title         = "JSON Beautifier — pretty-print & validate JSON"
description   = "Pretty-print minified or messy JSON with configurable indentation (or minify it), validating it in the process. Runs in your browser; nothing is uploaded."
tags          = ["json beautifier", "json formatter", "pretty print json", "validate json", "minify json", "format json"]
h1            = "JSON Beautifier"
hero_subtitle = "Pretty-print messy or minified JSON with the indentation you choose — or set indent 0 to minify. Invalid JSON is reported with the exact spot. Runs in your browser; nothing is uploaded."
wasm          = "gizza_ai_json_beautify_web"
export        = "run"
live          = false
output_label  = "Formatted JSON"
format        = "text"

[[input]]
name        = "json"
label       = "JSON"
placeholder = "{\"name\":\"gizza\",\"tags\":[\"fast\",\"local\"]}"
source      = "field"
multiline   = true

[[input]]
name        = "indent"
label       = "Indent (spaces; 0 = minify)"
placeholder = "2"
source      = "field"

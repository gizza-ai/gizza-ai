slug          = "vcard-to-json"
title         = "vCard to JSON — Convert .vcf Contacts Online"
description   = "Convert vCard (.vcf) contact cards to a clean JSON array. Parses vCard 2.1/3.0/4.0, splits names and addresses, keeps phone/email types. Runs in your browser."
tags          = ["vcard to json", "vcf to json", "vcard parser", "vcf converter", "contacts to json", "parse vcard", "vcard 4.0"]
h1            = "vCard to JSON"
hero_subtitle = "Turn exported .vcf contact cards into a clean JSON array — vCard 2.1, 3.0, and 4.0, with structured names and addresses and typed phones/emails. Runs entirely in your browser, no upload."
wasm          = "gizza_ai_vcard_to_json_web"
export        = "run"
live          = false
output_label  = "JSON"
format        = "text"

[[input]]
name        = "data"
label       = "vCard (.vcf) text"
placeholder = "BEGIN:VCARD\nVERSION:3.0\nFN:John Doe\nN:Doe;John;;Mr.;\nEMAIL;TYPE=work:john@example.com\nTEL;TYPE=CELL:+15551234567\nEND:VCARD"
source      = "field"
multiline   = true

# structured/pretty render as checkboxes and wrap as a <select> — the control
# type + options are derived from the descriptor schema (manifest.json).
[[input]]
name        = "structured"
label       = "Split Name and Address into fields"
source      = "field"

[[input]]
name        = "wrap"
label       = "Output shape"
source      = "field"

[[input]]
name        = "pretty"
label       = "Pretty-print (indent) the JSON"
source      = "field"

[[example]]
label = "Single contact → array"
[example.params]
data       = "BEGIN:VCARD\nVERSION:3.0\nFN:John Doe\nN:Doe;John;;Mr.;\nEMAIL;TYPE=work:john@example.com\nTEL;TYPE=CELL:+15551234567\nEND:VCARD"
pretty     = "true"

[[example]]
label = "Two contacts → {contacts, count}"
[example.params]
data       = "BEGIN:VCARD\nVERSION:4.0\nFN:Ada Lovelace\nEND:VCARD\nBEGIN:VCARD\nVERSION:4.0\nFN:Alan Turing\nEND:VCARD"
wrap       = "object"
pretty     = "true"

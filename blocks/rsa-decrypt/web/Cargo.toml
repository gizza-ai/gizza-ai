[package]
name = "gizza-ai-rsa-decrypt-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
gizza-ai-rsa-decrypt-core = { path = "../core" }
# rsa's rand_core/getrandom dependency needs the JS backend on wasm32-unknown-unknown.
getrandom = { version = "0.2", features = ["js"] }

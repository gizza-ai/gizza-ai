slug          = "video-stabilize"
title         = "Stabilize a Shaky Video Online"
description   = "Smooth out camera shake in a handheld video in your browser — pick a strength and how to handle the edges. Local ffmpeg stabilization, nothing uploaded."
tags          = ["video", "stabilize", "stabilizer", "camera shake", "deshake", "shaky footage", "handheld", "smooth", "action cam"]
h1            = "Stabilize a Shaky Video"
hero_subtitle = "Pick a video and a strength — handheld camera shake is smoothed away in your browser, nothing is uploaded."
wasm          = "gizza_ai_video_stabilize_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Stabilized video"
format        = "video"

[[input]]
name   = "file"
source = "file"
accept = "video/*"
label  = "Video"

[[input]]
name   = "borders"
source = "field"
label  = "Edges"

[input.labels]
mirror   = "Mirror — reflect the picture into the edges (no zoom, default)"
crop     = "Crop & zoom — zoom in slightly to hide moving edges"
blank    = "Blank — black bands at the edges"
original = "Original — keep the unstabilized edge pixels"

[[input]]
name        = "strength"
source      = "field"
label       = "Strength (1-100)"
placeholder = "25"
kind        = "slider"
step        = "1"

[[example]]
label  = "Subtle (light shake, 15)"
params = { borders = "mirror", strength = "15" }

[[example]]
label  = "Normal handheld (30)"
params = { borders = "mirror", strength = "30" }

[[example]]
label  = "Strong + crop & zoom (60)"
params = { borders = "crop", strength = "60" }

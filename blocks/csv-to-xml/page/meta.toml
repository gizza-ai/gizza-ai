slug          = "csv-to-xml"
title         = "CSV to XML — Convert CSV to XML records"
description   = "Convert a CSV table into XML records using the header names as element tags, in your browser. Free, private, no upload."
tags          = ["csv to xml", "csv xml converter", "convert csv", "xml records", "tabular to xml"]
h1            = "CSV to XML"
hero_subtitle = "Convert a CSV table into XML records, with header names as element tags. Runs entirely in your browser, no upload."
wasm          = "gizza_ai_csv_to_xml_web"
export        = "run"
live          = false
output_label  = "XML"
format        = "text"

[[input]]
name        = "data"
label       = "CSV"
placeholder = "name,age\nAda,36\nBo,40"
source      = "field"
multiline   = true

[[input]]
name        = "root"
label       = "Root tag"
placeholder = "rows"
source      = "field"

[[input]]
name        = "row"
label       = "Record tag"
placeholder = "row"
source      = "field"

[[input]]
name        = "header"
label       = "First row is a header"
source      = "field"

[[input]]
name        = "delimiter"
label       = "Delimiter (, tab ; |)"
placeholder = ","
source      = "field"

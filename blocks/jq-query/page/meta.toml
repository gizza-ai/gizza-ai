slug          = "jq-query"
title         = "Run jq on JSON Online — gizza.ai"
description   = "Run a jq program against any JSON document right in your browser — filter, map, select, reshape. Pure-Rust jq (jaq), nothing is uploaded, free."
tags          = ["jq", "json query", "jq online", "json filter", "jq playground", "transform json"]
h1            = "Run jq on JSON"
hero_subtitle = "Type a jq filter and a JSON document — see the transformed output instantly. Runs entirely in your browser, no upload, no sign-up."
wasm          = "gizza_ai_jq_query_web"
export        = "run"
live          = false
output_label  = "Output"
format        = "text"

[[input]]
name        = "query"
label       = "jq filter"
placeholder = ".users | map(.name)"
source      = "field"

[[input]]
name        = "json"
label       = "JSON input"
placeholder = "{ \"users\": [ { \"name\": \"Ada\" } ] }"
source      = "field"
multiline   = true

[[input]]
name        = "pretty"
label       = "Pretty-print output"
source      = "field"

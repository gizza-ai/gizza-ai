slug          = "json-to-typescript"
title         = "JSON to TypeScript Interfaces"
description   = "Paste JSON and get TypeScript interfaces — nested types, optional fields, and unions inferred automatically. Runs in your browser, nothing is uploaded, free."
tags          = ["json to typescript", "ts interfaces", "json to ts", "type generator", "infer types"]
h1            = "JSON to TypeScript"
hero_subtitle = "Paste a JSON sample and get clean TypeScript interfaces — nested objects, optional fields, and unions inferred. Runs entirely in your browser, no upload."
wasm          = "gizza_ai_json_to_typescript_web"
export        = "run"
live          = false
output_label  = "TypeScript"
format        = "text"

[[input]]
name        = "json"
label       = "JSON"
placeholder = "{ \"name\": \"Ada\", \"roles\": [\"admin\"] }"
source      = "field"
multiline   = true

[[input]]
name        = "root_name"
label       = "Root type name"
placeholder = "Root"
source      = "field"

[[input]]
name        = "export"
label       = "Add 'export'"
source      = "field"

[package]
name = "gizza-ai-docx-text-extract-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# A DOCX is a ZIP of WordprocessingML XML. Both crates instantiate under
# `wafer build` (wasm32-wasip1): zip with deflate only, quick-xml pull-parser.
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.40", default-features = false }

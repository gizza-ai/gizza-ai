slug          = "roc-auc-calculator"
title         = "ROC AUC Calculator — Area Under the Curve, DeLong CI and Optimal Cutoff"
description   = "Paste scores and class labels to get the ROC AUC with a DeLong confidence interval, the optimal cutoff by Youden's J or F1, and a threshold table."
tags          = ["roc auc calculator", "auc calculator", "roc curve", "area under the curve", "youden index", "optimal cutoff", "sensitivity specificity", "delong confidence interval", "binary classifier metrics", "threshold table"]
h1            = "ROC AUC calculator"
hero_subtitle = "Paste one score and class label per observation and get the area under the ROC curve with a DeLong confidence interval, a z-test against chance, the best cutoff by Youden's J, F1, accuracy or cost, and every operating-point metric at it. Runs entirely in your browser, nothing is uploaded."
wasm          = "gizza_ai_roc_auc_calculator_web"
export        = "run"
live          = false
output_label  = "ROC / AUC report"
format        = "markdown"
wide          = true

[[input]]
name        = "data"
label       = "Scored observations (one score,label pair per line — or the scores column alone)"
placeholder = "score,label\n0.91,1\n0.83,0\n0.77,1\n0.60,0\n0.55,1\n0.41,0"
source      = "field"
multiline   = true

[[input]]
name        = "labels"
label       = "Class labels (optional second column, one per score, in the same order)"
placeholder = "1\n0\n1\n0\n1\n0"
source      = "field"
multiline   = true

[[input]]
name   = "input_format"
label  = "Input shape"
source = "field"

[input.labels]
auto    = "Auto — pairs, or two columns when the labels field is filled"
pairs   = "Pairs — score and label on the same row"
columns = "Two columns — scores here, labels in the field above"

[[input]]
name   = "column_order"
label  = "Column order (pairs only)"
source = "field"

[input.labels]
auto        = "Auto — detect which column is the score"
score_label = "Score first, then label"
label_score = "Label first, then score"

[[input]]
name   = "separator"
label  = "Field separator"
source = "field"

[input.labels]
auto      = "Auto — detect comma, tab, semicolon, pipe or spaces"
comma     = "Comma (CSV)"
tab       = "Tab (spreadsheet paste)"
semicolon = "Semicolon"
pipe      = "Pipe"
space     = "Spaces"
newline   = "One value per line (two-column shape only)"

[[input]]
name   = "header"
label  = "First row is a header"
source = "field"

[input.labels]
auto = "Auto — drop a non-numeric first row"
yes  = "Yes — always drop row 1"
no   = "No — row 1 is data"

[[input]]
name        = "positive_label"
label       = "Positive class label (optional — the event being detected)"
placeholder = "1"
source      = "field"

[[input]]
name   = "optimize"
label  = "Pick the cutoff by"
source = "field"

[input.labels]
youden   = "Youden's J — max (sensitivity + specificity - 1)"
f1       = "F1 score — best for rare positives"
closest  = "Closest to the perfect top-left corner"
accuracy = "Accuracy — max overall hit rate"
cost     = "Minimum cost — uses the cost ratio below"

[[input]]
name        = "cost_ratio"
label       = "Cost of a false negative relative to a false positive (cost criterion only)"
placeholder = "1"
source      = "field"

[[input]]
name        = "threshold"
label       = "Also report your own cutoff (optional, same scale as the scores)"
placeholder = "0.5"
source      = "field"

[[input]]
name   = "confidence_level"
label  = "Confidence level for the AUC interval"
source = "field"

[input.labels]
90 = "90%"
95 = "95%"
99 = "99%"

[[input]]
name        = "table_rows"
label       = "Threshold table rows (0 hides the table)"
placeholder = "12"
source      = "field"
kind        = "slider"
step        = "1"

[[input]]
name   = "plot"
label  = "Draw the ASCII ROC curve"
source = "field"

[[input]]
name        = "decimals"
label       = "Decimal places"
placeholder = "4"
source      = "field"
kind        = "slider"
step        = "1"

[[input]]
name   = "percent"
label  = "Show rates as percentages"
source = "field"

[[input]]
name   = "format"
label  = "Output"
source = "field"

[input.labels]
markdown = "Markdown tables"
text     = "Aligned plain text"
csv      = "CSV (spreadsheet)"
json     = "JSON (full result)"

[[example]]
label  = "Fraud scores (score,label pairs)"
params = { data = "score,label\n0.97,1\n0.91,1\n0.88,0\n0.83,1\n0.77,0\n0.71,1\n0.66,0\n0.58,1\n0.49,0\n0.41,0\n0.33,1\n0.22,0\n0.14,0\n0.08,0", optimize = "youden", format = "markdown", decimals = "4" }

[[example]]
label  = "Screening test, case/control labels in two columns"
params = { data = "12.4\n9.8\n15.1\n7.2\n11.9\n6.5\n13.7\n8.1", labels = "case\ncontrol\ncase\ncontrol\ncase\ncontrol\ncase\ncontrol", input_format = "columns", separator = "newline", positive_label = "case", format = "text" }

[[example]]
label  = "Rare positives: optimize F1, rates as percentages"
params = { data = "0.99,1\n0.95,0\n0.93,1\n0.90,0\n0.86,0\n0.81,0\n0.75,1\n0.68,0\n0.60,0\n0.52,0\n0.44,0\n0.31,0", optimize = "f1", percent = "true", decimals = "2", format = "markdown" }

[[example]]
label  = "Check a 0.5 cutoff, export JSON"
params = { data = "0.91,1\n0.83,0\n0.77,1\n0.60,0\n0.55,1\n0.41,0\n0.22,1\n0.10,0", threshold = "0.5", format = "json", plot = "false", table_rows = "0", decimals = "4" }

slug          = "dotenv-to-shell"
title         = "Dotenv to Shell — Convert .env to export Statements Online"
description   = "Turn a .env file into export-prefixed shell statements (posix, bash, fish) — and back — with safe quoting for spaces, $, backticks and quotes. Runs in your browser."
tags          = [".env to export", "dotenv to shell", "env to bash", "source .env", "export env vars", "shell quoting", "env to fish", "convert env file"]
h1            = "Dotenv to Shell"
hero_subtitle = "Paste a .env file to convert it into export-prefixed shell statements you can source — with safe quoting for spaces, $, backticks and quotes — or reverse shell exports back into a .env. Supports posix/bash and fish. Runs entirely in your browser; nothing is uploaded."
wasm          = "gizza_ai_dotenv_to_shell_web"
export        = "run"
live          = false
output_label  = "Result"
format        = "text"

[[input]]
name        = "input"
label       = "Input (.env file, or shell statements when reversing)"
placeholder = "# database\nexport DB_HOST=localhost\nDB_PORT=5432\nGREETING=hello world\nAPI_TOKEN=s3cr3t$val"
source      = "field"
multiline   = true

[[input]]
name   = "direction"
label  = "Direction"
source = "field"
[input.labels]
"to-shell" = ".env → shell (export statements)"
"to-env"   = "shell → .env (reverse)"

[[input]]
name   = "shell"
label  = "Shell dialect (for .env → shell)"
source = "field"
[input.labels]
posix = "posix / sh / zsh — export KEY=value"
bash  = "bash — export KEY=value"
fish  = "fish — set -gx KEY value"

[[input]]
name   = "quote"
label  = "Quoting (for .env → shell)"
source = "field"
[input.labels]
auto   = "Auto — quote only when needed"
single = "Single — always single-quote"

[[example]]
label = "→ export (posix)"
[example.params]
input     = "# database\nexport DB_HOST=localhost\nDB_PORT=5432\nGREETING=hello world\nAPI_TOKEN=s3cr3t$val"
direction = "to-shell"
shell     = "posix"
quote     = "auto"

[[example]]
label = "→ fish"
[example.params]
input     = "GREETING=hello world\nMSG=it's fine"
direction = "to-shell"
shell     = "fish"
quote     = "auto"

[[example]]
label = "Reverse → .env"
[example.params]
input     = "export DB_HOST=localhost\nexport GREETING='hello world'"
direction = "to-env"

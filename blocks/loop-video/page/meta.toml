slug          = "loop-video"
title         = "Loop a Video Online"
description   = "Loop a video or GIF into one continuous file — repeat it N times or fill a target duration, free and in your browser with nothing uploaded."
tags          = ["loop video", "repeat video", "loop gif", "video loop", "repeat clip"]
h1            = "Loop a Video"
hero_subtitle = "Pick a video or GIF and repeat it N times or to a target length — looped in your browser, nothing is uploaded."
wasm          = "gizza_ai_loop_video_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Looped video"
format        = "video"

[[input]]
name   = "file"
source = "file"
accept = "video/*"
label  = "Video or GIF"

[[input]]
name        = "count"
source      = "field"
label       = "Repeat count (total plays, e.g. 3)"
placeholder = "2"

[[input]]
name        = "duration"
source      = "field"
label       = "Or loop to duration (seconds; overrides count)"
placeholder = "0"

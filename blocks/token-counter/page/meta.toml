slug          = "token-counter"
title         = "LLM Token Counter — Count Tokens & Estimate Cost"
description   = "Paste text to count LLM tokens with real tiktoken BPE, then estimate the prompt cost and context-window usage for GPT, Claude, and Gemini. Free, private, in-browser."
tags          = ["token counter", "llm tokens", "tiktoken", "openai tokenizer", "gpt token count", "claude tokens", "gemini tokens", "prompt cost", "context window", "o200k", "cl100k"]
h1            = "LLM Token Counter & Cost Estimator"
hero_subtitle = "Paste any text to count its tokens with real tiktoken BPE, then see the estimated prompt cost and context-window usage for GPT, Claude, or Gemini. Runs entirely in your browser — no text is uploaded."
wasm          = "gizza_ai_token_counter_web"
export        = "run"
live          = false
output_label  = "Token count & cost"
format        = "text"

[[input]]
name        = "text"
label       = "Text to tokenize"
placeholder = "Paste the prompt or document you want to count tokens for…"
source      = "field"
multiline   = true

[[input]]
name        = "model"
label       = "Model (tokenizer & pricing)"
source      = "field"
default     = "gpt-4o"

[input.labels]
"gpt-5.5"          = "GPT-5.5 (OpenAI, exact)"
"gpt-5"            = "GPT-5 (OpenAI, exact)"
"gpt-4.1"          = "GPT-4.1 (OpenAI, exact)"
"gpt-4.1-mini"     = "GPT-4.1 mini (OpenAI, exact)"
"gpt-4o"           = "GPT-4o (OpenAI, exact)"
"gpt-4o-mini"      = "GPT-4o mini (OpenAI, exact)"
"gpt-4-turbo"      = "GPT-4 Turbo (OpenAI, exact)"
"gpt-3.5-turbo"    = "GPT-3.5 Turbo (OpenAI, exact)"
"claude-opus-4.8"  = "Claude Opus 4.8 (Anthropic, approx)"
"claude-sonnet-5"  = "Claude Sonnet 5 (Anthropic, approx)"
"claude-haiku-4.5" = "Claude Haiku 4.5 (Anthropic, approx)"
"gemini-3-pro"     = "Gemini 3 Pro (Google, approx)"
"gemini-2.5-flash" = "Gemini 2.5 Flash (Google, approx)"

[[example]]
label = "GPT-4o prompt"
[example.params]
text = "The quick brown fox jumps over the lazy dog."
model = "gpt-4o"

[[example]]
label = "Claude Opus (approx)"
[example.params]
text = "Summarize the attached report in three bullet points."
model = "claude-opus-4.8"

[[example]]
label = "GPT-3.5 (cl100k)"
[example.params]
text = "Hello, world!"
model = "gpt-3.5-turbo"

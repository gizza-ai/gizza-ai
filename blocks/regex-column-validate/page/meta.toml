slug          = "regex-column-validate"
title         = "Regex Column Validate — Flag CSV Values That Fail a Pattern"
description   = "Validate one CSV column against a regex, with header or index selection, delimiter auto-detect, blank handling, inverted matching, and text or JSON reports."
tags          = ["csv regex validation", "column validation", "data quality", "regex", "invalid rows", "csv checker", "format validation"]
h1            = "Validate a CSV column with a regex"
hero_subtitle = "Paste CSV, choose a column, and flag values that do not match your required pattern — or invert the check to find forbidden values."
wasm          = "gizza_ai_regex_column_validate_web"
export        = "run"
live          = false
output_label  = "Validation report"
format        = "text"

[[input]]
name        = "data"
label       = "CSV data"
placeholder = "name,zip\nAda,12345\nBo,1234\nCy,90210"
source      = "field"
multiline   = true

[[input]]
name        = "column"
label       = "Column name or 0-based index"
placeholder = "zip"
source      = "field"

[[input]]
name        = "pattern"
label       = "Regex pattern"
placeholder = "\\d{5}"
source      = "field"

[[input]]
name   = "full_match"
label  = "Require full-cell match"
source = "field"

[[input]]
name   = "ignore_case"
label  = "Ignore case"
source = "field"

[[input]]
name   = "report"
label  = "Flag which values"
source = "field"

[input.labels]
non-matching = "Values that do not match"
matching     = "Values that match"

[[input]]
name   = "has_header"
label  = "First row is a header"
source = "field"

[[input]]
name   = "allow_blank"
label  = "Allow blank cells"
source = "field"

[[input]]
name   = "delimiter"
label  = "CSV delimiter"
source = "field"

[input.labels]
auto      = "Auto-detect"
comma     = "Comma ( , )"
tab       = "Tab"
semicolon = "Semicolon ( ; )"
pipe      = "Pipe ( | )"

[[input]]
name        = "max_issues"
label       = "Max issues to list"
placeholder = "50"
source      = "field"
kind        = "slider"
min         = "1"
max         = "1000"
step        = "1"

[[input]]
name   = "output"
label  = "Output format"
source = "field"

[input.labels]
text = "Text report"
json = "JSON object"

[[example]]
label = "ZIP codes"
[example.params]
data = "name,zip\nAda,12345\nBo,1234\nCy,90210"
column = "zip"
pattern = "\\d{5}"
full_match = "true"
ignore_case = "false"
report = "non-matching"
has_header = "true"
allow_blank = "true"
delimiter = "auto"
max_issues = "50"
output = "text"

[[example]]
label = "Find forbidden all-caps values"
[example.params]
data = "status\nok\nFORBIDDEN\nfine"
column = "status"
pattern = "[A-Z]+"
full_match = "true"
ignore_case = "false"
report = "matching"
has_header = "true"
allow_blank = "true"
delimiter = "auto"
max_issues = "50"
output = "json"

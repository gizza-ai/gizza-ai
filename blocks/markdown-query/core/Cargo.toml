[package]
name = "gizza-ai-markdown-query-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# pulldown-cmark: pure-Rust CommonMark + GFM parser (tables, fenced code with
# language, headings, inline/reference links & images), wasm32-safe — the same
# crate markdown-render / link-extractor use.
pulldown-cmark = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

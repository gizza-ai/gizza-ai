[package]
name = "gizza-ai-scan-to-pdf-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# Decode each phone photo, apply the scan enhancement (deskew, magic-color /
# grayscale / adaptive-threshold B&W), then embed each processed page into one
# lopdf-built PDF. All pure-Rust / wasm32-safe (same stack as images-to-pdf).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
lopdf = { version = "0.36", default-features = false }
flate2 = "1"

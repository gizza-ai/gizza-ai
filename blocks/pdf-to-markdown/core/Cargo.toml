[package]
name = "gizza-ai-pdf-to-markdown-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# default-features = false drops `rayon` (threads) + the date crates, keeping the
# dependency tree thread-free so it compiles to wasm32-wasip1 (the `wafer build`
# target). Only the read/parse path is exercised (no encryption/writing).
lopdf = { version = "=0.36.0", default-features = false }

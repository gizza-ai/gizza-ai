slug          = "t-test-calculator"
title         = "T-Test Calculator — One-Sample, Paired, Student & Welch with P-Value"
description   = "Run a one-sample, paired, pooled Student or Welch t-test on pasted data with t, df, exact p-value, critical t, confidence interval, Cohen's d and power."
tags          = ["t test", "t test calculator", "p value", "welch t test", "paired t test", "one sample t test", "cohens d", "confidence interval", "statistics"]
h1            = "T-test calculator for one, two, and paired samples"
hero_subtitle = "Paste one or two columns of observations, group rows, or published means and get the t statistic, degrees of freedom, exact p-value, critical t, confidence interval, effect size, and power locally in your browser."
wasm          = "gizza_ai_t_test_calculator_web"
export        = "run"
live          = false
output_label  = "T-test result"
format        = "text"

[[input]]
name        = "data"
label       = "Data"
placeholder = "12,10\n14,11\n11,10\n15,12\n13,12\n16,13"
source      = "field"
multiline   = true

[[input]]
name   = "test"
label  = "Test"
source = "field"

[input.labels]
auto         = "Auto-detect"
one-sample   = "One-sample (against mu)"
two-sample   = "Two-sample pooled (Student)"
welch        = "Two-sample Welch (unequal variances)"
paired       = "Paired / dependent samples"

[[input]]
name   = "format"
label  = "Input format"
source = "field"

[input.labels]
auto    = "Auto-detect"
wide    = "Wide table: one column per sample"
long    = "Long rows: group,value"
summary = "Summary rows: name,n,mean,sd"

[[input]]
name   = "delimiter"
label  = "Delimiter"
source = "field"

[input.labels]
auto      = "Auto-detect"
comma     = "Comma ( , )"
tab       = "Tab"
semicolon = "Semicolon ( ; )"
pipe      = "Pipe ( | )"
space     = "Whitespace"

[[input]]
name   = "header"
label  = "Header row"
source = "field"

[input.labels]
auto = "Auto-detect"
yes  = "First row is a header"
no   = "No header"

[[input]]
name        = "mu"
label       = "Hypothesised mean or difference (mu)"
placeholder = "0"
source      = "field"

[[input]]
name   = "tails"
label  = "Alternative hypothesis"
source = "field"

[input.labels]
two   = "Two-tailed (not equal to mu)"
left  = "Left-tailed (less than mu)"
right = "Right-tailed (greater than mu)"

[[input]]
name        = "alpha"
label       = "Significance level (alpha)"
placeholder = "0.05"
source      = "field"
kind        = "slider"
step        = "0.01"

[[input]]
name        = "decimals"
label       = "Decimal places"
placeholder = "4"
source      = "field"
kind        = "slider"
step        = "1"

[[input]]
name   = "output"
label  = "Output format"
source = "field"

[input.labels]
summary = "Readable summary"
table   = "Markdown tables"
json    = "JSON"

[[example]]
label = "Paired before/after"
[example.params]
data = "before,after\n12,10\n14,11\n11,10\n15,12\n13,12\n16,13"
test = "paired"
format = "wide"
delimiter = "comma"
header = "yes"
mu = "0"
tails = "two"
alpha = "0.05"
decimals = "4"
output = "summary"

[[example]]
label = "Two independent samples"
[example.params]
data = "1,4\n2,5\n3,6\n4,7\n5,8"
test = "two-sample"
format = "wide"
delimiter = "comma"
header = "no"
mu = "0"
tails = "two"
alpha = "0.05"
decimals = "4"
output = "summary"

[[example]]
label = "Published means as JSON"
[example.params]
data = "name,n,mean,sd\nControl,12,5.2,1.9235\nTreatment,12,6.8,2.1044"
test = "welch"
format = "summary"
delimiter = "comma"
header = "yes"
mu = "0"
tails = "two"
alpha = "0.05"
decimals = "4"
output = "json"

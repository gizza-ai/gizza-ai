slug          = "de-esser"
title         = "De-Esser Online — Remove Harsh Sibilance from Vocals"
description   = "Free browser de-esser: duck harsh s, sh and t sibilance on vocals, narration and podcasts. Tune amount, band and reduction, or audition the removed esses."
tags          = ["audio", "de-esser", "deesser", "sibilance", "de-essing", "vocals", "podcast", "narration", "harsh s", "ffmpeg", "dynamic eq"]
h1            = "Remove Harsh Sibilance from Vocals"
hero_subtitle = "Pick a vocal, narration or podcast file and dial in how hard the esses get ducked — de-essing runs in your browser, nothing is uploaded."
wasm          = "gizza_ai_de_esser_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "De-essed audio"
format        = "audio"

[[input]]
name   = "file"
source = "file"
accept = "audio/*"
label  = "Audio"

[[input]]
name        = "amount"
source      = "field"
label       = "Amount (1-100)"
placeholder = "60"

[[input]]
name        = "band"
source      = "field"
label       = "Sibilance band (1-100)"
placeholder = "70"

[[input]]
name        = "max_reduction"
source      = "field"
label       = "Max reduction (1-100)"
placeholder = "50"

[[input]]
name        = "mode"
source      = "field"
label       = "Output mode"
placeholder = "output"

[input.labels]
output = "De-essed audio (normal)"
ess    = "Removed esses only (audition)"
input  = "Untouched input (A/B reference)"

[[input]]
name        = "format"
source      = "field"
label       = "Output format"
placeholder = "mp3"

[[example]]
label = "De-ess a vocal (default)"
[example.params]
amount        = "60"
band          = "70"
max_reduction = "50"
mode          = "output"
format        = "mp3"

[[example]]
label = "Gentle podcast polish"
[example.params]
amount        = "35"
band          = "80"
max_reduction = "40"
mode          = "output"
format        = "mp3"

[[example]]
label = "Audition what is being removed"
[example.params]
amount        = "60"
band          = "70"
max_reduction = "50"
mode          = "ess"
format        = "wav"

[package]
name = "gizza-ai-error-level-analysis-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# Pure-Rust decode/re-encode. We need JPEG (the ELA recompression step) plus the
# common web input formats so any uploaded image can be analysed; PNG is the
# lossless output that preserves the amplified difference map exactly.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

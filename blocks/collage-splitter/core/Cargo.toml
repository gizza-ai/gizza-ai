[package]
name = "gizza-ai-collage-splitter-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# image: decode the collage and re-encode each cropped cell (pure-Rust, wasm-safe —
# no native deps, no imageproc/fast_image_resize which bake wasmi-rejected SIMD).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
# zip with deflate only — bundle every extracted cell into one downloadable archive.
zip = { version = "8", default-features = false, features = ["deflate"] }

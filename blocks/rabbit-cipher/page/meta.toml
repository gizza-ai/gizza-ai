slug          = "rabbit-cipher"
title         = "Rabbit Cipher — Encrypt/decrypt with the Rabbit stream cipher — gizza.ai"
description   = "Encrypt or decrypt text with the Rabbit stream cipher (RFC 4503 / eSTREAM) — 128-bit key, optional 64-bit IV, hex or base64. Free, in-browser, no upload."
tags          = ["rabbit", "rabbit cipher", "rabbit encrypt", "rabbit decrypt", "estream", "rfc 4503", "stream cipher"]
h1            = "Rabbit cipher"
hero_subtitle = "Encrypt or decrypt text with the Rabbit stream cipher (RFC 4503) — 128-bit key, optional 64-bit IV, text or encoded keys, hex or base64. Runs in your browser; nothing is uploaded."
wasm          = "gizza_ai_rabbit_cipher_web"
export        = "run"
live          = false
output_label  = "Result"
format        = "text"

[[input]]
name        = "data"
label       = "Data (plaintext to encrypt, or ciphertext to decrypt)"
placeholder = "Text to encrypt…"
source      = "field"
multiline   = true

[[input]]
name        = "operation"
label       = "Operation (encrypt | decrypt)"
placeholder = "encrypt"
source      = "field"

[[input]]
name        = "key"
label       = "Key (16 bytes — 16 chars, or 32 hex / 24 base64)"
placeholder = "16-char passphrase, or encoded key"
source      = "field"

[[input]]
name        = "iv"
label       = "IV (optional, 8 bytes — 8 chars, or 16 hex / 12 base64)"
placeholder = "leave empty for no IV"
source      = "field"

[[input]]
name        = "key_format"
label       = "Key/IV format (text | encoded)"
placeholder = "text"
source      = "field"

[[input]]
name        = "format"
label       = "Encoding (hex | base64)"
placeholder = "hex"
source      = "field"

[package]
name = "gizza-ai-aes-cipher-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
gizza-ai-aes-cipher-core = { path = "../core" }
# aes-gcm pulls getrandom 0.2 transitively; the page targets
# wasm32-unknown-unknown which needs the js backend.
getrandom = { version = "0.2", features = ["js"] }

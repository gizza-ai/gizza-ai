slug          = "period-predictor"
title         = "Period Predictor — Next Period, Ovulation & Fertile Window Dates — gizza.ai"
description   = "Predict your next period start dates from your last period and cycle length, with ovulation estimates and fertile windows. Free, private, in-browser."
tags          = ["period predictor", "period calculator", "menstrual cycle calculator", "next period date", "ovulation calculator", "fertile window", "cycle length", "period tracker", "when is my next period"]
h1            = "Period Predictor"
hero_subtitle = "Enter the first day of your last period and your average cycle length to see your next several period start dates — each with its weekday, bleeding-end date, estimated ovulation day and 6-day fertile window. Runs entirely in your browser, nothing is uploaded. Estimates only, not medical advice or a contraceptive method."
wasm          = "gizza_ai_period_predictor_web"
export        = "run"
live          = false
output_label  = "Predictions (JSON)"
format        = "text"
wide          = true

[[input]]
name        = "last_period"
label       = "First day of your last period"
placeholder = "2026-07-01"
source      = "field"
kind        = "date"

[[input]]
name        = "cycle_length"
label       = "Average cycle length (days)"
placeholder = "28"
source      = "field"
kind        = "slider"
min         = "20"
max         = "45"
step        = "1"

[[input]]
name        = "period_length"
label       = "Period / bleeding length (days)"
placeholder = "5"
source      = "field"
kind        = "slider"
min         = "1"
max         = "14"
step        = "1"

[[input]]
name        = "luteal_phase"
label       = "Luteal-phase length (days before period)"
placeholder = "14"
source      = "field"
kind        = "slider"
min         = "9"
max         = "17"
step        = "1"

[[input]]
name        = "cycles"
label       = "How many upcoming cycles"
placeholder = "6"
source      = "field"
kind        = "slider"
min         = "1"
max         = "24"
step        = "1"

[[example]]
label  = "Standard 28-day cycle"
params = { last_period = "2026-07-01", cycle_length = "28", period_length = "5", luteal_phase = "14", cycles = "6" }

[[example]]
label  = "Short 24-day cycle"
params = { last_period = "2026-07-01", cycle_length = "24", period_length = "4", luteal_phase = "12", cycles = "6" }

[[example]]
label  = "Long 32-day cycle, next 3"
params = { last_period = "2026-07-01", cycle_length = "32", period_length = "6", luteal_phase = "14", cycles = "3" }

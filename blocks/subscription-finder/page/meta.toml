slug          = "subscription-finder"
title         = "Subscription Finder — Spot Recurring Charges in Your Statement — gizza.ai"
description   = "Paste bank or card transactions to find recurring charges, forgotten subscriptions, next charge dates, and projected yearly cost. Free and private."
tags          = ["subscription finder", "recurring charges", "find subscriptions", "cancel subscriptions", "recurring payments", "bank statement analysis", "subscription tracker", "yearly cost", "forgotten subscriptions"]
h1            = "Subscription Finder"
hero_subtitle = "Paste your bank or card transactions and spot every recurring charge — cadence, next charge date and projected annual cost, ranked by yearly spend. Runs entirely in your browser: no bank linking, no upload, no sign-up."
wasm          = "gizza_ai_subscription_finder_web"
export        = "run"
live          = false
output_label  = "Recurring charges"
format        = "text"
wide          = true

[[input]]
name        = "transactions"
label       = "Transactions (one per line: date, description, amount)"
placeholder = "2026-01-15, Netflix, 15.99"
source      = "field"
multiline   = true

[[input]]
name        = "min_occurrences"
label       = "Minimum occurrences to flag as recurring (2–24)"
placeholder = "2"
source      = "field"

[[input]]
name        = "currency"
label       = "Currency symbol"
placeholder = "$"
source      = "field"

# date_format renders as a <select> — its options come from the descriptor enum
# (manifest.json), so they are not duplicated here.
[[input]]
name        = "date_format"
label       = "Date format"
source      = "field"

[[example]]
label  = "Sample statement"
params = { transactions = "2026-01-01, Netflix, 15.99\n2026-02-01, Netflix, 15.99\n2026-03-01, Netflix, 15.99\n2026-01-05, Spotify, 9.99\n2026-02-05, Spotify, 9.99\n2026-01-10, Corner Cafe, 4.50" }

[[example]]
label  = "Weekly + annual mix"
params = { transactions = "2026-01-03, Daily News, 2.00\n2026-01-10, Daily News, 2.00\n2026-01-17, Daily News, 2.00\n2026-01-24, Daily News, 2.00\n2025-02-01, Domain Renewal, 12.00\n2026-02-01, Domain Renewal, 12.00" }

[package]
name = "gizza-ai-password-vault-audit-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
# wasm32-unknown-unknown has no std clock; the stale-password check gets "now" from JS.
js-sys = "0.3"
gizza-ai-password-vault-audit-core = { path = "../core" }

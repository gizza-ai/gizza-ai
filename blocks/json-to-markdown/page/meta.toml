slug          = "json-to-markdown"
title         = "JSON to Markdown Converter"
description   = "Convert JSON exports, API responses or config files into nested Markdown. Objects become bullets and headings; arrays become tables or lists."
tags          = ["json to markdown", "json to md", "json converter", "markdown", "nested json", "json table", "notes export", "api response to markdown"]
h1            = "JSON to Markdown Converter"
hero_subtitle = "Paste any JSON — a notes backup, an API response, a config file — and get readable nested Markdown. Objects become headings and bullets; arrays of records become tables. Runs entirely in your browser, no upload, no sign-up."
wasm          = "gizza_ai_json_to_markdown_web"
export        = "run"
live          = false
output_label  = "Markdown"
format        = "text"

[[input]]
name        = "json"
label       = "JSON"
placeholder = '{"title":"My Note","pinned":true,"tags":["work","idea"]}'
source      = "field"
multiline   = true

# heading_level / max_depth render as sliders over the schema's numeric bounds;
# array_mode renders as a <select> and sort_keys as a checkbox — the control
# types + option lists come from the descriptor's schema (manifest.json).
[[input]]
name        = "heading_level"
label       = "Starting heading level (1–6)"
placeholder = "2"
source      = "field"
kind        = "slider"
step        = "1"

[[input]]
name        = "array_mode"
label       = "Array rendering"
source      = "field"

[[input]]
name        = "sort_keys"
label       = "Sort keys alphabetically"
source      = "field"

[[input]]
name        = "max_depth"
label       = "Max nesting depth (1–20)"
placeholder = "6"
source      = "field"
kind        = "slider"
step        = "1"

[[example]]
label  = "Note object"
[example.params]
json = '{"title":"My Note","pinned":true,"tags":["work","idea"],"meta":{"words":42,"created":"2026-07-31"}}'

[[example]]
label  = "Records → table"
[example.params]
json = '[{"name":"Ada","role":"Editor"},{"name":"Bob","role":"Reviewer"}]'

[[example]]
label  = "Force nested list"
[example.params]
json       = '[{"name":"Ada","role":"Editor"},{"name":"Bob","role":"Reviewer"}]'
array_mode = "list"

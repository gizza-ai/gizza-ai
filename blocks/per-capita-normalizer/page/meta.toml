slug          = "per-capita-normalizer"
title         = "Per Capita Normalizer — Rates per 1,000 / 100,000 Population"
description   = "Paste label, count and population rows and get population-adjusted rates per capita, per 1,000, per 100,000 or a custom base."
tags          = ["per capita calculator", "rate per 100000", "population normalization", "crude rate calculator", "incidence rate", "per 1000 rate", "population adjusted comparison"]
h1            = "Normalize counts into per-capita rates"
hero_subtitle = "Turn raw counts into population-adjusted rates for any list of regions. Choose per capita, per 1,000, per 10,000, per 100,000 or a custom base, and export the ranked table as text, CSV, Markdown or JSON."
wasm          = "gizza_ai_per_capita_normalizer_web"
export        = "run"
live          = false
output_label  = "Normalized rate table"
format        = "text"
wide          = true

[[input]]
name        = "data"
label       = "Rows (label, count, population)"
placeholder = "region,cases,population\nNorthbridge,120,400000\nEastvale,45,150000\nWestport,18,900000"
source      = "field"
multiline   = true

[[input]]
name   = "delimiter"
label  = "Delimiter"
source = "field"

[input.labels]
auto      = "Auto-detect"
comma     = "Comma"
tab       = "Tab"
semicolon = "Semicolon"
pipe      = "Pipe"

[[input]]
name   = "header"
label  = "Header row"
source = "field"

[input.labels]
auto = "Auto-detect"
yes  = "First row is a header"
no   = "No header"

[[input]]
name   = "per"
label  = "Rate base"
source = "field"

[input.labels]
"1"       = "Per capita (per person)"
"1000"    = "Per 1,000"
"10000"   = "Per 10,000"
"100000"  = "Per 100,000"
"1000000" = "Per 1,000,000"
custom    = "Custom base…"

[[input]]
name        = "custom_per"
label       = "Custom base (only when Rate base = Custom)"
placeholder = "500"
source      = "field"

[[input]]
name   = "population_unit"
label  = "Population column is in"
source = "field"

[input.labels]
ones      = "People (actual counts)"
thousands = "Thousands of people"
millions  = "Millions of people"

[[input]]
name        = "decimals"
label       = "Decimal places"
placeholder = "2"
source      = "field"
kind        = "slider"
min         = "0"
max         = "6"
step        = "1"

[[input]]
name   = "sort"
label  = "Sort"
source = "field"

[input.labels]
rate_desc = "Highest rate first"
rate_asc  = "Lowest rate first"
input     = "Keep input order"

[[input]]
name        = "unstable_below"
label       = "Flag rows with a count below (0 = off)"
placeholder = "20"
source      = "field"

[[input]]
name   = "output"
label  = "Output format"
source = "field"

[input.labels]
table    = "Text table + rate chart"
csv      = "CSV"
markdown = "Markdown table"
json     = "JSON"

[[example]]
label = "Cases per 100,000"
[example.params]
data = "region,cases,population\nNorthbridge,120,400000\nEastvale,45,150000\nWestport,18,900000"
delimiter = "comma"
header = "yes"
per = "100000"
custom_per = "0"
population_unit = "ones"
decimals = "2"
sort = "rate_desc"
unstable_below = "20"
output = "table"

[[example]]
label = "Population in thousands → per 1,000"
[example.params]
data = "country,deaths,population\nAlderia,4200,8175\nBrantia,980,1310"
delimiter = "comma"
header = "yes"
per = "1000"
custom_per = "0"
population_unit = "thousands"
decimals = "2"
sort = "rate_desc"
unstable_below = "0"
output = "table"

[[example]]
label = "Per capita, as CSV"
[example.params]
data = "Central,3200,12000\nHarbour,1500,9000\nRidge,900,15000"
delimiter = "comma"
header = "no"
per = "1"
custom_per = "0"
population_unit = "ones"
decimals = "3"
sort = "rate_desc"
unstable_below = "0"
output = "csv"

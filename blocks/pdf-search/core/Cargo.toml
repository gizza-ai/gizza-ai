[package]
name = "gizza-ai-pdf-search-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# default-features = false drops `rayon` (threads), `chrono`/`jiff`/`time`
# (date crates). The parser + text extraction are always-on in 0.36, so this
# keeps the tree thread-free and compiles to wasm32-wasip1 (the `wafer build`
# target). Same read-only PDF path as blocks/pdf-extract-text.
lopdf = { version = "=0.36.0", default-features = false }

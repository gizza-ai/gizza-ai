slug          = "video-to-animated-webp"
title         = "Video to Animated WebP Converter"
description   = "Convert a short video clip to a looping animated WebP in your browser. Trim, resize, set fps and quality, or use lossless WebP with transparency preserved."
tags          = ["video", "animated webp", "webp", "video to webp", "gif alternative", "convert", "clip", "loop"]
h1            = "Video to Animated WebP"
hero_subtitle = "Pick a video, choose a section, frame rate and width, then encode a looping animated WebP locally in your browser — smaller and cleaner than GIF for many clips."
wasm          = "gizza_ai_video_to_animated_webp_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Animated WebP"
format        = "image"

[[input]]
name   = "file"
source = "file"
accept = "video/*"
label  = "Video"

[[input]]
name        = "start"
source      = "field"
label       = "Start (seconds)"
placeholder = "0"

[[input]]
name        = "duration"
source      = "field"
label       = "Duration (seconds, 0 = to the end)"
placeholder = "3"

[[input]]
name        = "fps"
source      = "field"
label       = "Frames per second (0 = default 12)"
placeholder = "12"
kind        = "slider"
step        = "1"

[[input]]
name        = "width"
source      = "field"
label       = "Width in px (0 = keep source size)"
placeholder = "480"
kind        = "slider"
step        = "1"

[[input]]
name        = "quality"
source      = "field"
label       = "Quality (0 = default 80)"
placeholder = "80"
kind        = "slider"
step        = "1"

[[input]]
name   = "lossless"
source = "field"
label  = "Lossless WebP"

[[example]]
label = "Small social clip"
[example.params]
start    = "0"
duration = "2"
fps      = "12"
width    = "320"
quality  = "75"
lossless = "false"

[[example]]
label = "Transparent/lossless"
[example.params]
start    = "0"
duration = "1"
fps      = "15"
width    = "256"
quality  = "0"
lossless = "true"

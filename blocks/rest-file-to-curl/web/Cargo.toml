[package]
name = "gizza-ai-rest-file-to-curl-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
# The page target has no std clock; js-sys supplies the browser clock for the
# {{$timestamp}} / {{$datetime}} / {{$guid}} system variables.
js-sys = "0.3"
gizza-ai-rest-file-to-curl-core = { path = "../core" }

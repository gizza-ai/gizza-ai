slug          = "csv-insert-column"
title         = "CSV Insert Column — Add a Column Online"
description   = "Add a new column to a CSV at any position, filled with a constant value — in your browser. Free, private, no upload."
tags          = ["csv add column", "insert column", "csv constant column", "add field csv"]
h1            = "CSV Insert Column"
hero_subtitle = "Add a new column to a CSV at a chosen position, filled with a constant value. Runs entirely in your browser, no upload."
wasm          = "gizza_ai_csv_insert_column_web"
export        = "run"
live          = false
output_label  = "CSV with new column"
format        = "text"

[[input]]
name        = "data"
label       = "CSV"
placeholder = "a,b\n1,2\n3,4"
source      = "field"
multiline   = true

[[input]]
name        = "name"
label       = "New column name"
placeholder = "source"
source      = "field"

[[input]]
name        = "value"
label       = "Fill value (constant)"
placeholder = "import"
source      = "field"

[[input]]
name        = "position"
label       = "Position (1-based, or 'end')"
placeholder = "end"
source      = "field"

[[input]]
name        = "header"
label       = "First row is a header"
source      = "field"

[[input]]
name        = "delimiter"
label       = "Delimiter (, tab ; |)"
placeholder = ","
source      = "field"

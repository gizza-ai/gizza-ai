[package]
name = "gizza-ai-dkim-generate-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# rsa: pure-Rust RSA keygen + PKCS#8/PKCS#1/SPKI PEM+DER coding (num-bigint-dig).
# Proven wasm32-safe by blocks/generate-rsa-key-pair; the CSPRNG is getrandom.
rsa = { version = "0.9", features = ["pem"] }
# ed25519-dalek: RFC 8463 (k=ed25519) DKIM keys — 32-byte seed + 32-byte public key.
ed25519-dalek = { version = "2", default-features = false, features = [
    "pkcs8",
    "pem",
    "rand_core",
] }
rand = "0.8"
base64 = "0.22"
serde_json = "1"

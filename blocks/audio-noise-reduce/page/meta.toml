slug          = "audio-noise-reduce"
title         = "Reduce Audio Background Noise Online — gizza.ai"
description   = "Remove steady background hiss and hum from an audio file right in your browser — pick a strength, choose a denoiser, download. Runs locally, nothing is uploaded, free."
tags          = ["audio", "noise", "denoise", "hiss", "hum", "background-noise", "cleanup", "afftdn"]
h1            = "Reduce Audio Background Noise"
hero_subtitle = "Pick an audio file, set a strength, and clean out steady hiss/hum in your browser — nothing is uploaded."
wasm          = "gizza_ai_audio_noise_reduce_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Denoised audio"
format        = "audio"

[[input]]
name   = "file"
source = "file"
accept = "audio/*"
label  = "Audio"

[[input]]
name        = "strength"
source      = "field"
label       = "Reduction strength (1–100)"
placeholder = "12"
kind        = "slider"
step        = "1"

[[input]]
name   = "method"
source = "field"
label  = "Denoiser"

[input.labels]
afftdn = "afftdn — FFT, fast (default)"
anlmdn = "anlmdn — non-local means, gentler"

[[input]]
name   = "remove_hum"
source = "field"
label  = "Also cut low hum/rumble (below 80 Hz)"

[[input]]
name   = "format"
source = "field"
label  = "Output format"

[[example]]
label = "Gentle mp3"
[example.params]
strength = "12"
method   = "afftdn"
format   = "mp3"

[[example]]
label = "Strong + de-hum, wav"
[example.params]
strength   = "40"
method     = "afftdn"
remove_hum = "true"
format     = "wav"

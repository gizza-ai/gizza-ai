slug          = "midi-chord-progression-generator"
title         = "MIDI Chord Progression Generator"
description   = "Convert chord symbols like C G Am F into a downloadable .mid file with voicing, inversion, arpeggio, strum, tempo and instrument controls."
tags          = ["chord progression to midi", "midi chord generator", "chord symbols", "music theory", "midi file generator", "arpeggio generator"]
h1            = "MIDI Chord Progression Generator"
hero_subtitle = "Type a chord progression, choose voicing and timing, then download a real Standard MIDI File you can open in a DAW, notation app or browser synth."
wasm          = "gizza_ai_midi_chord_progression_generator_web"
export        = "run"
live          = false
output_label  = "MIDI file"
format        = "text"
wide          = true

[[input]]
name        = "progression"
label       = "Chord progression"
placeholder = "C G Am F\nCmaj7 | Dm7 G7 | Cmaj7"
source      = "field"
multiline   = true

[[input]]
name        = "tempo"
label       = "Tempo (BPM)"
placeholder = "120"
default     = "120"
source      = "field"
kind        = "slider"
step        = "1"

[[input]]
name        = "beats_per_chord"
label       = "Beats per chord"
placeholder = "4"
default     = "4"
source      = "field"
kind        = "slider"
step        = "0.25"

[[input]]
name        = "beats_per_bar"
label       = "Beats per bar"
placeholder = "4"
default     = "4"
source      = "field"
kind        = "slider"
step        = "1"

[[input]]
name        = "octave"
label       = "Root octave"
placeholder = "4"
default     = "4"
source      = "field"
kind        = "slider"
step        = "1"

[[input]]
name   = "voicing"
label  = "Voicing"
source = "field"
labels = { close = "Close", drop-2 = "Drop 2", drop-3 = "Drop 3", spread = "Spread" }

[[input]]
name   = "inversion"
label  = "Inversion"
source = "field"
labels = { root = "Root position", first = "First inversion", second = "Second inversion", third = "Third inversion", smooth = "Smooth nearest voice-leading" }

[[input]]
name   = "pattern"
label  = "Pattern"
source = "field"
labels = { block = "Block chords", arpeggio-up = "Arpeggio up", arpeggio-down = "Arpeggio down", arpeggio-updown = "Arpeggio up/down", strum = "Strum" }

[[input]]
name   = "arp_note"
label  = "Arpeggio step"
source = "field"
labels = { whole = "Whole", half = "Half", quarter = "Quarter", eighth = "Eighth", sixteenth = "Sixteenth", thirty-second = "Thirty-second" }

[[input]]
name        = "note_length"
label       = "Note length (%)"
placeholder = "95"
default     = "95"
source      = "field"
kind        = "slider"
step        = "1"

[[input]]
name   = "add_bass"
label  = "Double the bass note one octave lower"
source = "field"

[[input]]
name        = "transpose"
label       = "Transpose (semitones)"
placeholder = "0"
default     = "0"
source      = "field"
kind        = "slider"
step        = "1"

[[input]]
name        = "velocity"
label       = "Velocity"
placeholder = "96"
default     = "96"
source      = "field"
kind        = "slider"
step        = "1"

[[input]]
name   = "instrument"
label  = "General MIDI instrument"
source = "field"
labels = { acoustic-grand-piano = "Acoustic grand piano", bright-acoustic-piano = "Bright acoustic piano", electric-piano = "Electric piano", harpsichord = "Harpsichord", vibraphone = "Vibraphone", drawbar-organ = "Drawbar organ", church-organ = "Church organ", accordion = "Accordion", acoustic-guitar-nylon = "Acoustic guitar — nylon", acoustic-guitar-steel = "Acoustic guitar — steel", electric-guitar-clean = "Electric guitar — clean", acoustic-bass = "Acoustic bass", string-ensemble = "String ensemble", choir-aahs = "Choir aahs", synth-pad-warm = "Warm synth pad", synth-lead-square = "Square synth lead" }

[[example]]
label  = "Pop loop"
params = { progression = "C G Am F", tempo = "120", beats_per_chord = "4", voicing = "close", pattern = "block", instrument = "acoustic-grand-piano" }

[[example]]
label  = "Jazz turnaround"
params = { progression = "Cmaj7 | Dm7 G7 | Cmaj7", tempo = "95", beats_per_chord = "2", voicing = "drop-2", inversion = "smooth", pattern = "block", instrument = "electric-piano" }

[[example]]
label  = "Arpeggiated pad"
params = { progression = "Am F C G", tempo = "90", beats_per_chord = "4", pattern = "arpeggio-updown", arp_note = "eighth", note_length = "80", add_bass = "true", instrument = "synth-pad-warm" }

[[example]]
label  = "Slash chords and durations"
params = { progression = "C/E:2 F:2 Gsus4:1 G:1 C:4", tempo = "110", beats_per_chord = "4", voicing = "spread", pattern = "strum", instrument = "acoustic-guitar-steel" }

slug          = "fuzzy-dedupe"
title         = "Fuzzy Dedupe — Remove Near-Duplicate Rows & Lines"
description   = "Remove near-duplicate rows or lines (typos, casing, spacing) that exact de-duplication misses, and keep one clean row per group."
tags          = ["fuzzy dedupe", "remove duplicates", "near duplicate rows", "fuzzy matching", "data cleaning", "deduplicate csv"]
h1            = "Fuzzy Dedupe"
hero_subtitle = "Find and remove near-duplicate rows or lines — typos, casing, and spacing differences exact de-dup misses — and keep one clean row per group. Runs entirely in your browser, no upload."
wasm          = "gizza_ai_fuzzy_dedupe_web"
export        = "run"
live          = false
output_label  = "Result"
format        = "text"

[[input]]
name        = "data"
label       = "Rows (CSV, or one value per line)"
placeholder = "New York\nnew york\nNew  York\nNwe York\nBoston"
source      = "field"
multiline   = true

[[input]]
name        = "columns"
label       = "Match columns (names or 1-based indices; blank = whole row)"
placeholder = "company"
source      = "field"

[[input]]
name        = "delimiter"
label       = "Delimiter (, tab ; |)"
placeholder = ","
source      = "field"

[[input]]
name   = "header"
label  = "First row is a header"
source = "field"

[[input]]
name        = "threshold"
label       = "Similarity threshold (0–100)"
placeholder = "85"
source      = "field"
kind        = "slider"
step        = "1"

[[input]]
name   = "keep"
label  = "Keep which row per group"
source = "field"

[[input]]
name   = "normalize_case"
label  = "Ignore case (USA = usa)"
source = "field"

[[input]]
name   = "normalize_spacing"
label  = "Ignore extra spacing (New  York = New York)"
source = "field"

[[input]]
name   = "output"
label  = "Output format"
source = "field"

[[example]]
label = "City list (typos + casing)"

[example.params]
data = "New York\nnew york\nNew  York\nNwe York\nBoston\nBoston\nboston"
threshold = "70"
output = "deduped"

[[example]]
label = "CSV keyed on a column, keep longest"

[example.params]
data = "company,amount\nAcme Inc,100\nacme inc,90\nAcme  Inc,80\nGlobex,50"
columns = "company"
header = "true"
keep = "longest"
output = "deduped"

[[example]]
label = "Show what was removed"

[example.params]
data = "New York\nnew york\nNwe York\nBoston"
threshold = "80"
output = "removed"

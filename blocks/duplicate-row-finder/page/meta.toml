slug          = "duplicate-row-finder"
title         = "Duplicate Row Finder — Find Duplicate Rows in CSV Online"
description   = "Find and report duplicate rows in a CSV or table: group them, list line numbers, and see which columns drive the duplication. Browser-local, no upload, free."
tags          = ["find duplicate rows", "csv duplicate checker", "duplicate finder", "duplicate rows report", "csv duplicates"]
h1            = "Duplicate Row Finder"
hero_subtitle = "Find duplicate rows in a CSV or delimited table, group them with their line numbers, and see which columns drive the duplication. Runs entirely in your browser — nothing is uploaded."
wasm          = "gizza_ai_duplicate_row_finder_web"
export        = "run"
live          = false
output_label  = "Duplicate report"
format        = "text"

[[input]]
name        = "data"
label       = "Table / CSV"
placeholder = "name,email\nAlice,a@x.com\nBob,b@y.com\nAlice,a@x.com"
source      = "field"
multiline   = true

[[input]]
name        = "columns"
label       = "Key columns (names or 1-based indices; blank = whole row)"
placeholder = "email"
source      = "field"

[[input]]
name   = "header"
label  = "First row is a header"
source = "field"

[[input]]
name        = "delimiter"
label       = "Delimiter (, tab ; |)"
placeholder = ","
source      = "field"

[[input]]
name   = "ignore_case"
label  = "Ignore letter case"
source = "field"

[[input]]
name   = "ignore_whitespace"
label  = "Ignore extra whitespace"
source = "field"

[[input]]
name   = "output"
label  = "Output"
source = "field"

[input.labels]
report = "Report (summary)"
csv    = "Duplicate rows only (CSV)"
json   = "Structured (JSON)"

[[example]]
label  = "Whole-row duplicates"
params = { data = "name,email\nAlice,a@x.com\nBob,b@y.com\nAlice,a@x.com\nCarol,c@z.com\nBob,b@y.com", output = "report" }

[[example]]
label  = "Duplicate emails only"
params = { data = "name,email\nAlice,a@x.com\nAli,a@x.com\nBob,b@y.com", columns = "email", output = "report" }

[[example]]
label  = "Export duplicate rows"
params = { data = "name,email\nAlice,a@x.com\nBob,b@y.com\nAlice,a@x.com\nBob,b@y.com", output = "csv" }

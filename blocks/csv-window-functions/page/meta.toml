slug          = "csv-window-functions"
title         = "CSV Window Functions — Running Total, Moving Average, Rank & Lag/Lead"
description   = "Add SQL window-function columns to CSV rows in your browser: running total, moving average, lag, lead, rank, dense_rank, and row_number, with partition and order support."
tags          = ["csv window functions", "running total csv", "moving average csv", "csv rank", "csv lag lead", "cumulative sum csv", "sql window function", "row number csv", "csv analytics"]
h1            = "CSV Window Functions"
hero_subtitle = "Add SQL-style window columns to a CSV without collapsing rows: running total, moving average, lag/lead, rank, dense_rank, and row_number — grouped by partition and ordered however you like."
wasm          = "gizza_ai_csv_window_functions_web"
export        = "run"
live          = false
output_label  = "Result CSV"
format        = "text"
wide          = true

[[input]]
name        = "data"
label       = "CSV data"
placeholder = "region,day,sales\nW,1,3\nW,2,5\nE,1,10\nE,2,20"
source      = "field"
multiline   = true

[[input]]
name        = "function"
label       = "Window function"
source      = "field"
[input.labels]
running_total  = "Running total (cumulative sum)"
moving_average = "Moving average (trailing)"
lag            = "Lag (previous row)"
lead           = "Lead (next row)"
rank           = "Rank (ties share, gaps after)"
dense_rank     = "Dense rank (ties share, no gaps)"
row_number     = "Row number"

[[input]]
name        = "column"
label       = "Value column"
placeholder = "sales"
source      = "field"

[[input]]
name        = "partition_by"
label       = "Partition by"
placeholder = "region"
source      = "field"

[[input]]
name        = "order_by"
label       = "Order by"
placeholder = "day"
source      = "field"

[[input]]
name        = "window"
label       = "Moving-average window"
placeholder = "3"
source      = "field"

[[input]]
name        = "offset"
label       = "Lag/lead offset"
placeholder = "1"
source      = "field"

[[input]]
name        = "output_column"
label       = "Output column name"
placeholder = "running_total_sales"
source      = "field"

[[input]]
name        = "descending"
label       = "Descending order / rank"
source      = "field"

[[input]]
name        = "has_header"
label       = "First row is a header"
source      = "field"

[[input]]
name        = "delimiter"
label       = "CSV delimiter"
source      = "field"
[input.labels]
"," = "Comma"
tab = "Tab"
";" = "Semicolon"
"|" = "Pipe"

[[example]]
label  = "Running total by region"
params = { data = "region,day,sales\nW,2,5\nE,1,10\nW,1,3\nE,2,20", function = "running_total", column = "sales", partition_by = "region", order_by = "day" }

[[example]]
label  = "3-row moving average"
params = { data = "day,sales\n1,10\n2,20\n3,30\n4,40", function = "moving_average", column = "sales", window = "3", output_column = "avg3" }

[[example]]
label  = "Rank scores high-to-low"
params = { data = "name,score\nA,90\nB,90\nC,80\nD,70", function = "rank", column = "score", descending = "true" }

[[example]]
label  = "Previous day's sales (lag)"
params = { data = "day,sales\n1,10\n2,20\n3,30", function = "lag", column = "sales", offset = "1" }

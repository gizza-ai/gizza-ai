[package]
name = "gizza-ai-generate-pgp-key-pair-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
pgp = { version = "0.14", default-features = false }
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
smallvec = "1"
serde = { version = "1", features = ["derive"] }

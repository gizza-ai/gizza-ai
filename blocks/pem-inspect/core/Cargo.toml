[package]
name = "gizza-ai-pem-inspect-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
x509-parser = "0.16"
pem = "3"
sha2 = "0.10"
sha1 = "0.10"
pkcs8 = { version = "0.10", features = ["alloc"] }
pkcs1 = "0.7"
sec1 = { version = "0.7", features = ["der"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "gizza-ai-pem-to-jwk-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
gizza-ai-pem-to-jwk-core = { path = "../core" }
serde_json = "1"
# rsa/p* pull getrandom 0.2 transitively; the page targets wasm32-unknown-unknown
# which needs the js backend.
getrandom = { version = "0.2", features = ["js"] }

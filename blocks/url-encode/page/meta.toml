slug          = "url-encode"
title         = "URL Encoder & Decoder"
description   = "Percent-encode or decode text and URLs in your browser — component, whole-URL, or form mode, batch per-line, and recursive decode. Free, private, no sign-up."
tags          = ["url encode", "url decode", "percent encoding", "uri", "query string", "form urlencoded", "plus encoding", "batch", "double decode"]
h1            = "URL Encoder / Decoder"
hero_subtitle = "Percent-encode or decode any text or URL — component, whole-URL, or form mode, batch and recursive options. Runs entirely in your browser, no server, no sign-up."
wasm          = "gizza_ai_url_encode_web"
export        = "run"
live          = false
output_label  = "Result"
format        = "text"

[[input]]
name        = "text"
label       = "Text or URL"
placeholder = "name=John Doe&city=São Paulo"
source      = "field"
multiline   = true

# mode/target render as <select> and per_line as a checkbox — control type +
# options are derived from the descriptor's schema (manifest.json), so labels
# here stay short and the option lists are NOT duplicated.
[[input]]
name        = "mode"
label       = "Mode"
source      = "field"

[[input]]
name        = "target"
label       = "Target"
source      = "field"

[[input]]
name        = "per_line"
label       = "Convert each line separately"
source      = "field"

[[input]]
name        = "repeat"
label       = "Repeat (1–16 — un-nest double-encoded input)"
placeholder = "1"
source      = "field"

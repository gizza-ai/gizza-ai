slug          = "phylip-to-fasta"
title         = "PHYLIP to FASTA Converter"
description   = "Convert PHYLIP alignments to FASTA in your browser. Sequential and interleaved layouts, strict or relaxed taxon names, gap stripping. Nothing is uploaded."
tags          = ["phylip to fasta", "phylip converter", "fasta", "alignment converter", "msa", "bioinformatics", "interleaved phylip", "sequential phylip", "phylogenetics", "sequence alignment"]
h1            = "PHYLIP to FASTA Converter"
hero_subtitle = "Paste a PHYLIP multiple-sequence alignment — sequential or interleaved, strict or relaxed taxon names — and get standard FASTA back. Runs entirely in your browser, nothing is uploaded."
wasm          = "gizza_ai_phylip_to_fasta_web"
export        = "run"
live          = false
output_label  = "FASTA output"
format        = "text"

[[input]]
name        = "phylip"
label       = "PHYLIP alignment"
placeholder = "3 12\nAlpha     ACGT\nBeta      ACGA\nGamma     TCGA\n\nACGTACGT\nACGTACGT\nACGTACGT"
source      = "field"
multiline   = true

# layout / name_style render as <select>s and the three flags as checkboxes —
# control types come from the descriptor's schema (manifest.json), so the labels
# stay short here and the friendly wording lives in [input.labels].
[[input]]
name        = "layout"
label       = "Body layout"
source      = "field"

[input.labels]
"auto"        = "Auto-detect (recommended)"
"sequential"  = "Sequential — one taxon at a time"
"interleaved" = "Interleaved — blocks of chunks"

[[input]]
name        = "name_style"
label       = "Taxon name style"
source      = "field"

[input.labels]
"auto"    = "Auto-detect (recommended)"
"strict"  = "Strict — name is columns 1-10"
"relaxed" = "Relaxed — name is the first word"

[[input]]
name        = "wrap"
label       = "FASTA line width (0 = one line)"
placeholder = "60"
source      = "field"

[[input]]
name        = "uppercase"
label       = "Uppercase residues"
source      = "field"

[[input]]
name        = "remove_gaps"
label       = "Strip gaps (- and .)"
source      = "field"

[[input]]
name        = "tolerant"
label       = "Tolerant — convert despite header mismatches"
source      = "field"

[[example]]
label = "Interleaved alignment"
[example.params]
phylip = "3 12\nAlpha     ACGT\nBeta      ACGA\nGamma     TCGA\n\nACGTACGT\nACGTACGT\nACGTACGT"
wrap = "0"

[[example]]
label = "Sequential, long names"
[example.params]
phylip = "2 8\nHomo_sapiens ACGTACGT\nPan_troglodytes ACGTTCGT"
wrap = "0"

[[example]]
label = "Strict 10-column names"
[example.params]
phylip = "2 8\nSalmonellaACGTACGT\nEscherichiACGTTCGT"
wrap = "0"

[[example]]
label = "Gapped alignment, gaps stripped"
[example.params]
phylip = "2 10\nAlpha     AC--GTAC-T\nBeta      ACGTGT--CT"
remove_gaps = "true"
wrap = "0"

slug          = "smart-quotes-converter"
title         = "Smart Quotes Converter — Straight ↔ Curly Typographic Quotes"
description   = "Free online smart quotes converter: turn straight ASCII quotes into curly typographic quotes (and back), with correct opening/closing detection. Runs in your browser."
tags          = ["smart quotes converter", "curly quotes", "straight quotes", "typographic quotes", "curly quote generator", "straighten quotes", "smart quotes", "prime marks"]
h1            = "Smart Quotes Converter"
hero_subtitle = "Turn straight ASCII quotes (\" ') into curly typographic quotes (“ ” ‘ ’) — with correct opening/closing detection — or straighten curly quotes back for code, CSV, and JSON. Runs entirely in your browser, no server, no sign-up."
wasm          = "gizza_ai_smart_quotes_converter_web"
export        = "run"
live          = false
output_label  = "Result"
format        = "text"

[[input]]
name        = "input"
label       = "Text"
placeholder = "\"Hello,\" she said. It's a 'test'."
source      = "field"
multiline   = true

# `direction` renders as a <select>; its options come from the descriptor schema
# (manifest.json). Friendly labels only — the values stay canonical.
[[input]]
name        = "direction"
label       = "Direction"
source      = "field"

[input.labels]
to_curly    = "Straight → Curly (educate)"
to_straight = "Curly → Straight (straighten)"

[[input]]
name   = "convert_double"
label  = "Convert double quotes"
source = "field"

[[input]]
name   = "convert_single"
label  = "Convert single quotes / apostrophes"
source = "field"

[[input]]
name   = "feet_inches"
label  = "Feet & inches → prime marks (6'4\" → 6′4″)"
source = "field"

# Preset chips — one-click prefill of a curl example and a straighten example.
[[example]]
label = "Curl straight quotes"
[example.params]
input     = "\"Hello,\" she said. It's a 'test'."
direction = "to_curly"

[[example]]
label = "Straighten curly quotes"
[example.params]
input     = "“It’s” a ‘test’"
direction = "to_straight"

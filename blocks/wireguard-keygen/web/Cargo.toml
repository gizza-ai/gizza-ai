[package]
name = "gizza-ai-wireguard-keygen-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
gizza-ai-wireguard-keygen-core = { path = "../core" }
# getrandom 0.2 needs the `js` backend on the wasm32-unknown-unknown page target
# so the CSPRNG binds to crypto.getRandomValues (same fix as blocks/age-keygen).
getrandom = { version = "0.2", features = ["js"] }

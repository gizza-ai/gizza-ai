[package]
name = "gizza-ai-zstd-decompress-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# ruzstd: pure-Rust Zstandard (RFC 8878) DECODER, wasm32-safe — same pin as
# blocks/file-compressor. The `hash` default feature supplies the xxHash-32
# content-checksum verification this block reports. There is deliberately no
# encoder: the reference zstd encoder is a C library that cannot build to
# wasm32-wasip1 here (see the file-compressor note), so this block decodes only.
ruzstd = "0.8"
base64 = "0.22"

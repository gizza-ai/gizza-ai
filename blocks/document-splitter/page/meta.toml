slug          = "document-splitter"
title         = "Document Splitter — split Markdown or HTML by section"
description   = "Split a long Markdown or HTML document into separate files, one per top-level heading. Runs entirely in your browser, no upload, no sign-up."
tags          = ["document splitter", "split markdown", "split html", "by heading", "sections", "chunk document"]
h1            = "Document Splitter"
hero_subtitle = "Break a long Markdown or HTML document into one file per top-level section. Runs in your browser; nothing is uploaded."
wasm          = "gizza_ai_document_splitter_web"
export        = "run"
live          = false
output_label  = "Sections"
format        = "text"

[[input]]
name        = "document"
label       = "Document"
placeholder = "# First section\nSome text…\n\n# Second section\nMore text…"
source      = "field"
multiline   = true

# format renders as a <select>; option list is derived from the descriptor schema.
[[input]]
name        = "format"
label       = "Format"
source      = "field"

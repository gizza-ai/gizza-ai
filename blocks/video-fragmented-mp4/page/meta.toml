slug          = "video-fragmented-mp4"
title         = "Fragment MP4 for Streaming — fMP4 for MSE, DASH and CMAF"
description   = "Convert a progressive MP4 into a single-file fragmented MP4 for MSE, DASH byte ranges or CMAF-style playback. Stream-copy by default; optional H.264/AAC re-encode."
tags          = ["fragmented mp4", "fmp4", "mse", "dash", "cmaf", "mp4 streaming", "ffmpeg", "video remux"]
h1            = "Fragment MP4 for Streaming"
hero_subtitle = "Turn a regular MP4 into a fragmented MP4 with an init header and moof/mdat fragments. Stream-copy by default, or re-encode to H.264/AAC for browser compatibility. Runs locally in your browser."
wasm          = "gizza_ai_video_fragmented_mp4_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Fragmented MP4"
format        = "video"

[[input]]
name   = "file"
source = "file"
accept = "video/*"
label  = "Video file"

# Field order MUST match web/src/lib.rs build_argv args:
# mode, profile, fragment_duration, keyframe_interval, segment_index.
[[input]]
name   = "mode"
source = "field"
label  = "Conversion mode"

[input.labels]
copy = "copy — remux only, no quality loss"
h264 = "h264 — re-encode to H.264/AAC"

[[input]]
name   = "profile"
source = "field"
label  = "Streaming profile"

[input.labels]
mse = "MSE / generic fMP4"
dash = "DASH-style byte ranges"
cmaf = "CMAF-oriented"

[[input]]
name        = "fragment_duration"
source      = "field"
label       = "Minimum fragment duration (seconds)"
placeholder = "0 = one fragment per keyframe"
kind        = "slider"
step        = "0.5"

[[input]]
name        = "keyframe_interval"
source      = "field"
label       = "H.264 keyframe interval (seconds)"
placeholder = "2"
kind        = "slider"
step        = "0.5"

[[input]]
name   = "segment_index"
source = "field"
label  = "Write a global sidx segment index"

[[example]]
label  = "MSE copy remux"
params = { mode = "copy", profile = "mse", fragment_duration = "0", keyframe_interval = "2", segment_index = "false" }

[[example]]
label  = "2-second DASH-style fragments"
params = { mode = "copy", profile = "dash", fragment_duration = "2", keyframe_interval = "2", segment_index = "true" }

[[example]]
label  = "CMAF H.264/AAC fallback"
params = { mode = "h264", profile = "cmaf", fragment_duration = "2", keyframe_interval = "2", segment_index = "false" }

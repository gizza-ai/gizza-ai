slug          = "pin-image-resizer"
title         = "Pinterest Pin Image Resizer — 1000×1500 (2:3) — gizza.ai"
description   = "Resize and crop any image to a Pinterest pin size right in your browser — 1000×1500 (2:3), square, tall, or story. Smart crop, no upload, free."
tags          = ["pinterest", "pin", "image", "resize", "2:3", "1000x1500", "crop"]
h1            = "Pinterest Pin Image Resizer"
hero_subtitle = "Pick an image and a pin format — it's resized and cropped to Pinterest's recommended size in your browser, nothing is uploaded."
wasm          = "gizza_ai_pin_image_resizer_web"
export        = "build_argv"
runtime       = "ffmpeg"
output_label  = "Pinterest pin"
format        = "image"

[[input]]
name   = "file"
source = "file"
accept = "image/*"
label  = "Image"

[[input]]
name    = "preset"
source  = "field"
label   = "Pin format"
default = "standard"

[input.labels]
standard = "Standard pin — 1000×1500 (2:3)"
square   = "Square pin — 1000×1000 (1:1)"
tall     = "Tall / infographic — 1000×2100"
story    = "Story / idea pin — 1080×1920 (9:16)"

[[input]]
name    = "fit"
source  = "field"
label   = "Fit"
default = "cover"

[input.labels]
cover   = "Cover — fill & crop (no bars)"
contain = "Contain — fit & pad"
stretch = "Stretch — force exact size"

[[input]]
name    = "gravity"
source  = "field"
label   = "Crop from (cover only)"
default = "center"

[input.labels]
center = "Center"
top    = "Top"
bottom = "Bottom"

[[input]]
name        = "background"
source      = "field"
label       = "Pad colour (contain only)"
kind        = "color"
placeholder = "#ffffff"
default     = "#ffffff"

[[example]]
label = "Standard 2:3 pin"
[example.params]
preset = "standard"
fit    = "cover"

[[example]]
label = "Square pin"
[example.params]
preset = "square"
fit    = "cover"

[[example]]
label = "Story 9:16"
[example.params]
preset = "story"
fit    = "cover"

[[example]]
label = "Contain on white"
[example.params]
preset     = "standard"
fit        = "contain"
background = "#ffffff"

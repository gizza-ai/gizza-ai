[package]
name = "gizza-ai-image-region-change-grid-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
# image: pure-Rust decode + resize, using the image crate's own samplers (NOT
# fast_image_resize), so the module instantiates under `wafer build` with wasm
# SIMD off. default-features off to drop rayon etc.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }

slug          = "midi-tempo-change"
title         = "MIDI Tempo Changer — change the BPM of a .mid file"
description   = "Change the tempo of a MIDI file without moving a single note. Set an exact BPM or scale the speed, keep or flatten tempo changes. Runs in your browser."
tags = [
  "midi tempo changer",
  "change midi bpm",
  "midi bpm editor",
  "slow down midi file",
  "speed up midi",
  "midi tempo editor",
  "set midi tempo",
  "midi practice tempo",
]
h1            = "MIDI tempo changer"
hero_subtitle = "Give a .mid file a new tempo — an exact BPM, or a speed multiplier like 0.75× for practice. Every note, velocity, controller and time signature is carried through untouched; only the tempo meta events are rewritten. Runs entirely in your browser; nothing is uploaded."
wasm          = "gizza_ai_midi_tempo_change_web"
export        = "run"
live          = false
output_label  = "Retimed MIDI file"
format        = "text"

[[input]]
name        = "input"
label       = "MIDI file (base64 or hex)"
placeholder = "TVRoZAAAAAYAAAABAGBNVHJr…  (or 4d546864000000…)"
source      = "field"
multiline   = true

[[input]]
name   = "encoding"
label  = "Input encoding"
source = "field"

[input.labels]
auto   = "Auto-detect (hex if all hex digits, else base64)"
base64 = "Base64"
hex    = "Hex"

[[input]]
name   = "mode"
label  = "How to pick the new tempo"
source = "field"

[input.labels]
set-bpm = "Set an exact BPM — the file's first tempo becomes it"
scale   = "Scale the existing tempo by a multiplier"

[[input]]
name        = "bpm"
label       = "Target tempo (BPM) — used by “Set an exact BPM”"
placeholder = "120"
source      = "field"
kind        = "slider"
min         = "20"
max         = "400"
step        = "1"

[[input]]
name        = "factor"
label       = "Speed multiplier — used by “Scale”"
placeholder = "1.0"
source      = "field"
kind        = "slider"
min         = "0.1"
max         = "10"
step        = "0.05"

[[input]]
name   = "tempo_map"
label  = "Files that already change tempo"
source = "field"

[input.labels]
scale   = "Scale every tempo event — keeps ritardandos and accelerandos"
flatten = "Flatten to one constant tempo"

[[input]]
name   = "keep_duration"
label  = "Keep the playing time (re-notate: rescale every note's position too)"
source = "field"

[[example]]
label = "Set to 140 BPM"
[example.params]
input = "4d546864000000060000000100604d54726b0000002400ff03055069616e6f00ff510307a12000ff58040402180800903c4060803c0000ff2f00"
encoding = "hex"
mode = "set-bpm"
bpm = "140"
factor = "1.0"
tempo_map = "scale"
keep_duration = "false"

[[example]]
label = "Slow practice pass — 75% speed"
[example.params]
input = "4d546864000000060000000100604d54726b0000002400ff03055069616e6f00ff510307a12000ff58040402180800903c4060803c0000ff2f00"
encoding = "hex"
mode = "scale"
bpm = "120"
factor = "0.75"
tempo_map = "scale"
keep_duration = "false"

[[example]]
label = "Double speed"
[example.params]
input = "4d546864000000060000000100604d54726b0000002400ff03055069616e6f00ff510307a12000ff58040402180800903c4060803c0000ff2f00"
encoding = "hex"
mode = "scale"
bpm = "120"
factor = "2.0"
tempo_map = "scale"
keep_duration = "false"

[[example]]
label = "Flatten to one steady 100 BPM"
[example.params]
input = "4d546864000000060000000100604d54726b0000002400ff03055069616e6f00ff510307a12000ff58040402180800903c4060803c0000ff2f00"
encoding = "hex"
mode = "set-bpm"
bpm = "100"
factor = "1.0"
tempo_map = "flatten"
keep_duration = "false"

[[example]]
label = "Match a 90 BPM project, same playing time"
[example.params]
input = "4d546864000000060000000100604d54726b0000002400ff03055069616e6f00ff510307a12000ff58040402180800903c4060803c0000ff2f00"
encoding = "hex"
mode = "set-bpm"
bpm = "90"
factor = "1.0"
tempo_map = "scale"
keep_duration = "true"

[[example]]
label = "Base64 input — auto-detected"
[example.params]
input = "TVRoZAAAAAYAAAABAGBNVHJrAAAAJAD/AwVQaWFubwD/UQMHoSAA/1gEBAIYCACQPEBggDwAAP8vAA=="
encoding = "auto"
mode = "set-bpm"
bpm = "240"
factor = "1.0"
tempo_map = "scale"
keep_duration = "false"

name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HTTP_MULTIPLEXING: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout gizza-ai
        uses: actions/checkout@v4
        with:
          path: gizza-ai
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Detect changed blocks
        id: changed
        working-directory: gizza-ai
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Keep PR feedback fast: validate blocks touched by the PR head commit
            # (checkout uses github.event.pull_request.head.sha). The full
            # all-block build still runs on pushes to main.
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              diff_base="HEAD^"
            else
              base_ref="${{ github.base_ref }}"
              git fetch origin "$base_ref" --depth=1
              diff_base="origin/$base_ref"
            fi
            # Only rebuild/re-test a block's wasm when a file that affects the
            # compiled output or its cargo tests changed. Doc/metadata edits —
            # page/ (rendered by tools/generator) and manifest.json (consumed by
            # the parent build.rs) — don't change the wasm or the block's cargo
            # tests and are validated by the always-on hygiene gate + generator
            # tests, so they don't warrant a per-block rebuild. tests/ is NOT
            # excluded: a future tests/*.rs integration test must still run.
            mapfile -t blocks < <(git diff --name-only "$diff_base...HEAD" \
              | grep -vE '^blocks/[^/]*/(target/block\.wasm$|web/pkg/|page/|manifest\.json$)' \
              | sed -n 's#^blocks/\([^/]*\)/.*#\1#p' \
              | sort -u)
          else
            blocks=()
          fi

          printf 'Changed blocks: %s\n' "${blocks[*]:-(none)}"
          {
            echo 'blocks<<EOF'
            printf '%s\n' "${blocks[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Tool hygiene gate
        working-directory: gizza-ai
        shell: bash
        run: python3 scripts/check-tool-hygiene.py

      - name: Read solobase pin
        id: pin
        run: echo "solobase_sha=$(cat gizza-ai/solobase-pin.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Read wafer-run pin
        id: waferpin
        run: echo "wafer_sha=$(cat gizza-ai/wafer-run-pin.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Checkout solobase
        uses: actions/checkout@v4
        with:
          repository: suppers-ai/solobase
          ref: ${{ steps.pin.outputs.solobase_sha }}
          path: solobase

      - name: Checkout wafer-run
        # Pinned via wafer-run-pin.txt — see deploy.yml for the rationale.
        uses: actions/checkout@v4
        with:
          repository: wafer-run/wafer-run
          ref: ${{ steps.waferpin.outputs.wafer_sha }}
          path: wafer-run

      - name: Verify wafer-run pin consistency
        # Same guard as deploy.yml, but running on every PR so a half-bumped
        # pin (wafer-run-pin.txt vs the committed Cargo.lock files vs the
        # solobase pin) is caught before merge, not at deploy time.
        shell: bash
        run: |
          set -euo pipefail
          pin="$(tr -d '[:space:]' < gizza-ai/wafer-run-pin.txt)"
          fail=0
          for lock in gizza-ai/Cargo.lock gizza-ai/cli/Cargo.lock gizza-ai/block-utils/Cargo.lock solobase/Cargo.lock; do
            shas="$(grep -o 'github.com/wafer-run/wafer-run[^"]*#[0-9a-f]*' "$lock" | sed 's/.*#//' | sort -u)"
            if [ "$shas" != "$pin" ]; then
              echo "::error::$lock pins wafer-run at '${shas:-<none>}' but wafer-run-pin.txt says '$pin'."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Bump procedure: update wafer-run-pin.txt, run 'cargo update' in gizza-ai/, cli/, and block-utils/, and point solobase-pin.txt at a solobase commit whose Cargo.lock pins the same wafer-run sha."
            exit 1
          fi
          echo "All lockfiles agree with wafer-run-pin.txt ($pin)."

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pin explicitly. With no version the action resolves "latest" via
          # the GitHub API and falls back to its ancient hardcoded default
          # (v0.9.1) whenever that lookup flakes/rate-limits — and v0.9.1
          # cannot parse workspace-inherited manifest fields like
          # `license.workspace = true`, failing with "invalid type: map,
          # expected a string for key `package.license`".
          version: 'v0.15.0'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gizza-ai
            solobase
            wafer-run

      - name: Build solobase-web wasm
        working-directory: solobase
        run: wasm-pack build crates/solobase-web --target web --release --out-dir pkg

      - name: Build solobase + wafer CLIs
        run: |
          cargo install --path solobase/crates/solobase --locked
          cargo install --path wafer-run/crates/wafer-cli --locked

      - name: Audit missing skill wasm artifacts
        if: github.event_name != 'pull_request'
        working-directory: gizza-ai
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for manifest in blocks/*/manifest.json; do
            block="$(basename "$(dirname "$manifest")")"
            if [ ! -f "blocks/$block/target/block.wasm" ]; then
              missing=$((missing + 1))
            fi
          done
          echo "Missing committed blocks/*/target/block.wasm artifacts: $missing"
          echo "Skipping rebuild here; deploy reuses committed artifacts and standalone tool pages are generated separately."

      - name: Build skill wasms (full)
        if: github.event_name != 'pull_request'
        working-directory: gizza-ai
        run: SOLOBASE_SKIP_BLOCK_BUILD=1 solobase build

      - name: Build changed skill wasms
        if: github.event_name == 'pull_request'
        working-directory: gizza-ai
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r block; do
            [ -n "$block" ] || continue
            echo "Building changed block: $block"
            (
              cd "blocks/$block"
              cargo build --target wasm32-wasip1 --release
              wasm="$(find target/wasm32-wasip1/release -maxdepth 1 -type f -name '*.wasm' | head -n 1)"
              if [ -z "$wasm" ]; then
                echo "No wasm artifact produced for blocks/$block" >&2
                exit 1
              fi
              mkdir -p target
              cp "$wasm" target/block.wasm
            )
          done <<< "${{ steps.changed.outputs.blocks }}"

      - name: Cargo tests
        # Root crate tests (lazy_skill lifecycle, skills_embed, agent, …) run
        # on PRs too: repo-level regressions used to surface only after merge.
        working-directory: gizza-ai
        run: cargo test

      - name: Changed block Cargo tests
        if: github.event_name == 'pull_request'
        working-directory: gizza-ai
        shell: bash
        run: |
          set -euo pipefail
          ran=0
          while IFS= read -r block; do
            [ -n "$block" ] || continue
            ran=1
            if [ -f "blocks/$block/core/Cargo.toml" ]; then
              cargo test --manifest-path "blocks/$block/core/Cargo.toml"
            fi
            cargo test --manifest-path "blocks/$block/Cargo.toml"
          done <<< "${{ steps.changed.outputs.blocks }}"
          if [ "$ran" -eq 0 ]; then
            echo "No block changes detected; skipping block-specific Cargo tests."
          fi

      - name: CLI tests
        working-directory: gizza-ai
        run: cargo test --manifest-path cli/Cargo.toml

      - name: Tool-page generator tests
        working-directory: gizza-ai
        run: cargo test --manifest-path tools/generator/Cargo.toml

      - name: SEO generator tests
        working-directory: gizza-ai
        run: bash scripts/gen-seo.test.sh

      - name: Tool hygiene gate self-test
        working-directory: gizza-ai
        run: bash scripts/check-tool-hygiene.test.sh

      - name: Chrome crate tests
        working-directory: gizza-ai
        run: cargo test --manifest-path chrome/Cargo.toml

      - name: block-utils tests
        working-directory: gizza-ai
        run: cargo test --manifest-path block-utils/Cargo.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS tests
        # The sw-bypass tests need the solobase-built pkg/sw.js: on main
        # pushes (pkg built above) REQUIRE_BUILT_PKG makes a missing artifact
        # a failure; on PRs (no app build) those two tests self-skip.
        working-directory: gizza-ai
        env:
          REQUIRE_BUILT_PKG: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Build changed tool pages
        # Standalone tool pages are self-contained under pkg/tools/<slug>/
        # (web wasm + generator output) — no app/solobase build needed. The
        # generator regenerates all pages but only warns for tools whose
        # web/pkg is absent (it copies wasm only for the ones built here).
        if: github.event_name == 'pull_request'
        working-directory: gizza-ai
        shell: bash
        run: |
          set -euo pipefail
          built=0
          while IFS= read -r block; do
            [ -n "$block" ] || continue
            if [ ! -d "blocks/$block/web" ]; then
              echo "blocks/$block has no web/ crate — skipping"
              continue
            fi
            echo "Building web wasm for $block"
            wasm-pack build "blocks/$block/web" --target web --release --out-dir pkg
            built=$((built + 1))
          done <<< "${{ steps.changed.outputs.blocks }}"
          if [ "$built" -eq 0 ]; then
            echo "No changed tool web crates; skipping page generation."
            exit 0
          fi
          cargo run --manifest-path tools/generator/Cargo.toml -- .

      - name: Changed tool-page Playwright tests
        # Playwright runs headless (the fixtures only go headed under HEADED=1
        # for WebLLM/WebGPU specs, which are not in this set). The webServer in
        # playwright.config.ts serves ../pkg on :8001 automatically.
        if: github.event_name == 'pull_request'
        working-directory: gizza-ai/tests
        shell: bash
        run: |
          set -euo pipefail
          specs=()
          while IFS= read -r block; do
            [ -n "$block" ] || continue
            if [ -f "tool-page-$block.spec.ts" ]; then
              specs+=("tool-page-$block.spec.ts")
            else
              echo "No Playwright spec for changed block '$block'"
            fi
          done <<< "${{ steps.changed.outputs.blocks }}"
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "No changed tool-page specs; skipping Playwright."
            exit 0
          fi
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test "${specs[@]}"

      - name: Generate tool pages (full)
        # Renders the /tools/ hub pages into pkg/tools/ — the landing-chooser
        # smoke below asserts the chooser's Tools button lands on a real hub.
        # (The generator only warns for tools without a built web/pkg.)
        if: github.event_name != 'pull_request'
        working-directory: gizza-ai
        run: cargo run --manifest-path tools/generator/Cargo.toml -- .

      - name: Landing-chooser Playwright smoke
        # Guards the static chooser page in the pkg/ that "Build skill wasms
        # (full)" produced above — main-push only (PRs don't build the app pkg).
        if: github.event_name != 'pull_request'
        working-directory: gizza-ai/tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test landing-chooser.spec.ts

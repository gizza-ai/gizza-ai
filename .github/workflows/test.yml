name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HTTP_MULTIPLEXING: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout gizza-ai
        uses: actions/checkout@v4
        with:
          path: gizza-ai
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Detect changed blocks
        id: changed
        working-directory: gizza-ai
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Keep PR feedback fast: validate blocks touched by the PR head commit
            # (checkout uses github.event.pull_request.head.sha). The full
            # all-block build still runs on pushes to main.
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              diff_base="HEAD^"
            else
              base_ref="${{ github.base_ref }}"
              git fetch origin "$base_ref" --depth=1
              diff_base="origin/$base_ref"
            fi
            mapfile -t blocks < <(git diff --name-only "$diff_base...HEAD" \
              | sed -n 's#^blocks/\([^/]*\)/.*#\1#p' \
              | sort -u)
          else
            blocks=()
          fi

          printf 'Changed blocks: %s\n' "${blocks[*]:-(none)}"
          {
            echo 'blocks<<EOF'
            printf '%s\n' "${blocks[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Read solobase pin
        id: pin
        run: echo "solobase_sha=$(cat gizza-ai/solobase-pin.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Checkout solobase
        uses: actions/checkout@v4
        with:
          repository: suppers-ai/solobase
          ref: ${{ steps.pin.outputs.solobase_sha }}
          path: solobase

      - name: Checkout wafer-run
        uses: actions/checkout@v4
        with:
          repository: wafer-run/wafer-run
          ref: main
          path: wafer-run

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pin explicitly. With no version the action resolves "latest" via
          # the GitHub API and falls back to its ancient hardcoded default
          # (v0.9.1) whenever that lookup flakes/rate-limits — and v0.9.1
          # cannot parse workspace-inherited manifest fields like
          # `license.workspace = true`, failing with "invalid type: map,
          # expected a string for key `package.license`".
          version: 'v0.15.0'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gizza-ai
            solobase
            wafer-run

      - name: Build solobase-web wasm
        working-directory: solobase
        run: wasm-pack build crates/solobase-web --target web --release --out-dir pkg

      - name: Build solobase + wafer CLIs
        run: |
          cargo install --path solobase/crates/solobase --locked
          cargo install --path wafer-run/crates/wafer-cli --locked

      - name: Build missing skill wasm artifacts
        if: github.event_name != 'pull_request'
        working-directory: gizza-ai
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_BUILD_JOBS=1
          export CARGO_TARGET_DIR="$RUNNER_TEMP/gizza-block-target"
          mkdir -p "$CARGO_TARGET_DIR"
          for manifest in blocks/*/manifest.json; do
            block="$(basename "$(dirname "$manifest")")"
            if [ -f "blocks/$block/target/block.wasm" ]; then
              echo "target/block.wasm exists for $block — skipping block build"
              continue
            fi
            echo "building missing target/block.wasm for $block with shared CARGO_TARGET_DIR"
            before="$(mktemp)"
            find "$CARGO_TARGET_DIR/wasm32-wasip1/release" -maxdepth 1 -type f -name '*.wasm' -printf '%T@ %p\n' 2>/dev/null | sort -n > "$before" || true
            cargo build --manifest-path "blocks/$block/Cargo.toml" --target wasm32-wasip1 --release
            wasm="$(comm -13 "$before" <(find "$CARGO_TARGET_DIR/wasm32-wasip1/release" -maxdepth 1 -type f -name '*.wasm' -printf '%T@ %p\n' | sort -n) | tail -1 | cut -d' ' -f2-)"
            if [ -z "$wasm" ]; then
              wasm="$(find "$CARGO_TARGET_DIR/wasm32-wasip1/release" -maxdepth 1 -type f -name '*.wasm' -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)"
            fi
            if [ -z "$wasm" ] || [ ! -f "$wasm" ]; then
              echo "No wasm artifact found for $block" >&2
              exit 1
            fi
            mkdir -p "blocks/$block/target"
            cp "$wasm" "blocks/$block/target/block.wasm"
            rm -f "$before"
          done

      - name: Build skill wasms (full)
        if: github.event_name != 'pull_request'
        working-directory: gizza-ai
        run: SOLOBASE_SKIP_BLOCK_BUILD=1 solobase build

      - name: Build changed skill wasms
        if: github.event_name == 'pull_request'
        working-directory: gizza-ai
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r block; do
            [ -n "$block" ] || continue
            echo "Building changed block: $block"
            (
              cd "blocks/$block"
              cargo build --target wasm32-wasip1 --release
              wasm="$(find target/wasm32-wasip1/release -maxdepth 1 -type f -name '*.wasm' | head -n 1)"
              if [ -z "$wasm" ]; then
                echo "No wasm artifact produced for blocks/$block" >&2
                exit 1
              fi
              mkdir -p target
              cp "$wasm" target/block.wasm
            )
          done <<< "${{ steps.changed.outputs.blocks }}"

      - name: Cargo tests
        if: github.event_name != 'pull_request'
        working-directory: gizza-ai
        run: cargo test

      - name: Changed block Cargo tests
        if: github.event_name == 'pull_request'
        working-directory: gizza-ai
        shell: bash
        run: |
          set -euo pipefail
          ran=0
          while IFS= read -r block; do
            [ -n "$block" ] || continue
            ran=1
            if [ -f "blocks/$block/core/Cargo.toml" ]; then
              cargo test --manifest-path "blocks/$block/core/Cargo.toml"
            fi
            cargo test --manifest-path "blocks/$block/Cargo.toml"
          done <<< "${{ steps.changed.outputs.blocks }}"
          if [ "$ran" -eq 0 ]; then
            echo "No block changes detected; skipping block-specific Cargo tests."
          fi

      - name: CLI tests
        if: github.event_name != 'pull_request'
        working-directory: gizza-ai
        run: cargo test --manifest-path cli/Cargo.toml

      - name: Tool-page generator tests
        working-directory: gizza-ai
        run: cargo test --manifest-path tools/generator/Cargo.toml

      - name: SEO generator tests
        working-directory: gizza-ai
        run: bash scripts/gen-seo.test.sh

      - name: Chrome crate tests
        if: github.event_name != 'pull_request'
        working-directory: gizza-ai
        run: cargo test --manifest-path chrome/Cargo.toml

      - name: block-utils tests
        working-directory: gizza-ai
        run: cargo test --manifest-path block-utils/Cargo.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS tests
        if: github.event_name != 'pull_request'
        working-directory: gizza-ai
        run: |
          npm install --no-audit --no-fund
          npm test

name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HTTP_MULTIPLEXING: false
  # One shared target dir for every cargo invocation in the job. Each
  # blocks/<slug>/ is a standalone crate; with per-crate target/ dirs a
  # bulk PR (tool batches, cross-cutting block edits) recompiles the
  # common dependency tree once per block and needs ~250MB of disk per
  # block — a 100+-block PR exceeds the runner's disk and the job time
  # limit. One shared dir compiles common deps once and reuses them
  # across blocks (mirrors the local-dev shared-target setup).
  CARGO_TARGET_DIR: /tmp/shared-cargo-target

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Detect changed blocks
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Keep PR feedback fast: validate blocks touched by the PR head commit
            # (checkout uses github.event.pull_request.head.sha). The full
            # all-block build still runs on pushes to main.
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              diff_base="HEAD^"
            else
              base_ref="${{ github.base_ref }}"
              git fetch origin "$base_ref" --depth=1
              diff_base="origin/$base_ref"
            fi
            # Only rebuild/re-test a block's wasm when a file that affects the
            # compiled output or its cargo tests changed. Doc/metadata edits —
            # page/ (rendered by tools/generator) and manifest.json (consumed by
            # the parent build.rs) — don't change the wasm or the block's cargo
            # tests and are validated by the always-on hygiene gate + generator
            # tests, so they don't warrant a per-block rebuild. tests/ is NOT
            # excluded: a future tests/*.rs integration test must still run.
            mapfile -t blocks < <(git diff --name-only "$diff_base...HEAD" \
              | grep -vE '^blocks/[^/]*/(target/block\.wasm$|web/pkg/|page/|manifest\.json$)' \
              | sed -n 's#^blocks/\([^/]*\)/.*#\1#p' \
              | sort -u)
          else
            blocks=()
          fi

          printf 'Changed blocks: %s\n' "${blocks[*]:-(none)}"
          {
            echo 'blocks<<EOF'
            printf '%s\n' "${blocks[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Tool hygiene gate
        shell: bash
        run: python3 scripts/check-tool-hygiene.py

      - name: Read wafer-run pin
        id: waferpin
        run: echo "wafer_sha=$(cat wafer-run-pin.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Verify wafer-run pin consistency
        # Guards against a half-bumped pin: wafer-run-pin.txt vs the committed
        # Cargo.lock files that pin the wafer-run git dep.
        shell: bash
        run: |
          set -euo pipefail
          pin="$(tr -d '[:space:]' < wafer-run-pin.txt)"
          fail=0
          for lock in cli/Cargo.lock block-utils/Cargo.lock; do
            shas="$(grep -o 'github.com/wafer-run/wafer-run[^"]*#[0-9a-f]*' "$lock" | sed 's/.*#//' | sort -u)"
            if [ "$shas" != "$pin" ]; then
              echo "::error::$lock pins wafer-run at '${shas:-<none>}' but wafer-run-pin.txt says '$pin'."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Bump procedure: update wafer-run-pin.txt, then run 'cargo update' in cli/ and block-utils/."
            exit 1
          fi
          echo "All lockfiles agree with wafer-run-pin.txt ($pin)."

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pin explicitly. With no version the action resolves "latest" via
          # the GitHub API and falls back to its ancient hardcoded default
          # (v0.9.1) whenever that lookup flakes/rate-limits — and v0.9.1
          # cannot parse workspace-inherited manifest fields like
          # `license.workspace = true`, failing with "invalid type: map,
          # expected a string for key `package.license`".
          version: 'v0.15.0'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          # rust-cache follows CARGO_TARGET_DIR; the shared dir for a bulk
          # block PR runs to tens of GB, which would thrash the 10GB repo
          # cache quota. Cache the registry/git checkouts only.
          cache-targets: false

      - name: Audit missing skill wasm artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for manifest in blocks/*/manifest.json; do
            block="$(basename "$(dirname "$manifest")")"
            if [ ! -f "blocks/$block/target/block.wasm" ]; then
              missing=$((missing + 1))
            fi
          done
          echo "Missing committed blocks/*/target/block.wasm artifacts: $missing"
          echo "Skipping rebuild here; standalone tool pages are generated separately."

      - name: Build changed skill wasms
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r block; do
            [ -n "$block" ] || continue
            echo "Building changed block: $block"
            (
              cd "blocks/$block"
              # With the shared CARGO_TARGET_DIR the artifact no longer lands
              # under the block's own target/ — take its path from cargo's
              # JSON message stream instead of find(1).
              wasm="$(cargo build --target wasm32-wasip1 --release --message-format=json \
                | jq -r 'select(.reason=="compiler-artifact") | .filenames[] | select(endswith(".wasm"))' \
                | tail -n 1)"
              if [ -z "$wasm" ]; then
                echo "No wasm artifact produced for blocks/$block" >&2
                exit 1
              fi
              mkdir -p target
              cp "$wasm" target/block.wasm
            )
          done <<< "${{ steps.changed.outputs.blocks }}"

      - name: Changed block Cargo tests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ran=0
          while IFS= read -r block; do
            [ -n "$block" ] || continue
            ran=1
            if [ -f "blocks/$block/core/Cargo.toml" ]; then
              cargo test --manifest-path "blocks/$block/core/Cargo.toml"
            fi
            cargo test --manifest-path "blocks/$block/Cargo.toml"
          done <<< "${{ steps.changed.outputs.blocks }}"
          if [ "$ran" -eq 0 ]; then
            echo "No block changes detected; skipping block-specific Cargo tests."
          fi

      - name: CLI tests
        run: cargo test --manifest-path cli/Cargo.toml

      - name: Tool-page generator tests
        run: cargo test --manifest-path tools/generator/Cargo.toml

      - name: Tool hygiene gate self-test
        run: bash scripts/check-tool-hygiene.test.sh

      - name: block-utils tests
        run: cargo test --manifest-path block-utils/Cargo.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS tests
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Build changed tool pages
        # Standalone tool pages are self-contained under pkg/tools/<slug>/
        # (web wasm + generator output) — no app build needed. The generator
        # regenerates all pages but only warns for tools whose web/pkg is
        # absent (it copies wasm only for the ones built here).
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          built=0
          while IFS= read -r block; do
            [ -n "$block" ] || continue
            if [ ! -d "blocks/$block/web" ]; then
              echo "blocks/$block has no web/ crate — skipping"
              continue
            fi
            echo "Building web wasm for $block"
            wasm-pack build "blocks/$block/web" --target web --release --out-dir pkg
            built=$((built + 1))
          done <<< "${{ steps.changed.outputs.blocks }}"
          if [ "$built" -eq 0 ]; then
            echo "No changed tool web crates; skipping page generation."
            exit 0
          fi
          cargo run --manifest-path tools/generator/Cargo.toml -- .

      - name: Changed tool-page Playwright tests
        # Playwright runs headless (the fixtures only go headed under HEADED=1
        # for WebLLM/WebGPU specs, which are not in this set). The webServer in
        # playwright.config.ts serves ../pkg on :8001 automatically.
        if: github.event_name == 'pull_request'
        working-directory: tests
        shell: bash
        run: |
          set -euo pipefail
          specs=()
          while IFS= read -r block; do
            [ -n "$block" ] || continue
            if [ -f "tool-page-$block.spec.ts" ]; then
              specs+=("tool-page-$block.spec.ts")
            else
              echo "No Playwright spec for changed block '$block'"
            fi
          done <<< "${{ steps.changed.outputs.blocks }}"
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "No changed tool-page specs; skipping Playwright."
            exit 0
          fi
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test "${specs[@]}"

      - name: Generate tool pages (full)
        # Renders every block's page/ into pkg/tools/<slug>/, generic (no site
        # config — this repo has none).
        if: github.event_name != 'pull_request'
        run: cargo run --manifest-path tools/generator/Cargo.toml -- .

      - name: Tool pages Playwright test (full)
        if: github.event_name != 'pull_request'
        working-directory: tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test tool_pages.spec.ts

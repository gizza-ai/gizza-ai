name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HTTP_MULTIPLEXING: false
  # One shared target dir for every cargo invocation in a job. Each
  # blocks/<slug>/ is a standalone crate; with per-crate target/ dirs a
  # bulk PR (tool batches, cross-cutting block edits) recompiles the
  # common dependency tree once per block and needs ~250MB of disk per
  # block — a 100+-block PR exceeds the runner's disk and the job time
  # limit. One shared dir compiles common deps once and reuses them
  # across blocks (mirrors the local-dev shared-target setup).
  CARGO_TARGET_DIR: /tmp/shared-cargo-target

jobs:
  # ---------------------------------------------------------------------------
  # Which blocks did this PR touch, and how many shards should validate them?
  # Kept as its own job so the per-block work below can fan out: a generated
  # tool batch changes 300+ blocks, and one runner cannot rebuild, test and
  # render that many inside the 6h job limit.
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      blocks: ${{ steps.changed.outputs.blocks }}
      count: ${{ steps.changed.outputs.count }}
      matrix: ${{ steps.changed.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Detect changed blocks
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Keep PR feedback fast: validate blocks touched by the PR head commit
            # (checkout uses github.event.pull_request.head.sha).
            # NOTE: on push to main the block list is empty (see the else branch
            # below), so per-block cargo tests run ONLY on PRs — this workflow does
            # no all-block sweep on main. The full block cargo suite (and the full
            # tool-page Playwright suite) is swept nightly, sharded, by
            # .github/workflows/nightly-blocks.yml.
            # Diff against the MERGE-BASE of the PR target branch and HEAD, not
            # HEAD^. HEAD^ only sees the PR's final commit, so on a multi-commit
            # PR block changes made in earlier commits escape detection (and their
            # blocks never get rebuilt/re-tested). fetch-depth:0 (checkout above)
            # gives full head history; fetch the base branch too (no --depth, so
            # the common ancestor is reachable) and take the merge-base.
            base_ref="${{ github.base_ref }}"
            git fetch --no-tags origin "$base_ref"
            diff_base="$(git merge-base "origin/$base_ref" HEAD)"
            mapfile -t changed_paths < <(git diff --name-only "$diff_base...HEAD")

            # Browser wasm-pack output is disposable. A force-added web/pkg
            # bundle bypasses source review and grows the repository forever;
            # CI/deploy rebuild the package from web/src instead. Allow
            # deletions so legacy tracked bundles can be migrated out.
            web_pkg_changes="$(
              git diff --diff-filter=ACMRT --name-only "$diff_base...HEAD" \
                | grep -E '^blocks/[^/]*/web/pkg/' || true
            )"
            if [ -n "$web_pkg_changes" ]; then
              echo "::error::Do not commit generated blocks/*/web/pkg files."
              echo "$web_pkg_changes"
              echo "Keep web/src + Cargo.toml; CI and deploy run wasm-pack."
              exit 1
            fi

            # Only rebuild/re-test a block's wasm when a file that affects the
            # compiled output or its cargo tests changed. Doc/metadata edits —
            # page/ (rendered by tools/generator) and manifest.json (consumed by
            # the parent build.rs) — don't change the wasm or the block's cargo
            # tests and are validated by the always-on hygiene gate + generator
            # tests, so they don't warrant a per-block rebuild. Cargo.lock and
            # target/block.wasm ARE included: an artifact-only repair must still
            # be rebuilt and compared with its canonical locked source build.
            # tests/ is NOT excluded: a future tests/*.rs integration test must
            # still run.
            mapfile -t blocks < <(printf '%s\n' "${changed_paths[@]}" \
              | grep -vE '^blocks/[^/]*/(web/pkg/|page/|manifest\.json$)' \
              | sed -n 's#^blocks/\([^/]*\)/.*#\1#p' \
              | sort -u)
          else
            blocks=()
          fi

          count="${#blocks[@]}"
          printf 'Changed blocks (%s): %s\n' "$count" "${blocks[*]:-(none)}"

          # One shard per ~3 blocks, capped at 16 so a 300-block batch still
          # fits the runner concurrency budget (~19 blocks/shard, ~1h).
          if [ "$count" -eq 0 ]; then
            shards=0
            matrix='[]'
          else
            shards=$(( (count + 2) / 3 ))
            [ "$shards" -le 16 ] || shards=16
            matrix="$(seq 0 $((shards - 1)) | python3 -c 'import sys, json; print(json.dumps([int(x) for x in sys.stdin.read().split()]))')"
          fi
          echo "Shards: $shards"

          {
            echo "count=$count"
            echo "matrix=$matrix"
            echo "blocks=${blocks[*]:-}"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Repository-wide gates and test suites. Independent of which blocks changed,
  # so they run once instead of once per shard.
  # ---------------------------------------------------------------------------
  repo:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Tool hygiene gate
        shell: bash
        run: python3 scripts/check-tool-hygiene.py

      - name: Artifact tooling syntax
        shell: bash
        run: bash -n scripts/build-block-wasm.sh

      - name: Verify wafer-run pin consistency
        # Guards against a half-bumped pin: wafer-run-pin.txt vs every
        # committed Cargo.lock that pins the wafer-run git dependency. Legacy
        # blocks may not have a tracked lock yet; new and changed blocks must.
        shell: bash
        run: |
          set -euo pipefail
          pin="$(tr -d '[:space:]' < wafer-run-pin.txt)"
          fail=0
          for lock in cli/Cargo.lock block-utils/Cargo.lock $(git ls-files 'blocks/*/Cargo.lock'); do
            shas="$(grep -o 'github.com/wafer-run/wafer-run[^"]*#[0-9a-f]*' "$lock" | sed 's/.*#//' | sort -u)"
            if [ "$shas" != "$pin" ]; then
              echo "::error::$lock pins wafer-run at '${shas:-<none>}' but wafer-run-pin.txt says '$pin'."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Bump procedure: update wafer-run-pin.txt, then refresh cli/ and block-utils/ locks."
            echo "For each affected block, run scripts/build-block-wasm.sh <slug> and commit its lock + artifact."
            exit 1
          fi
          echo "All lockfiles agree with wafer-run-pin.txt ($pin)."

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.0'
          targets: wasm32-unknown-unknown,wasm32-wasip1
          components: rust-src

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pin explicitly. With no version the action resolves "latest" via
          # the GitHub API and falls back to its ancient hardcoded default
          # (v0.9.1) whenever that lookup flakes/rate-limits — and v0.9.1
          # cannot parse workspace-inherited manifest fields like
          # `license.workspace = true`, failing with "invalid type: map,
          # expected a string for key `package.license`".
          version: 'v0.15.0'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          # rust-cache follows CARGO_TARGET_DIR; the shared dir for a bulk
          # block PR runs to tens of GB, which would thrash the 10GB repo
          # cache quota. Cache the registry/git checkouts only.
          cache-targets: false
          key: repo

      - name: Audit legacy artifact coverage
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          missing_wasm=0
          missing_locks=0
          for manifest in blocks/*/manifest.json; do
            block="$(basename "$(dirname "$manifest")")"
            if [ ! -f "blocks/$block/target/block.wasm" ]; then
              missing_wasm=$((missing_wasm + 1))
            fi
            if ! git ls-files --error-unmatch "blocks/$block/Cargo.lock" >/dev/null 2>&1; then
              missing_locks=$((missing_locks + 1))
            fi
          done
          echo "Legacy blocks without committed target/block.wasm: $missing_wasm"
          echo "Legacy blocks without committed Cargo.lock: $missing_locks"
          echo "New or changed blocks are required to commit and verify both files."

      - name: CLI tests
        run: cargo test --manifest-path cli/Cargo.toml

      - name: Tool-page generator tests
        run: cargo test --manifest-path tools/generator/Cargo.toml

      - name: Tool hygiene gate self-test
        run: bash scripts/check-tool-hygiene.test.sh

      - name: block-utils tests
        run: cargo test --manifest-path block-utils/Cargo.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JS tests
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # Runner network flakes are the dominant failure mode of a 16-shard
          # fan-out: one morning's run lost five shards to an apt mirror that
          # stalled `playwright install --with-deps` for three hours, and two
          # more to the npm registry timing out. Retry, and bound anything that
          # can hang so a flake costs minutes instead of a runner-hour.
          retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 3 ]; then
                echo "::error::failed after $n attempts: $*"
                return 1
              fi
              echo "attempt $n failed, retrying in 15s: $*"
              n=$((n + 1))
              sleep 15
            done
          }
          # --with-deps shells out to apt-get; fall back to the browser-only
          # install, since the runner image already ships chromium's libraries.
          install_chromium() {
            timeout 300s npx playwright install --with-deps chromium \
              || timeout 300s npx playwright install chromium
          }
          retry npm install --no-audit --no-fund
          npm test

      - name: Generate tool pages (full)
        # Renders every block's page/ into pkg/tools/<slug>/, generic (no site
        # config — this repo has none).
        if: github.event_name != 'pull_request'
        run: cargo run --manifest-path tools/generator/Cargo.toml -- .

      - name: Tool pages Playwright test (full)
        timeout-minutes: 120
        if: github.event_name != 'pull_request'
        working-directory: tests
        shell: bash
        run: |
          set -euo pipefail
          # Runner network flakes are the dominant failure mode of a 16-shard
          # fan-out: one morning's run lost five shards to an apt mirror that
          # stalled `playwright install --with-deps` for three hours, and two
          # more to the npm registry timing out. Retry, and bound anything that
          # can hang so a flake costs minutes instead of a runner-hour.
          retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 3 ]; then
                echo "::error::failed after $n attempts: $*"
                return 1
              fi
              echo "attempt $n failed, retrying in 15s: $*"
              n=$((n + 1))
              sleep 15
            done
          }
          # --with-deps shells out to apt-get; fall back to the browser-only
          # install, since the runner image already ships chromium's libraries.
          install_chromium() {
            timeout 300s npx playwright install --with-deps chromium \
              || timeout 300s npx playwright install chromium
          }
          retry npm install --no-audit --no-fund
          retry install_chromium
          npx playwright test tool_pages.spec.ts

  # ---------------------------------------------------------------------------
  # Per-block validation for the blocks this PR touched, fanned out over shards.
  # Each shard owns a deterministic slice (round-robin over the sorted list) and
  # runs the full per-block chain for it: canonical WASM verification, cargo
  # tests, browser wasm + tool-page Playwright.
  # ---------------------------------------------------------------------------
  blocks:
    needs: detect
    if: success() && needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.detect.outputs.matrix) }}
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ strategy.job-total }}
      CHANGED_BLOCKS: ${{ needs.detect.outputs.blocks }}
    steps:
      - name: Free Disk Space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.0'
          targets: wasm32-unknown-unknown,wasm32-wasip1
          components: rust-src

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-targets: false
          key: pr-blocks-${{ matrix.shard }}

      - name: Select shard
        id: shard
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t mine < <(printf '%s\n' $CHANGED_BLOCKS | awk -v s="$SHARD_INDEX" -v n="$SHARD_TOTAL" 'NR % n == s')
          echo "shard $SHARD_INDEX of $SHARD_TOTAL owns ${#mine[@]} block(s): ${mine[*]:-(none)}"
          echo "slugs=${mine[*]:-}" >> "$GITHUB_OUTPUT"

      - name: Verify changed skill WASM artifacts
        shell: bash
        run: |
          set -euo pipefail
          for block in ${{ steps.shard.outputs.slugs }}; do
            echo "::group::verify $block"
            scripts/build-block-wasm.sh "$block" --check
            echo "::endgroup::"
          done

      - name: Changed block Cargo tests
        shell: bash
        run: |
          set -euo pipefail
          for block in ${{ steps.shard.outputs.slugs }}; do
            echo "::group::test $block"
            if [ -f "blocks/$block/core/Cargo.toml" ]; then
              cargo test --manifest-path "blocks/$block/core/Cargo.toml"
            fi
            cargo test --manifest-path "blocks/$block/Cargo.toml"
            echo "::endgroup::"
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install generator dependencies
        # The generator copies the @huggingface/transformers runtime out of the
        # root node_modules for model-backed tool pages and hard-errors when it
        # is absent. It used to ride along on the "JS tests" npm install, which
        # now runs in the `repo` job, so this shard has to install its own.
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          # Runner network flakes are the dominant failure mode of a 16-shard
          # fan-out: one morning's run lost five shards to an apt mirror that
          # stalled `playwright install --with-deps` for three hours, and two
          # more to the npm registry timing out. Retry, and bound anything that
          # can hang so a flake costs minutes instead of a runner-hour.
          retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 3 ]; then
                echo "::error::failed after $n attempts: $*"
                return 1
              fi
              echo "attempt $n failed, retrying in 15s: $*"
              n=$((n + 1))
              sleep 15
            done
          }
          # --with-deps shells out to apt-get; fall back to the browser-only
          # install, since the runner image already ships chromium's libraries.
          install_chromium() {
            timeout 300s npx playwright install --with-deps chromium \
              || timeout 300s npx playwright install chromium
          }
          retry npm install --no-audit --no-fund

      - name: Build changed tool pages
        # Standalone tool pages are self-contained under pkg/tools/<slug>/
        # (web wasm + generator output) — no app build needed. The generator
        # regenerates all pages but only warns for tools whose web/pkg is
        # absent (it copies wasm only for the ones built here).
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          built=0
          for block in ${{ steps.shard.outputs.slugs }}; do
            if [ ! -d "blocks/$block/web" ]; then
              echo "blocks/$block has no web/ crate — skipping"
              continue
            fi
            echo "Building web wasm for $block"
            wasm-pack build "blocks/$block/web" --target web --release --out-dir pkg
            built=$((built + 1))
          done
          echo "built=$built" >> "$GITHUB_OUTPUT"
          if [ "$built" -eq 0 ]; then
            echo "No changed tool web crates in this shard; skipping page generation."
            exit 0
          fi
          cargo run --manifest-path tools/generator/Cargo.toml -- .

      - name: Changed tool-page Playwright tests
        timeout-minutes: 60
        # Playwright runs headless (the fixtures only go headed under HEADED=1
        # for WebLLM/WebGPU specs, which are not in this set). The webServer in
        # playwright.config.ts serves ../pkg on :8001 automatically.
        if: steps.pages.outputs.built != '0'
        working-directory: tests
        shell: bash
        run: |
          set -euo pipefail
          specs=()
          for block in ${{ steps.shard.outputs.slugs }}; do
            if [ -f "tool-page-$block.spec.ts" ]; then
              specs+=("tool-page-$block.spec.ts")
            else
              echo "No Playwright spec for changed block '$block'"
            fi
          done
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "No changed tool-page specs in this shard; skipping Playwright."
            exit 0
          fi
          # Runner network flakes are the dominant failure mode of a 16-shard
          # fan-out: one morning's run lost five shards to an apt mirror that
          # stalled `playwright install --with-deps` for three hours, and two
          # more to the npm registry timing out. Retry, and bound anything that
          # can hang so a flake costs minutes instead of a runner-hour.
          retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 3 ]; then
                echo "::error::failed after $n attempts: $*"
                return 1
              fi
              echo "attempt $n failed, retrying in 15s: $*"
              n=$((n + 1))
              sleep 15
            done
          }
          # --with-deps shells out to apt-get; fall back to the browser-only
          # install, since the runner image already ships chromium's libraries.
          install_chromium() {
            timeout 300s npx playwright install --with-deps chromium \
              || timeout 300s npx playwright install chromium
          }
          retry npm install --no-audit --no-fund
          retry install_chromium
          for spec in "${specs[@]}"; do
            echo "::group::playwright $spec"
            timeout 180s npx playwright test "$spec" --workers=1 --reporter=line --max-failures=1
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # scripts/sync-tool-manifest.py --check flags a block whose manifest.json
  # tool.description / tool.parameters / summary has drifted from the LIVE
  # descriptor (what chat and the page form actually consume). The tool hygiene
  # gate does NOT cover tool.description drift, so this is the only gate for it.
  # Scoped to the PR's changed blocks: the corpus still carries pre-existing
  # description drift, so a repo-wide gate would be red until it is backfilled —
  # gating the changed blocks stops NEW/regressed drift from landing.
  # `gizza describe` reads the descriptor embedded in the CLI (build.rs
  # statically includes blocks/*/target/block.wasm), so this runs only after the
  # `blocks` shards have proven every committed artifact is exactly the locked
  # build CI just produced.
  # ---------------------------------------------------------------------------
  drift:
    needs: [detect, blocks]
    if: success() && needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    env:
      CHANGED_BLOCKS: ${{ needs.detect.outputs.blocks }}
    steps:
      - name: Free Disk Space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.0'
          targets: wasm32-unknown-unknown,wasm32-wasip1
          components: rust-src

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          cache-targets: false
          key: pr-drift

      - name: Tool descriptor drift check
        shell: bash
        run: |
          set -euo pipefail
          # Build the CLI (reusing the shared cargo target/registry cache) and put
          # the `gizza` binary on PATH; the sync script shells out to `gizza`.
          cargo build --release --manifest-path cli/Cargo.toml
          export PATH="$CARGO_TARGET_DIR/release:$PATH"
          python3 scripts/sync-tool-manifest.py --check $CHANGED_BLOCKS

  # ---------------------------------------------------------------------------
  # Single required status check. Branch protection requires "test"; the real
  # work lives in the jobs above, so this one only aggregates their results.
  # ---------------------------------------------------------------------------
  test:
    if: always()
    needs: [detect, repo, blocks, drift]
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for entry in \
            "detect=${{ needs.detect.result }}" \
            "repo=${{ needs.repo.result }}" \
            "blocks=${{ needs.blocks.result }}" \
            "drift=${{ needs.drift.result }}"; do
            name="${entry%%=*}"
            result="${entry#*=}"
            echo "$name: $result"
            case "$result" in
              success|skipped) ;;
              *) fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more Test jobs failed."
            exit 1
          fi
          echo "All Test jobs passed."

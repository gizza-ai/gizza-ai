name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gizza-ai
        uses: actions/checkout@v4
        with:
          path: gizza-ai

      - name: Read solobase pin
        id: pin
        run: echo "solobase_sha=$(cat gizza-ai/solobase-pin.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Checkout solobase
        uses: actions/checkout@v4
        with:
          repository: suppers-ai/solobase
          ref: ${{ steps.pin.outputs.solobase_sha }}
          path: solobase

      - name: Checkout wafer-run
        # Cargo.lock is gitignored in this repo; using main HEAD here matches
        # what cargo will resolve `branch = "main"` to at build time, so the
        # block-crate path deps and the gizza-ai lib's git deps see the same
        # wafer-run version.
        uses: actions/checkout@v4
        with:
          repository: wafer-run/wafer-run
          ref: main
          path: wafer-run

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gizza-ai
            solobase
            wafer-run

      - name: Build solobase-web wasm
        # Required by solobase's build.rs (it include_bytes!s the wasm).
        # Mirrors solobase/justfile's `build` recipe.
        working-directory: solobase
        run: wasm-pack build crates/solobase-web --target web --release --out-dir pkg

      - name: Build solobase CLI
        run: cargo install --path solobase/crates/solobase --locked

      - name: Build wafer CLI
        run: cargo install --path wafer-run/crates/wafer-cli --locked

      - name: Build site
        working-directory: gizza-ai
        run: solobase build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gizza-ai/pkg

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

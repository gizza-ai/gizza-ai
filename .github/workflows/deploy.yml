name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_HTTP_MULTIPLEXING: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are scoped to the
    # `production` GitHub environment, so the job must target it — otherwise
    # `secrets.*` resolves to empty and wrangler fails with "necessary to set
    # a CLOUDFLARE_API_TOKEN". (The environment's deployment-branch policy
    # must allow `main`, which is the only branch this workflow runs on.)
    environment:
      name: production
      url: https://gizza.ai
    steps:
      - name: Free Disk Space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout gizza-ai
        uses: actions/checkout@v4
        with:
          path: gizza-ai

      - name: Read solobase pin
        id: pin
        run: echo "solobase_sha=$(cat gizza-ai/solobase-pin.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Checkout solobase
        uses: actions/checkout@v4
        with:
          repository: suppers-ai/solobase
          ref: ${{ steps.pin.outputs.solobase_sha }}
          path: solobase

      - name: Checkout wafer-run
        # Cargo.lock is gitignored in this repo; using main HEAD here matches
        # what cargo will resolve `branch = "main"` to at build time, so the
        # block-crate path deps and the gizza-ai lib's git deps see the same
        # wafer-run version.
        uses: actions/checkout@v4
        with:
          repository: wafer-run/wafer-run
          ref: main
          path: wafer-run

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pin explicitly. With no version the action resolves "latest" via
          # the GitHub API and falls back to its ancient hardcoded default
          # (v0.9.1) whenever that lookup flakes/rate-limits — and v0.9.1
          # cannot parse workspace-inherited manifest fields like
          # `license.workspace = true`, failing with "invalid type: map,
          # expected a string for key `package.license`".
          version: 'v0.15.0'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gizza-ai
            solobase
            wafer-run

      - name: Build solobase-web wasm
        # Required by solobase's build.rs (it include_bytes!s the wasm).
        # Mirrors solobase/justfile's `build` recipe.
        working-directory: solobase
        run: wasm-pack build crates/solobase-web --target web --release --out-dir pkg

      - name: Build solobase CLI
        run: cargo install --path solobase/crates/solobase --locked

      - name: Build wafer CLI
        run: cargo install --path wafer-run/crates/wafer-cli --locked

      - name: Build missing skill wasm artifacts
        working-directory: gizza-ai
        shell: bash
        run: |
          set -euo pipefail
          for manifest in blocks/*/manifest.json; do
            block="$(basename "$(dirname "$manifest")")"
            if [ -f "blocks/$block/target/block.wasm" ]; then
              echo "target/block.wasm exists for $block — skipping wafer build"
              continue
            fi
            echo "building missing target/block.wasm for $block"
            (cd "blocks/$block" && wafer build)
          done

      - name: Build site
        working-directory: gizza-ai
        # `--release` is required: without it `solobase build` runs
        # `wasm-pack build --dev`, producing an unoptimized ~29 MB app wasm
        # that Cloudflare Pages rejects (25 MiB/file limit). With `--release`
        # (+ the size-optimized [profile.release] in Cargo.toml) the bundle
        # drops to a few MB. The per-tool wasm-pack builds below already use
        # `--release`.
        run: SOLOBASE_SKIP_BLOCK_BUILD=1 solobase build --release

      - name: Build tool pages
        # Per-tool web wasm + rendered standalone pages into pkg/tools/.
        # Mirrors gizza-ai/justfile's `build-tools` recipe.
        working-directory: gizza-ai
        run: |
          set -euo pipefail
          for dir in blocks/*/page; do
            tool="$(basename "$(dirname "$dir")")"
            if [ -f "blocks/$tool/web/pkg/package.json" ]; then
              echo "web/pkg exists for $tool — skipping wasm-pack"
              continue
            fi
            echo "building missing web/pkg for $tool"
            wasm-pack build "blocks/$tool/web" --target web --release --out-dir pkg
          done
          cargo run --manifest-path tools/generator/Cargo.toml -- .

      - name: Build gizza CLI
        run: cargo install --path gizza-ai/cli

      - name: Generate SEO files
        working-directory: gizza-ai
        run: scripts/gen-seo.sh

      - name: Ensure Pages project exists
        # `pages deploy` does NOT create the project — a fresh account fails
        # with "Project not found ... [code: 8000007]". Create it once if
        # missing (idempotent: skipped when it already exists). Requires the
        # API token to carry the "Cloudflare Pages: Edit" permission; a
        # read-only token will fail loudly here rather than at the deploy step.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4.100.0 pages project list \
               | grep -qE '(^|[^A-Za-z0-9_-])gizza-ai([^A-Za-z0-9_-]|$)'; then
            echo "Pages project 'gizza-ai' already exists — skipping create."
          else
            echo "Pages project 'gizza-ai' not found — creating it."
            npx --yes wrangler@4.100.0 pages project create gizza-ai --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        # workingDirectory is gizza-ai so wrangler finds the sibling `functions/`
        # directory (the Pages Functions middleware that does the *.gizza.ai
        # subdomain rewrite) next to the deployed `pkg/` assets.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gizza-ai
          command: pages deploy pkg --project-name=gizza-ai --branch=main

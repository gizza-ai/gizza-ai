name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: "Cloudflare Pages branch to deploy to. 'main' = production (gizza.ai); any other value deploys to a preview URL (<value>.gizza-ai.pages.dev) for testing without touching production."
        required: false
        default: main

env:
  CARGO_HTTP_MULTIPLEXING: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are scoped to the
    # `production` GitHub environment, so the job must target it — otherwise
    # `secrets.*` resolves to empty and wrangler fails with "necessary to set
    # a CLOUDFLARE_API_TOKEN". (The environment's deployment-branch policy
    # must allow `main`, which is the only branch this workflow runs on.)
    environment:
      name: production
      url: https://gizza.ai
    steps:
      - name: Free Disk Space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout gizza-ai
        uses: actions/checkout@v4
        with:
          path: gizza-ai
          # Full history: gen-seo.sh derives sitemap <lastmod> from git log.
          fetch-depth: 0

      - name: Read solobase pin
        id: pin
        run: echo "solobase_sha=$(cat gizza-ai/solobase-pin.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Read wafer-run pin
        id: waferpin
        run: echo "wafer_sha=$(cat gizza-ai/wafer-run-pin.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Checkout solobase
        uses: actions/checkout@v4
        with:
          repository: suppers-ai/solobase
          ref: ${{ steps.pin.outputs.solobase_sha }}
          path: solobase

      - name: Checkout wafer-run
        # Pinned via wafer-run-pin.txt so wafer-run main breakage can't land in
        # deploys. The committed Cargo.lock files pin the cargo builds to the
        # same sha (enforced by "Verify wafer-run pin consistency" below); this
        # checkout keeps the wafer CLI on that sha too.
        uses: actions/checkout@v4
        with:
          repository: wafer-run/wafer-run
          ref: ${{ steps.waferpin.outputs.wafer_sha }}
          path: wafer-run

      - name: Verify wafer-run pin consistency
        # Every cargo root that feeds this deploy must pin the same wafer-run
        # sha as wafer-run-pin.txt — a half-bumped pin fails here in seconds
        # with a clear message instead of 40 minutes into the build (or worse,
        # silently deploying a mixed wafer-run combination).
        shell: bash
        run: |
          set -euo pipefail
          pin="$(tr -d '[:space:]' < gizza-ai/wafer-run-pin.txt)"
          fail=0
          for lock in gizza-ai/Cargo.lock gizza-ai/cli/Cargo.lock gizza-ai/block-utils/Cargo.lock solobase/Cargo.lock; do
            shas="$(grep -o 'github.com/wafer-run/wafer-run[^"]*#[0-9a-f]*' "$lock" | sed 's/.*#//' | sort -u)"
            if [ "$shas" != "$pin" ]; then
              echo "::error::$lock pins wafer-run at '${shas:-<none>}' but wafer-run-pin.txt says '$pin'."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Bump procedure: update wafer-run-pin.txt, run 'cargo update' in gizza-ai/, cli/, and block-utils/, and point solobase-pin.txt at a solobase commit whose Cargo.lock pins the same wafer-run sha."
            exit 1
          fi
          echo "All lockfiles agree with wafer-run-pin.txt ($pin)."

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip1

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pin explicitly. With no version the action resolves "latest" via
          # the GitHub API and falls back to its ancient hardcoded default
          # (v0.9.1) whenever that lookup flakes/rate-limits — and v0.9.1
          # cannot parse workspace-inherited manifest fields like
          # `license.workspace = true`, failing with "invalid type: map,
          # expected a string for key `package.license`".
          version: 'v0.15.0'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gizza-ai
            solobase
            wafer-run

      - name: Build solobase-web wasm
        # Required by solobase's build.rs (it include_bytes!s the wasm).
        # Mirrors solobase/justfile's `build` recipe.
        working-directory: solobase
        run: wasm-pack build crates/solobase-web --target web --release --out-dir pkg

      - name: Build solobase CLI
        run: cargo install --path solobase/crates/solobase --locked

      - name: Build wafer CLI
        run: cargo install --path wafer-run/crates/wafer-cli --locked

      - name: Audit missing skill wasm artifacts
        working-directory: gizza-ai
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for manifest in blocks/*/manifest.json; do
            block="$(basename "$(dirname "$manifest")")"
            if [ ! -f "blocks/$block/target/block.wasm" ]; then
              missing=$((missing + 1))
            fi
          done
          echo "Missing committed blocks/*/target/block.wasm artifacts: $missing"
          echo "Skipping rebuild here; deploy reuses committed artifacts and standalone tool pages are generated separately."

      - name: Build site
        working-directory: gizza-ai
        # `--release` is required: without it `solobase build` runs
        # `wasm-pack build --dev`, producing an unoptimized ~29 MB app wasm
        # that Cloudflare Pages rejects (25 MiB/file limit). With `--release`
        # (+ the size-optimized [profile.release] in Cargo.toml) the bundle
        # drops to a few MB. The per-tool wasm-pack builds below already use
        # `--release`.
        run: SOLOBASE_SKIP_BLOCK_BUILD=1 solobase build --release

      - name: Build tool pages
        # Per-tool web wasm + rendered standalone pages into pkg/tools/.
        # Mirrors gizza-ai/justfile's `build-tools` recipe.
        working-directory: gizza-ai
        run: |
          set -euo pipefail
          for dir in blocks/*/page; do
            tool="$(basename "$(dirname "$dir")")"
            if [ -f "blocks/$tool/web/pkg/package.json" ]; then
              echo "web/pkg exists for $tool — skipping wasm-pack"
              continue
            fi
            echo "building missing web/pkg for $tool"
            wasm-pack build "blocks/$tool/web" --target web --release --out-dir pkg
          done
          cargo run --manifest-path tools/generator/Cargo.toml -- .

      - name: Publish skill block wasm as static assets
        # The chat app no longer embeds block wasm into gizza_ai_bg.wasm (see
        # build.rs / src/lazy_skill.rs) — it fetches /blocks/<slug>.wasm on first
        # use. Publish each committed block.wasm as a separate static asset so
        # the app wasm stays small and under Cloudflare's 25 MiB/file limit
        # regardless of how many tools accumulate.
        working-directory: gizza-ai
        run: |
          set -euo pipefail
          mkdir -p pkg/blocks
          count=0
          for wasm in blocks/*/target/block.wasm; do
            [ -f "$wasm" ] || continue
            slug="$(basename "$(dirname "$(dirname "$wasm")")")"
            cp "$wasm" "pkg/blocks/$slug.wasm"
            count=$((count + 1))
          done
          echo "Published $count skill block wasm assets to pkg/blocks/"

      - name: Build gizza CLI
        # --locked: respect the committed cli/Cargo.lock (cargo install ignores
        # lockfiles otherwise), keeping the CLI's wafer-run deps on the pin.
        run: cargo install --path gizza-ai/cli --locked

      - name: Generate SEO files
        working-directory: gizza-ai
        run: scripts/gen-seo.sh

      - name: Ensure Pages project exists
        # `pages deploy` does NOT create the project — a fresh account fails
        # with "Project not found ... [code: 8000007]". Create it once if
        # missing (idempotent: skipped when it already exists). Requires the
        # API token to carry the "Cloudflare Pages: Edit" permission; a
        # read-only token will fail loudly here rather than at the deploy step.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4.100.0 pages project list \
               | grep -qE '(^|[^A-Za-z0-9_-])gizza-ai([^A-Za-z0-9_-]|$)'; then
            echo "Pages project 'gizza-ai' already exists — skipping create."
          else
            echo "Pages project 'gizza-ai' not found — creating it."
            npx --yes wrangler@4.100.0 pages project create gizza-ai --production-branch=main
          fi

      - name: Guard against oversized assets
        # Cloudflare Pages rejects any single file > 25 MiB. Fail here with a
        # clear message instead of cryptically at the wrangler upload — this is
        # the failure mode that silently broke every deploy from 2026-07-03 on
        # once the app wasm had embedded ~47 skill blocks (26 MiB).
        working-directory: gizza-ai
        run: |
          set -euo pipefail
          limit=$((25 * 1024 * 1024))
          big="$(find pkg -type f -size +${limit}c -printf '%s\t%p\n' 2>/dev/null || true)"
          if [ -n "$big" ]; then
            echo "::error::Files exceed Cloudflare Pages' 25 MiB/file limit:"
            echo "$big" | awk '{ printf "  %.1f MiB  %s\n", $1/1048576, $2 }'
            exit 1
          fi
          echo "All pkg/ files are within Cloudflare Pages' 25 MiB/file limit."

      - name: Deploy to Cloudflare Pages
        # workingDirectory is gizza-ai so wrangler finds the sibling `functions/`
        # directory (the Pages Functions middleware that 301-redirects the
        # gizza-ai.pages.dev project subdomain to the canonical gizza.ai
        # domain) next to the deployed `pkg/` assets.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gizza-ai
          command: pages deploy pkg --project-name=gizza-ai --branch=${{ github.event.inputs.deploy_branch || 'main' }}

      - name: Ping IndexNow
        # Tell IndexNow-capable search engines which URLs this push changed.
        # `github.event.before` is all-zeros on a force-push / first push of a
        # branch and empty on workflow_dispatch — skip gracefully then. The
        # script itself never fails the job: an unresolvable range, an empty
        # URL list, and network/HTTP errors all warn and exit 0.
        working-directory: gizza-ai
        env:
          RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: |
          case "$RANGE" in
            ..* | 0000000000000000000000000000000000000000..*)
              echo "No usable 'before' SHA in range '$RANGE' — skipping IndexNow ping."
              ;;
            *)
              scripts/indexnow-ping.sh
              ;;
          esac
